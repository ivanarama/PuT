name: НакладнаяНаПеремещение
document: ПеремещениеТоваров
title: "Накладная на перемещение № {{Номер}} от {{Дата | date}}"

header: |
  **Организация**: {{Константы.НашаОрганизация}}

  **Склад-отправитель**: {{СкладОтправитель.Наименование}}

  **Склад-получатель**: {{СкладПолучатель.Наименование}}

table:
  source: Товары
  columns:
    - field: "@row"
      label: "№"
      width: 40px
    - field: Номенклатура.Наименование
      label: Наименование
    - field: Количество
      label: Количество
      align: right
      format: "number:0"
    - field: Себестоимость
      label: Себестоимость, руб.
      align: right
      format: "number:2"
  totals:
    - field: Количество
      sum: true
    - field: Себестоимость
      sum: true
      label: "Итого"

footer: |
  ___

  Отпустил: _________________________ Получил: _________________________
