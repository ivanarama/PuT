name: ПлатёжноеПоручение
document: СписаниеСРасчётногоСчёта
areas:
    - name: Заголовок
      rows:
        - cells:
            - text: Платёжное поручение № {{НомерПлатёжки}} от {{ДатаПлатёжки | date}}
              bold: true
              align: center
              fontSize: 14
              colspan: 1
    - name: Шапка
      rows:
        - cells:
            - text: Платёжное поручение № {{НомерПлатёжки}} от {{ДатаПлатёжки | date}}
              bold: true
              fontSize: 14
              colspan: 1
        - cells:
            - colspan: 1
        - cells:
            - text: 'Плательщик: {{Константы.НашаОрганизация.Наименование}}'
              colspan: 1
        - cells:
            - colspan: 1
        - cells:
            - text: 'Счёт плательщика: {{БанковскийСчёт.НомерСчёта}}'
              colspan: 1
        - cells:
            - colspan: 1
        - cells:
            - text: 'Банк плательщика: {{БанковскийСчёт.Банк}}, БИК {{БанковскийСчёт.БИК}}'
              colspan: 1
        - cells:
            - colspan: 1
        - cells:
            - colspan: 1
              borders:
                bottom: thin
        - cells:
            - colspan: 1
        - cells:
            - text: 'Получатель: {{Контрагент.ПолноеНаименование}}'
              colspan: 1
        - cells:
            - colspan: 1
        - cells:
            - text: 'ИНН: {{Контрагент.ИНН}}, КПП: {{Контрагент.КПП}}'
              colspan: 1
        - cells:
            - colspan: 1
        - cells:
            - text: 'Счёт получателя: {{Контрагент.РасчётныйСчёт}}'
              colspan: 1
        - cells:
            - colspan: 1
        - cells:
            - text: 'Банк получателя: {{Контрагент.НаименованиеБанка}}, БИК {{Контрагент.БИК}}'
              colspan: 1
        - cells:
            - colspan: 1
        - cells:
            - text: 'Корр. счёт: {{Контрагент.КорреспондентскийСчёт}}'
              colspan: 1
        - cells:
            - colspan: 1
        - cells:
            - text: 'Сумма: {{Сумма | number:2}} руб.'
              colspan: 1
        - cells:
            - colspan: 1
        - cells:
            - text: 'Назначение платежа: {{НазначениеПлатежа}}'
              colspan: 1
        - cells:
            - colspan: 1
    - name: Подвал
      rows:
        - cells:
            - colspan: 1
              borders:
                bottom: thin
        - cells:
            - colspan: 1
        - cells:
            - text: 'Руководитель:      _________________________'
              colspan: 1
        - cells:
            - colspan: 1
        - cells:
            - text: 'Главный бухгалтер: _________________________'
              colspan: 1
        - cells:
            - colspan: 1
        - cells:
            - text: МП
              colspan: 1
        - cells:
            - colspan: 1
binding:
    sequence:
        - Заголовок
        - Шапка
        - Подвал
