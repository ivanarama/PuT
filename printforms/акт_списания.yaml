name: АктСписания
document: СписаниеТоваров
title: "Акт списания № {{Номер}} от {{Дата | date}}"

header: |
  **Организация**: {{Константы.НашаОрганизация}}

  **Склад**: {{Склад.Наименование}}

  **Причина списания**: {{Причина}}

table:
  source: Товары
  columns:
    - field: "@row"
      label: "№"
      width: 40px
    - field: Номенклатура.Наименование
      label: Наименование
    - field: Количество
      label: Количество
      align: right
      format: "number:0"
    - field: Себестоимость
      label: Себестоимость, руб.
      align: right
      format: "number:2"
  totals:
    - field: Себестоимость
      sum: true
      label: "Итого"

footer: |
