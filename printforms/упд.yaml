header: |
  ## Универсальный передаточный документ

  **Счёт-фактура № {{Номер}} от {{Дата | date}}**

  *(1) Приложение № 1 к постановлению Правительства РФ от 26 декабря 2011 г. № 1137*

  Исправление № -- от --

  **(2) Продавец:** {{Организация.ПолноеНаименование}}

  **(2а) Адрес:** {{Организация.ЮридическийАдрес}}

  **(2б) ИНН/КПП продавца:** {{Организация.ИНН}} / {{Организация.КПП}}

  ___

  **(6) Покупатель:** {{Покупатель.ПолноеНаименование}}

  **(6а) Статус:** 2

  *(2 — передаточный документ (акт))*

  **(6а) Адрес:** {{Покупатель.ЮридическийАдрес}}

  **(6б) ИНН/КПП покупателя:** {{Покупатель.ИНН}} / {{Покупатель.КПП}}

  ___

  **(3) Грузоотправитель и его адрес:** он же

  **(4) Грузополучатель и его адрес:** {{Покупатель.ПолноеНаименование}}, {{Покупатель.ФактическийАдрес}}

  **(5) К платёжно-расчётному документу №** -- от --

  **(5а) Документ об отгрузке:** УПД № {{Номер}} от {{Дата | date}}

  **(7) Валюта:** Российский рубль, 643

