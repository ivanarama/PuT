name: АктОприходования
document: ОприходованиеТоваров
title: "Акт оприходования № {{Номер}} от {{Дата | date}}"

header: |
  **Организация**: {{Константы.НашаОрганизация}}

  **Склад**: {{Склад.Наименование}}

  **Причина**: {{Причина}}

table:
  source: Товары
  columns:
    - field: "@row"
      label: "№"
      width: 40px
    - field: Номенклатура.Наименование
      label: Наименование
    - field: Количество
      label: Количество
      align: right
      format: "number:0"
    - field: Цена
      label: Учётная цена, руб.
      align: right
      format: "number:2"
    - field: Сумма
      label: Сумма, руб.
      align: right
      format: "number:2"
  totals:
    - field: Количество
      sum: true
    - field: Сумма
      sum: true
      label: "Итого"

footer: |
