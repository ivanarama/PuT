query: |
  ВЫБРАТЬ
    "Номенклатура" КАК Справочник,
    КОЛИЧЕСТВО(*) КАК Кол
  ИЗ Справочник.Номенклатура
  ОБЪЕДИНИТЬ ВСЕ
  ВЫБРАТЬ
    "Контрагенты",
    КОЛИЧЕСТВО(*)
  ИЗ Справочник.Контрагент
  ОБЪЕДИНИТЬ ВСЕ
  ВЫБРАТЬ
    "Склады",
    КОЛИЧЕСТВО(*)
  ИЗ Справочник.Склад
  ОБЪЕДИНИТЬ ВСЕ
  ВЫБРАТЬ
    "Организации",
    КОЛИЧЕСТВО(*)
  ИЗ Справочник.Организация
