name: ДенежныйПоток
type: chart
chart_kind: bar
title: Движение денежных средств за 30 дней
titles:
  en: Cash flow over 30 days
  de: Geldverkehr der letzten 30 Tage
  sr: Новчани токови за 30 дана
params:
  Начало: "{{today|minus_days:30}}"
query: |
  ВЫБРАТЬ
    date(period) КАК Дата,
    СУММА(ВЫБОР КОГДА вид_движения = "Приход" ТОГДА Сумма ИНАЧЕ 0 КОНЕЦ) КАК Приход,
    СУММА(ВЫБОР КОГДА вид_движения = "Расход" ТОГДА Сумма ИНАЧЕ 0 КОНЕЦ) КАК Расход
  ИЗ РегистрНакопления.ДенежныеСредства
  ГДЕ period >= &Начало
  СГРУППИРОВАТЬ ПО date(period)
  УПОРЯДОЧИТЬ ПО date(period)
x_field: Дата
y_fields: [Приход, Расход]
