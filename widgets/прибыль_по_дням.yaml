name: ПрибыльПоДням
type: chart
chart_kind: bar
title: Прибыль за квартал
titles:
  en: Profit over quarter
  de: Gewinn des Quartals
  sr: Добит за квартал
  az: Rüblük mənfəət
  es: Beneficio trimestral
  fr: Bénéfice trimestriel
  hy: "Եռամսյակային շահույթ"
  ka: "კვარტალური მოგება"
  kk: "Тоқсандық пайда"
  pt: "Lucro trimestrial"
  ro: "Profit trimestrial"
  tr: "Çeyreklik kâr"
  uk: "Прибуток за квартал"
  uz: "Choraklik foyda"
  zh: "季度利润"
params:
  Начало: "{{today|minus_days:90}}"
query: |
  ВЫБРАТЬ
    strftime('%Y-%m', period) КАК Месяц,
    CAST(ROUND(СУММА(СуммаСНДС), 0) AS INTEGER) КАК Выручка,
    CAST(ROUND(СУММА(Себестоимость), 0) AS INTEGER) КАК Себестоимость,
    CAST(ROUND(СУММА(СуммаСНДС) - СУММА(Себестоимость), 0) AS INTEGER) КАК Прибыль
  ИЗ РегистрНакопления.ВаловаяПрибыль
  ГДЕ period >= &Начало
  СГРУППИРОВАТЬ ПО strftime('%Y-%m', period)
  УПОРЯДОЧИТЬ ПО strftime('%Y-%m', period)
x_field: Месяц
y_fields: [Выручка, Прибыль]
