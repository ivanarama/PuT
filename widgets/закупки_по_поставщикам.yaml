chart_kind: pie
name: ЗакупкиПоПоставщикам
params:
  Начало: '{{today|minus_days:120}}'
query: |
  ВЫБРАТЬ
    Контрагент,
    CAST(ROUND(СУММА(Сумма), 0) AS INTEGER) КАК Сумма
  ИЗ РегистрНакопления.Взаиморасчеты
  ГДЕ ТипКонтрагента = "Поставщик"
    И вид_движения = "Расход"
    И period >= &Начало
  СГРУППИРОВАТЬ ПО Контрагент
  УПОРЯДОЧИТЬ ПО Сумма УБЫВ
refresh_on:
  - данные.корректировкадолга
  - данные.поступлениенарасчётныйсчёт
  - данные.поступлениетоваров
  - данные.приходныйкассовыйордер
  - данные.расходныйкассовыйордер
  - данные.реализациятоваров
  - данные.списаниесрасчётногосчёта
