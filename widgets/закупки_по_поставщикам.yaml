params:
  Начало: "{{today|minus_days:120}}"
query: |
  ВЫБРАТЬ
    Контрагент,
    CAST(СУММА(Сумма) AS INTEGER) КАК Сумма
  ИЗ РегистрНакопления.Взаиморасчеты
  ГДЕ ТипКонтрагента = "Поставщик"
    И вид_движения = "Расход"
    И period >= &Начало
  СГРУППИРОВАТЬ ПО Контрагент
  УПОРЯДОЧИТЬ ПО Сумма УБЫВ
x_field: Контрагент
y_fields: [Сумма]
