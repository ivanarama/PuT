name: ОстаткиНаСкладах
query: |
  ВЫБРАТЬ
    Номенклатура.Ссылка КАК ИдСтроки,
    Номенклатура,
    СУММА(КоличествоОстаток) КАК Количество,
    CAST(ROUND(СУММА(СуммаОстаток), 0) AS INTEGER) КАК Сумма
  ИЗ РегистрНакопления.ОстаткиТоваров.Остатки()
  ГДЕ КоличествоОстаток > 0
  СГРУППИРОВАТЬ ПО Номенклатура.Ссылка, Номенклатура
  УПОРЯДОЧИТЬ ПО Сумма УБЫВ
