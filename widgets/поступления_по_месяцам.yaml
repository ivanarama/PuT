name: ПоступленияПоМесяцам
type: chart
chart_kind: bar
title: Поступления по месяцам
titles:
  en: Receipts by month
  de: Wareneingänge nach Monat
  sr: Пријеми по месецима
  az: Aylar üzrə daxilolmalar
  es: Entradas por mes
  fr: Réceptions par mois
  hy: "Մուտքեր ըստ ամիսների"
  ka: "მიღებები თვეების მიხედვით"
  kk: "Айлар бойынша түсімдер"
  pt: "Entradas por mês"
  ro: "Recepții pe luni"
  tr: "Aylara göre girişler"
  uk: "Надходження за місяцями"
  uz: "Oylar bo'yicha kirimlar"
  zh: "按月入库"
params:
  Начало: "{{today|minus_days:180}}"
query: |
  ВЫБРАТЬ
    strftime('%Y-%m', Дата) КАК Месяц,
    CAST(ROUND(СУММА(Сумма), 0) AS INTEGER) КАК Сумма
  ИЗ Документ.ПоступлениеТоваров
  ГДЕ Дата >= &Начало
  СГРУППИРОВАТЬ ПО strftime('%Y-%m', Дата)
  УПОРЯДОЧИТЬ ПО strftime('%Y-%m', Дата)
x_field: Месяц
y_fields: [Сумма]
