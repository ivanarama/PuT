name: НеликвидыСписок
query: |
  ВЫБРАТЬ
    Номенклатура.Ссылка КАК ИдСтроки,
    Номенклатура,
    Минимум(ДатаПоставки) КАК ДатаПоставки,
    СУММА(КоличествоОстаток) КАК Количество,
    CAST(ROUND(СУММА(СуммаОстаток), 0) AS INTEGER) КАК Себестоимость
  ИЗ РегистрНакопления.ПартииТоваров.Остатки()
  ГДЕ КоличествоОстаток > 0
  СГРУППИРОВАТЬ ПО Номенклатура.Ссылка, Номенклатура
  УПОРЯДОЧИТЬ ПО ДатаПоставки
