chart_kind: bar
name: ПродажиПоДням
params:
  Начало: '{{today|minus_days:90}}'
query: |
  ВЫБРАТЬ
    strftime('%Y-%m', Дата) КАК Месяц,
    CAST(ROUND(СУММА(Сумма), 0) AS INTEGER) КАК Сумма
  ИЗ Документ.РеализацияТоваров
  ГДЕ Дата >= &Начало И posted = Истина
  СГРУППИРОВАТЬ ПО strftime('%Y-%m', Дата)
  УПОРЯДОЧИТЬ ПО strftime('%Y-%m', Дата)
refresh_on:
  - данные.реализациятоваров
