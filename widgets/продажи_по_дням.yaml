  ВЫБРАТЬ
    strftime('%Y-%m', Дата) КАК Месяц,
    CAST(СУММА(Сумма) AS INTEGER) КАК Сумма
  ИЗ Документ.РеализацияТоваров
  ГДЕ Дата >= &Начало
  СГРУППИРОВАТЬ ПО strftime('%Y-%m', Дата)
