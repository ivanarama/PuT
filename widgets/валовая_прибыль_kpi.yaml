format: number
name: ВаловаяПрибыльМесяца
params:
  Начало: "{{today|minus_days:30}}"
query: |
  ВЫБРАТЬ CAST(ROUND(СУММА(ВЫБОР КОГДА вид_движения = "Приход" ТОГДА 1 ИНАЧЕ -1 КОНЕЦ * (ВЫБОР КОГДА СуммаСНДС ЕСТЬ НЕ NULL И СуммаСНДС <> 0 ТОГДА СуммаСНДС ИНАЧЕ Выручка КОНЕЦ)) - СУММА(ВЫБОР КОГДА вид_движения = "Приход" ТОГДА 1 ИНАЧЕ -1 КОНЕЦ * (ВЫБОР КОГДА СебестоимостьСНДС ЕСТЬ НЕ NULL И СебестоимостьСНДС <> 0 ТОГДА СебестоимостьСНДС ИНАЧЕ Себестоимость КОНЕЦ)), 0) AS INTEGER) КАК Значение
  ИЗ РегистрНакопления.ВаловаяПрибыль
  ГДЕ period >= &Начало
