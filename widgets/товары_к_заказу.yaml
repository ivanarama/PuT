name: ТоварыКЗаказу
query: |
  ВЫБРАТЬ
    Н.Ссылка КАК ИдСтроки,
    Н.Наименование КАК Номенклатура,
    CAST(Н.МинимальныйОстаток AS NUMERIC) КАК Минимум,
    COALESCE(СУММА(ВЫБОР КОГДА Д.вид_движения = "Приход" ТОГДА Д.Количество ИНАЧЕ -Д.Количество КОНЕЦ), 0) КАК Остаток
  ИЗ Справочник.Номенклатура КАК Н
    ЛЕВОЕ СОЕДИНЕНИЕ РегистрНакопления.ОстаткиТоваров КАК Д
    ПО Д.Номенклатура = Н.Ссылка
  ГДЕ CAST(Н.МинимальныйОстаток AS NUMERIC) > 0
  СГРУППИРОВАТЬ ПО Н.Ссылка, Н.Наименование, Н.МинимальныйОстаток
  ИМЕЯ COALESCE(СУММА(ВЫБОР КОГДА Д.вид_движения = "Приход" ТОГДА Д.Количество ИНАЧЕ -Д.Количество КОНЕЦ), 0) < CAST(Н.МинимальныйОстаток AS NUMERIC)
  УПОРЯДОЧИТЬ ПО Остаток
