    name: Покупатель
    param: Покупатель
    type: reference:Контрагент
limit: 5
name: ТопПокупатели
params:
  Начало: '{{today|start_of_month}}'
query: |
  ВЫБРАТЬ
    Покупатель.Ссылка КАК ИдСтроки,
    Покупатель,
    КОЛИЧЕСТВО(*) КАК Реализаций,
    CAST(ROUND(СУММА(Сумма), 0) AS INTEGER) КАК Сумма
  ИЗ Документ.РеализацияТоваров
  ГДЕ Дата >= &Начало И posted = Истина И (&Покупатель ЕСТЬ NULL ИЛИ Покупатель = &Покупатель)
  СГРУППИРОВАТЬ ПО Покупатель.Ссылка, Покупатель
  УПОРЯДОЧИТЬ ПО Сумма УБЫВ
refresh_on:
  - данные.реализациятоваров
source:
  entity: Контрагент
  id_field: ИдСтроки
