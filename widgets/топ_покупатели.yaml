name: ТопПокупатели
type: list
title: Топ покупатели за месяц
titles:
  en: Top customers (month)
  de: Top-Kunden (Monat)
  sr: Топ купци (месец)
  az: Ən yaxşı alıcılar (ay)
  es: Top clientes (mes)
  fr: Top clients (mois)
  hy: "Լավագույն գնորդներ (ամիս)"
  ka: "საუკეთესო მყიდველები (თვე)"
  kk: "Топ сатып алушылар (ай)"
  pt: "Top clientes (mês)"
  ro: "Top clienți (lună)"
  tr: "En iyi müşteriler (ay)"
  uk: "Топ покупці (місяць)"
  uz: "Top xaridorlar (oy)"
  zh: "月度热门客户"
limit: 5
params:
  Начало: "{{today|minus_days:30}}"
query: |
  ВЫБРАТЬ
    Покупатель,
    КОЛИЧЕСТВО(*) КАК Реализаций,
    CAST(ROUND(СУММА(Сумма), 0) AS INTEGER) КАК Сумма
  ИЗ Документ.РеализацияТоваров
  ГДЕ Дата >= &Начало
  СГРУППИРОВАТЬ ПО Покупатель
  УПОРЯДОЧИТЬ ПО Сумма УБЫВ
columns:
  - field: Покупатель
    label: "Покупатель"
    labels:
      en: "Customer"
      de: "Kunde"
      sr: "Купац"
      az: "Alıcı"
      es: "Cliente"
      fr: "Client"
      hy: "Գնորդ"
      ka: "მყიდველი"
      kk: "Сатып алушы"
      pt: "Cliente"
      ro: "Client"
      tr: "Müşteri"
      uk: "Покупець"
      uz: "Xaridor"
      zh: "客户"
  - field: Реализаций
    label: "Реализаций"
    labels:
      en: "Sales"
      de: "Verkäufe"
      sr: "Продаја"
      az: "Satışlar"
      es: "Ventas"
      fr: "Ventes"
      hy: "Վաճառք"
      ka: "გაყიდვები"
      kk: "Сатылымдар"
      pt: "Vendas"
      ro: "Vânzări"
      tr: "Satışlar"
      uk: "Реалізацій"
      uz: "Sotuvlar"
      zh: "销售笔数"
    format: number
    align: right
  - field: Сумма
    label: "Сумма"
    labels:
      en: "Amount"
      de: "Betrag"
      sr: "Износ"
      az: "Məbləğ"
      es: "Importe"
      fr: "Montant"
      hy: "Գումაր"
      ka: "თანხა"
