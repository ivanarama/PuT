  ВЫБРАТЬ
    ЗаказПоставщику,
    Номенклатура,
    КоличествоОстаток КАК Количество,
    CAST(СуммаОстаток AS INTEGER) КАК Сумма
  ИЗ РегистрНакопления.ТоварыВПути.Остатки()
  ГДЕ КоличествоОстаток > 0
  УПОРЯДОЧИТЬ ПО Сумма УБЫВ
