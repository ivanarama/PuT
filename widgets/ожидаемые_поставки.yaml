    name: Склад
    param: Склад
    type: reference:Склад
limit: 10
name: ОжидаемыеПоставки
query: |
  ВЫБРАТЬ
    Т.ЗаказПоставщику.Ссылка КАК ИдСтроки,
    Т.ЗаказПоставщику КАК ЗаказПоставщику,
    Т.Номенклатура КАК Номенклатура,
    СУММА(ВЫБОР КОГДА Т.вид_движения = "Приход" ТОГДА Т.Количество ИНАЧЕ -Т.Количество КОНЕЦ) КАК Количество,
    CAST(ROUND(СУММА(ВЫБОР КОГДА Т.вид_движения = "Приход" ТОГДА Т.Сумма ИНАЧЕ -Т.Сумма КОНЕЦ), 0) AS INTEGER) КАК Сумма
  ИЗ РегистрНакопления.ТоварыВПути КАК Т
  ГДЕ (&Склад ЕСТЬ NULL ИЛИ Т.Склад = &Склад)
  СГРУППИРОВАТЬ ПО Т.ЗаказПоставщику.Ссылка, Т.ЗаказПоставщику, Т.Номенклатура
  ИМЕЯ СУММА(ВЫБОР КОГДА Т.вид_движения = "Приход" ТОГДА Т.Количество ИНАЧЕ -Т.Количество КОНЕЦ) > 0
  УПОРЯДОЧИТЬ ПО Сумма УБЫВ
refresh_on:
  - данные.заказпоставщику
