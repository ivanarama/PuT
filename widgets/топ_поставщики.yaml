name: ТопПоставщики
type: list
title: Топ поставщики за квартал
titles:
  en: Top suppliers (quarter)
  de: Top-Lieferanten (Quartal)
  sr: Топ добављачи (квартал)
  az: Ən yaxşı təchizatçılar (rüblük)
  es: Top proveedores (trimestre)
  fr: Top fournisseurs (trimestre)
  hy: Լավագույն մատակարարներ (եռամսակ)
  ka: საუკეთესო მომწოდებლები (კვარტალი)
  kk: Топ жабдықтаушылар (тоқсан)
  pt: Top fornecedores (trimestre)
  ro: Top furnizori (trimestru)
  tr: En iyi tedarikçiler (çeyrek)
  uk: Топ постачальники (квартал)
  uz: Top yetkazib beruvchilar (chorak)
  zh: 季度热门供应商
limit: 5
params:
  Начало: "{{today|minus_days:120}}"
query: |
  ВЫБРАТЬ
    Контрагент,
    CAST(ROUND(СУММА(Сумма), 0) AS INTEGER) КАК Сумма
  ИЗ РегистрНакопления.Взаиморасчеты
  ГДЕ ТипКонтрагента = "Поставщик"
    И вид_движения = "Расход"
    И period >= &Начало
  СГРУППИРОВАТЬ ПО Контрагент
  УПОРЯДОЧИТЬ ПО Сумма УБЫВ
columns:
  - field: Контрагент
    label: "Поставщик"
    labels:
      en: "Supplier"
      de: "Lieferant"
      sr: "Добављач"
      az: "Təchizatçı"
      es: "Proveedor"
      fr: "Fournisseur"
      hy: "Մատակարար"
      ka: "მომწოდებელი"
      kk: "Жабдықтаушы"
      pt: "Fornecedor"
      ro: "Furnizor"
      tr: "Tedarikçi"
      uk: "Постачальник"
      uz: "Yetkazib beruvchi"
      zh: "供应商"
  - field: Сумма
    label: "Сумма закупок"
    labels:
      en: "Purchase amount"
      de: "Einkaufsbetrag"
      sr: "Износ набавке"
      az: "Satınalma məbləği"
      es: "Importe compras"
      fr: "Montant achats"
      hy: "Գնումների գումար"
      ka: "შესყიდვის თანხა"
      kk: "Сатып алу сомасы"
      pt: "Valor compras"
      ro: "Sumă achiziții"
      tr: "Satın alma tutarı"
      uk: "Сума закупівель"
      uz: "Xarid miqdori"
      zh: "采购金额"
    format: number
    align: right
