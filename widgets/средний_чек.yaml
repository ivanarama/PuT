format: number
name: СреднийЧек
params:
  Начало: "{{today|minus_days:30}}"
query: |
  ВЫБРАТЬ
    ВЫБОР КОГДА т.Чеков > 0
      ТОГДА CAST(ROUND(т.Выр / т.Чеков, 0) AS INTEGER)
      ИНАЧЕ 0 КОНЕЦ КАК Значение
  ИЗ (ВЫБРАТЬ
        СУММА(ВЫБОР КОГДА вид_движения = "Приход" ТОГДА 1 ИНАЧЕ -1 КОНЕЦ * (ВЫБОР КОГДА СуммаСНДС ЕСТЬ НЕ NULL И СуммаСНДС <> 0 ТОГДА СуммаСНДС ИНАЧЕ Выручка КОНЕЦ)) КАК Выр,
        КОЛИЧЕСТВО(РАЗЛИЧНЫЕ ВЫБОР КОГДА вид_движения = "Приход" ТОГДА Регистратор КОНЕЦ) КАК Чеков
      ИЗ РегистрНакопления.ВаловаяПрибыль
      ГДЕ period >= &Начало) КАК т
title: Средний чек за месяц
