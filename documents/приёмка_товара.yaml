# АРМ Приёмки (posting: false): приём товара по заказу поставщику со сверкой
# (Расхождение = Принято − Заказано). Создаёт и проводит ПоступлениеТоваров —
# оно закрывает товары в пути, пишет партии FIFO и долг поставщику.
posting: false
