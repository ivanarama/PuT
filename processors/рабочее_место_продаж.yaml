name: РабочееМестоПродаж
title: АРМ Продавца
titles:
  en: Sales workplace
  de: Verkaufsarbeitsplatz
  sr: Радно место продаје
# АРМ — обработка (инструмент), а не документ: открывается из навигации, не
# создаёт нумерованных экземпляров. Подбор по свободному остатку, оформление
# Реализации (+ПКО) кнопками. Движения делает проведение создаваемых документов.
params:
  - name: Дата
    type: date
    label: Дата
    labels: {en: Date, de: Datum, sr: Датум}
  - name: Организация
    type: reference:Организация
    label: Организация
    labels: {en: Organization, de: Organisation, sr: Организација}
  - name: Покупатель
    type: reference:Контрагент
    label: Покупатель
    labels: {en: Customer, de: Kunde, sr: Купац}
    required: true
  - name: Склад
    type: reference:Склад
    label: Склад
    labels: {en: Warehouse, de: Lager, sr: Магацин}
    required: true
  - name: ТипЦенПродажи
    type: reference:ТипЦен
    label: Тип цен продажи
    labels: {en: Sales price type, de: Verkaufspreistyp, sr: Тип цене продаје}
  - name: Касса
    type: reference:Касса
    label: Касса
    labels: {en: Cash desk, de: Kasse, sr: Каса}
  - name: ОплатитьСразу
    type: bool
    label: Оплатить сразу (ПКО)
    labels: {en: Pay immediately, de: Sofort bezahlen, sr: Плати одмах}
table_parts:
  - name: Товары
    title: Товары
    titles: {en: Items, de: Artikel, sr: Артикли}
    fields:
      - name: Номенклатура
        type: reference:Номенклатура
        title: Номенклатура
        titles: {en: Item, de: Artikel, sr: Артикал}
      - name: Свободно
        type: number
        title: Свободно
        titles: {en: Available, de: Verfügbar, sr: Слободно}
      - name: Количество
        type: number
        title: Количество
        titles: {en: Quantity, de: Menge, sr: Количина}
      - name: Цена
        type: number
        title: Цена
        titles: {en: Price, de: Preis, sr: Цена}
      - name: Сумма
        type: number
        title: Сумма
        titles: {en: Amount, de: Betrag, sr: Износ}
