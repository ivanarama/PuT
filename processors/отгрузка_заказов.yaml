name: ОтгрузкаЗаказов
title: АРМ Отгрузки
titles:
  en: Shipment workplace
  de: Versand-Arbeitsplatz
  sr: Радно место отпреме
# Обработка-инструмент: отгрузка зарезервированного по заказам покупателя.
# Создаёт РеализацииТоваров с привязкой к заказу — проведение снимает резерв и FIFO.
params:
  - name: Дата
    type: date
    label: Дата
    labels: {en: Date, de: Datum, sr: Датум}
  - name: Организация
    type: reference:Организация
    label: Организация
    labels: {en: Organization, de: Organisation, sr: Организација}
  - name: Покупатель
    type: reference:Контрагент
    label: Покупатель
    labels: {en: Customer, de: Kunde, sr: Купац}
    required: true
  - name: Склад
    type: reference:Склад
    label: Склад
    labels: {en: Warehouse, de: Lager, sr: Магацин}
    required: true
table_parts:
  - name: Строки
    title: Строки
    titles: {en: Lines, de: Zeilen, sr: Ставке}
    fields:
      - name: ЗаказПокупателя
        type: reference:ЗаказПокупателя
        title: Заказ покупателя
        titles: {en: Sales order, de: Kundenauftrag, sr: Налог купца}
      - name: Номенклатура
        type: reference:Номенклатура
        title: Номенклатура
        titles: {en: Item, de: Artikel, sr: Артикал}
      - name: Резерв
        type: number
        title: Резерв
        titles: {en: Reserved, de: Reserviert, sr: Резервисано}
      - name: Остаток
        type: number
        title: Остаток
        titles: {en: In stock, de: Bestand, sr: Стање}
      - name: КОтгрузке
        type: number
        title: К отгрузке
        titles: {en: To ship, de: Zu liefern, sr: За отпрему}
