name: ПланЗакупок
title: АРМ Закупок
titles:
  en: Purchase planning
  de: Einkaufsplanung
  sr: Планирање набавке
# Обработка-инструмент: считает дефицит (резерв − остаток − в пути) и создаёт
# ЗаказыПоставщику. Движения (ТоварыВПути) пишет проведение заказа.
params:
  - name: Дата
    type: date
    label: Дата
    labels: {en: Date, de: Datum, sr: Датум}
  - name: Организация
    type: reference:Организация
    label: Организация
    labels: {en: Organization, de: Organisation, sr: Организација}
  - name: Склад
    type: reference:Склад
    label: Склад
    labels: {en: Warehouse, de: Lager, sr: Магацин}
    required: true
  - name: Поставщик
    type: reference:Контрагент
    label: Поставщик
    labels: {en: Supplier, de: Lieferant, sr: Добављач}
    required: true
table_parts:
  - name: Потребность
    title: Потребность
    titles: {en: Demand, de: Bedarf, sr: Потреба}
    fields:
      - name: Номенклатура
        type: reference:Номенклатура
        title: Номенклатура
        titles: {en: Item, de: Artikel, sr: Артикал}
      - name: Заказано
        type: number
        title: Заказано (резерв)
        titles: {en: Reserved, de: Reserviert, sr: Резервисано}
      - name: Остаток
        type: number
        title: Остаток
        titles: {en: In stock, de: Bestand, sr: Стање}
      - name: ВПути
        type: number
        title: В пути
        titles: {en: In transit, de: Unterwegs, sr: У путу}
      - name: Дефицит
        type: number
        title: Дефицит
        titles: {en: Shortage, de: Fehlmenge, sr: Мањак}
      - name: КЗаказу
        type: number
        title: К заказу
        titles: {en: To order, de: Zu bestellen, sr: За наручити}
