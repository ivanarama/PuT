title: АРМ Кассира
titles:
  en: Cashier workplace
  de: Kassierer-Arbeitsplatz
  sr: Радно место касира
# Обработка-инструмент: дебиторка/кредиторка из Взаиморасчётов, оплаты создают и
# проводят ПКО/РКО (движения по ДенежнымСредствам и Взаиморасчётам — их проведение).
params:
  - name: Дата
    type: date
    label: Дата
    labels: {en: Date, de: Datum, sr: Датум}
  - name: Организация
    type: reference:Организация
    label: Организация
    labels: {en: Organization, de: Organisation, sr: Организација}
  - name: Касса
    type: reference:Касса
    label: Касса
    labels: {en: Cash desk, de: Kasse, sr: Каса}
    required: true
table_parts:
