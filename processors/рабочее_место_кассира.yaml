    title: Долги
    titles: {en: Debts, de: Schulden, sr: Дугови}
    fields:
      - name: Контрагент
        type: reference:Контрагент
        title: Контрагент
        titles: {en: Counterparty, de: Geschäftspartner, sr: Контрагент}
      - name: ТипКонтрагента
        type: enum:ВидКонтрагента
        title: Тип
        titles: {en: Type, de: Typ, sr: Тип}
      - name: Долг
        type: number
        title: Долг (+ нам / − мы)
        titles: {en: Balance, de: Saldo, sr: Салдо}
      - name: КОплате
        type: number
        title: К оплате
        titles: {en: To pay, de: Zu zahlen, sr: За плаћање}
