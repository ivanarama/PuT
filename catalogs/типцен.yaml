name: ТипЦен
fields:
  - name: Наименование
    type: string
  - name: ВидРасчета
    type: enum
    values: [Хранимый, Наценка, Скидка]
    default: Хранимый
    label: Вид расчёта
  - name: БазовыйТип
    type: reference:ТипЦен
    label: Базовый тип (для расчётных)
  - name: Процент
    type: number
    label: Процент наценки/скидки от базового
  - name: Округление
    type: number
    default: 2
    label: Знаков после запятой
predefined:
  - name: Закупочная
    Наименование: Закупочная
    ВидРасчета: Хранимый
    Округление: 2
  - name: Розничная
    Наименование: Розничная
    ВидРасчета: Наценка
    БазовыйТип: Закупочная
    Процент: 30
    Округление: 2
  - name: Оптовая
    Наименование: Оптовая
    ВидРасчета: Наценка
    БазовыйТип: Закупочная
    Процент: 10
    Округление: 2
