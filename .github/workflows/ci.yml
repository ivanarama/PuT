name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Validation & Smoke Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Run Go tests
        run: go test ./...

      - name: Build OneBase CLI
        run: |
          git clone --depth 1 https://github.com/ivanarama/onebase.git /tmp/onebase
          cd /tmp/onebase && go build -o /usr/local/bin/onebase ./cmd/onebase

      - name: Run onebase check
        run: onebase check --project .

      - name: Run onebase lint
        run: onebase lint --project .

      - name: Run smoke migration & populate demo database
        run: |
          onebase migrate --project . --sqlite ci_demo.db
          onebase procrun --project . --sqlite ci_demo.db --proc ЗаполнитьТестовуюБазу

      # Тесты конфигурации (обработки kind: test) идут по заполненной демо-базе:
      # тест инварианта партий сверяет её остатки, остальные создают свои данные.
      # Каждый тест выполняется в своей транзакции с откатом.
      - name: Run configuration tests
        run: onebase test --project . --sqlite ci_demo.db

      - name: Run scenario tests (суммы ЭДО/проведения/идемпотентность)
        run: bash scripts/scenario_tests.sh
