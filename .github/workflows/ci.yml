name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Validation & Smoke Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: put-ci
          POSTGRES_DB: put_ci
        ports:
          - 127.0.0.1:5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'

      - name: Run Go tests
        run: go test ./...

      - name: Build OneBase CLI
        run: |
          revision=$(python3 -c 'import json; print(json.load(open("platform-patches/runtime.json"))["commit"])')
          build=$(python3 -c 'import json; print(json.load(open("platform-patches/runtime.json"))["build"])')
          git clone --filter=blob:none --no-checkout https://github.com/ivanarama/onebase.git /tmp/onebase
          git -C /tmp/onebase fetch --depth 1 origin "$revision"
          git -C /tmp/onebase checkout --detach FETCH_HEAD
          git -C /tmp/onebase apply "$GITHUB_WORKSPACE/platform-patches/put-ui.patch"
          cd /tmp/onebase
          go build -ldflags "-X github.com/ivantit66/onebase/internal/version.Build=$build" -o /usr/local/bin/onebase ./cmd/onebase

      - name: Check platform UI and static assets
        run: |
          cd /tmp/onebase
          go test ./internal/ui ./internal/webassets ./internal/widget ./internal/configcheck -count=1 -timeout 600s
          go test ./internal/query -run '^TestCompile_RegisterAttributeAggregatesByDialect$' -count=1

      - name: Check supported platform build
        run: python3 scripts/check_runtime.py --onebase /usr/local/bin/onebase

      - name: Run onebase check
        run: onebase check --project .

      - name: Check BP3 exporter contract
        run: |
          python3 -m pip install pyyaml
          python3 scripts/generate_bp3_exporter.py --check
          python3 scripts/test_bp3_export.py --onebase /usr/local/bin/onebase

      - name: Verify order promises and ABC cutoffs
        run: |
          python3 scripts/test_order_promises.py --onebase /usr/local/bin/onebase
          python3 scripts/test_abc_report.py --onebase /usr/local/bin/onebase

      - name: Run onebase lint
        run: onebase lint --project .

      - name: Run smoke migration & populate demo database
        run: |
          onebase migrate --project . --sqlite ci_demo.db
          onebase procrun --project . --sqlite ci_demo.db --proc ЗаполнитьТестовуюБазу

      # Тесты конфигурации (обработки kind: test) идут по заполненной демо-базе:
      # тест инварианта партий сверяет её остатки, остальные создают свои данные.
      # Каждый тест выполняется в своей транзакции с откатом.
      - name: Run configuration tests
        run: onebase test --project . --sqlite ci_demo.db

      - name: Run scenario tests (суммы ЭДО/проведения/идемпотентность)
        run: bash scripts/scenario_tests.sh

      - name: Check rolling demo reset
        run: python3 scripts/test_demo_reset.py --onebase /usr/local/bin/onebase

      - name: Check native PostgreSQL demo reset and rollback
        run: bash scripts/test_demo_reset_postgres.sh /usr/local/bin/onebase

      - name: Verify accounting on PostgreSQL
        env:
          DATABASE_URL: postgres://postgres:put-ci@127.0.0.1:5432/put_ci?sslmode=disable
        run: |
          onebase migrate --project .
          onebase procrun --project . --proc ЗаполнитьТестовуюБазу
          onebase test --project .
          onebase procrun --project . --proc ЗакрытиеМесяца --set ТолькоСверка=true --set "ДатаОкончания=$(date +%F)"
          python3 -m pip install 'psycopg[binary]'
          python3 scripts/test_postgres_reports.py --onebase /usr/local/bin/onebase

      - name: Check managed workstations and exchange replay
        env:
          PGHOST: 127.0.0.1
          PGUSER: postgres
          PGPASSWORD: put-ci
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
          python3 scripts/test_workplaces_ui.py --onebase /usr/local/bin/onebase
          createdb put_exchange
          umask 077
          echo 'postgres://postgres:put-ci@127.0.0.1:5432/put_exchange?sslmode=disable' > "$RUNNER_TEMP/put-exchange.dsn"
          browser=$(python3 -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')
          python3 scripts/test_exchange_imports.py --onebase /usr/local/bin/onebase \
            --browser "$browser" --postgres-dsn-file "$RUNNER_TEMP/put-exchange.dsn"
