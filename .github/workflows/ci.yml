name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Validation & Smoke Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'

      - name: Run Go tests
        run: go test ./...

      - name: Build OneBase CLI
        run: |
          revision=$(python3 -c 'import json; print(json.load(open("platform-patches/runtime.json"))["commit"])')
          build=$(python3 -c 'import json; print(json.load(open("platform-patches/runtime.json"))["build"])')
          git clone --filter=blob:none --no-checkout https://github.com/ivanarama/onebase.git /tmp/onebase
          git -C /tmp/onebase fetch --depth 1 origin "$revision"
          git -C /tmp/onebase checkout --detach FETCH_HEAD
          git -C /tmp/onebase apply "$GITHUB_WORKSPACE/platform-patches/put-ui.patch"
          cd /tmp/onebase
          go build -ldflags "-X github.com/ivantit66/onebase/internal/version.Build=$build" -o /usr/local/bin/onebase ./cmd/onebase

      - name: Check platform UI and static assets
        run: |
          cd /tmp/onebase
          go test ./internal/ui ./internal/webassets ./internal/widget ./internal/configcheck -count=1 -timeout 600s

      - name: Check supported platform build
        run: python3 scripts/check_runtime.py --onebase /usr/local/bin/onebase

      - name: Run onebase check
        run: onebase check --project .

      - name: Run onebase lint
        run: onebase lint --project .

      - name: Run smoke migration & populate demo database
        run: |
          onebase migrate --project . --sqlite ci_demo.db
          onebase procrun --project . --sqlite ci_demo.db --proc ЗаполнитьТестовуюБазу

      # Тесты конфигурации (обработки kind: test) идут по заполненной демо-базе:
      # тест инварианта партий сверяет её остатки, остальные создают свои данные.
      # Каждый тест выполняется в своей транзакции с откатом.
      - name: Run configuration tests
        run: onebase test --project . --sqlite ci_demo.db

      - name: Run scenario tests (суммы ЭДО/проведения/идемпотентность)
        run: bash scripts/scenario_tests.sh

      - name: Check rolling demo reset
        run: python3 scripts/test_demo_reset.py --onebase /usr/local/bin/onebase
