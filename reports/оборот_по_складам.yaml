query: |
  ВЫБРАТЬ
    Склад,
    СУММА(ВЫБОР КОГДА вид_движения = "Приход" ТОГДА Количество ИНАЧЕ 0 КОНЕЦ) КАК ПриходКол,
    СУММА(ВЫБОР КОГДА вид_движения = "Расход" ТОГДА Количество ИНАЧЕ 0 КОНЕЦ) КАК РасходКол,
    СУММА(ВЫБОР КОГДА вид_движения = "Приход" ТОГДА Сумма ИНАЧЕ 0 КОНЕЦ) КАК ПриходСум,
    СУММА(ВЫБОР КОГДА вид_движения = "Расход" ТОГДА Сумма ИНАЧЕ 0 КОНЕЦ) КАК РасходСум
  ИЗ РегистрНакопления.ОстаткиТоваров
  ГДЕ (&НачалоПериода ЕСТЬ ПУСТО ИЛИ period >= &НачалоПериода)
    И (&КонецПериода ЕСТЬ ПУСТО ИЛИ period <= &КонецПериода)
  СГРУППИРОВАТЬ ПО Склад
  УПОРЯДОЧИТЬ ПО Склад
