name: КнигаПокупок
title: Книга покупок (управленческая)
titles:
  en: Purchase ledger (management)
  de: Einkaufsjournal (Management)
params:
  - name: НачалоПериода
    type: date
    label: С даты
    labels:
      en: From date
      de: Von Datum
  - name: КонецПериода
    type: date
    label: По дату
    labels:
      en: To date
      de: Bis Datum
query: |
  ВЫБРАТЬ
    Движение.period КАК Дата,
    Движение.recorder_type КАК ВидДокумента,
    ЕстьNULL(Поступление.Номер, Оприходование.Номер) КАК Документ,
    СУММА(Движение.Сумма) КАК СуммаБезНДС,
    СУММА(Движение.СуммаСНДС - Движение.Сумма) КАК НДС,
    СУММА(Движение.СуммаСНДС) КАК ВсегоСНДС
  ИЗ РегистрНакопления.ПартииТоваров КАК Движение
  ЛЕВОЕ СОЕДИНЕНИЕ Документ.ПоступлениеТоваров КАК Поступление
    ПО Движение.recorder = Поступление.Ссылка
  ЛЕВОЕ СОЕДИНЕНИЕ Документ.ОприходованиеТоваров КАК Оприходование
    ПО Движение.recorder = Оприходование.Ссылка
  ГДЕ Движение.вид_движения = "Приход"
    И (Движение.recorder_type = "ПоступлениеТоваров"
      ИЛИ Движение.recorder_type = "ОприходованиеТоваров")
    И (&НачалоПериода ЕСТЬ ПУСТО ИЛИ Движение.period >= &НачалоПериода)
    И (&КонецПериода ЕСТЬ ПУСТО ИЛИ Движение.period <= КонецДня(&КонецПериода))
  СГРУППИРОВАТЬ ПО Движение.period, Движение.recorder_type, Движение.recorder,
    Поступление.Номер, Оприходование.Номер
  УПОРЯДОЧИТЬ ПО Движение.period
