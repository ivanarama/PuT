name: КнигаПокупок
title: Книга покупок (управленческая)
titles:
  en: Purchase ledger (management)
  de: Einkaufsjournal (Management)
params:
  - name: НачалоПериода
    type: date
    label: С даты
    labels:
      en: From date
      de: Von Datum
  - name: КонецПериода
    type: date
    label: По дату
    labels:
      en: To date
      de: Bis Datum
# Возврат поставщику уменьшает покупки и входной НДС — отрицательной строкой,
# как возврат покупателя в книге продаж. Суммы округляются до копеек: SQLite
# складывает числа, хранимые текстом, с «хвостами» вроде 204166.66999999998.
query: |
  ВЫБРАТЬ
    Движение.period КАК Дата,
    ВЫБОР
      КОГДА Движение.recorder_type = "ПоступлениеТоваров" ТОГДА "Поступление товаров"
      КОГДА Движение.recorder_type = "ОприходованиеТоваров" ТОГДА "Оприходование товаров"
      КОГДА Движение.recorder_type = "ВозвратПоставщику" ТОГДА "Возврат поставщику"
      ИНАЧЕ Движение.recorder_type
    КОНЕЦ КАК ВидДокумента,
    ЕстьNULL(Поступление.Номер, ЕстьNULL(Оприходование.Номер, ВозвратПоставщику.Номер)) КАК Документ,
    ROUND(СУММА(ВЫБОР КОГДА Движение.вид_движения = "Приход" ТОГДА Движение.Сумма ИНАЧЕ -Движение.Сумма КОНЕЦ), 2) КАК СуммаБезНДС,
    ROUND(СУММА(ВЫБОР КОГДА Движение.вид_движения = "Приход" ТОГДА Движение.СуммаСНДС - Движение.Сумма ИНАЧЕ Движение.Сумма - Движение.СуммаСНДС КОНЕЦ), 2) КАК НДС,
    ROUND(СУММА(ВЫБОР КОГДА Движение.вид_движения = "Приход" ТОГДА Движение.СуммаСНДС ИНАЧЕ -Движение.СуммаСНДС КОНЕЦ), 2) КАК ВсегоСНДС
  ИЗ РегистрНакопления.ПартииТоваров КАК Движение
  ЛЕВОЕ СОЕДИНЕНИЕ Документ.ПоступлениеТоваров КАК Поступление
    ПО Движение.recorder = Поступление.Ссылка
  ЛЕВОЕ СОЕДИНЕНИЕ Документ.ОприходованиеТоваров КАК Оприходование
    ПО Движение.recorder = Оприходование.Ссылка
  ЛЕВОЕ СОЕДИНЕНИЕ Документ.ВозвратПоставщику КАК ВозвратПоставщику
    ПО Движение.recorder = ВозвратПоставщику.Ссылка
  ГДЕ ((Движение.вид_движения = "Приход"
        И (Движение.recorder_type = "ПоступлениеТоваров"
          ИЛИ Движение.recorder_type = "ОприходованиеТоваров"))
      ИЛИ (Движение.вид_движения = "Расход"
        И Движение.recorder_type = "ВозвратПоставщику"))
    И (&НачалоПериода ЕСТЬ ПУСТО ИЛИ Движение.period >= &НачалоПериода)
    И (&КонецПериода ЕСТЬ ПУСТО ИЛИ Движение.period <= КонецДня(&КонецПериода))
  СГРУППИРОВАТЬ ПО Движение.period, Движение.recorder_type, Движение.recorder,
    Поступление.Номер, Оприходование.Номер, ВозвратПоставщику.Номер
  УПОРЯДОЧИТЬ ПО Движение.period
