name: КнигаПокупок
title: Книга покупок (управленческая)
titles:
  en: Purchase ledger (management)
  de: Einkaufsjournal (Management)
params:
  - name: НачалоПериода
    type: date
    label: С даты
    labels:
      en: From date
      de: Von Datum
  - name: КонецПериода
    type: date
    label: По дату
    labels:
      en: To date
      de: Bis Datum
query: |
  ВЫБРАТЬ
    period КАК Дата,
    Регистратор КАК Документ,
    СУММА(Сумма) КАК СуммаБезНДС,
    СУММА(СуммаСНДС - Сумма) КАК НДС,
    СУММА(СуммаСНДС) КАК ВсегоСНДС
  ИЗ РегистрНакопления.ПартииТоваров
  ГДЕ вид_движения = "Приход"
    И (&НачалоПериода ЕСТЬ ПУСТО ИЛИ period >= &НачалоПериода)
    И (&КонецПериода ЕСТЬ ПУСТО ИЛИ period <= &КонецПериода)
  СГРУППИРОВАТЬ ПО period, Регистратор
  УПОРЯДОЧИТЬ ПО period
