name: АнализЗаказовПоставщикам
title: Анализ выполнения заказов поставщикам
titles:
  en: Purchase orders analysis
  de: Bestellungsanalyse
  sr: Анализа налога добављача
params:
  - name: Организация
    type: reference:Организация
    label: Организация
  - name: Склад
    type: reference:Склад
    label: Склад
    labels:
      en: Warehouse
      de: Lager
      sr: Магацин
  - name: ЗаказПоставщику
    type: reference:ЗаказПоставщику
    label: Заказ поставщику
    labels:
      en: Purchase order
      de: Bestellung
      sr: Налог добављачу
query: |
  ВЫБРАТЬ
    З.Организация.Наименование КАК Организация, З.Номер КАК ЗаказПоставщику,
    Т.ЗаказПокупателя.Номер КАК ЗаказПокупателя,
    Т.Номенклатура.Наименование КАК Номенклатура,
    Т.Склад.Наименование КАК Склад,
    СУММА(ВЫБОР КОГДА Т.вид_движения = "Приход" ТОГДА Т.Количество ИНАЧЕ -Т.Количество КОНЕЦ) КАК КоличествоВПути,
    СУММА(ВЫБОР КОГДА Т.recorder_type = "ПоступлениеТоваров" ТОГДА Т.Количество ИНАЧЕ 0 КОНЕЦ) КАК Поступило,
    МАКСИМУМ(ВЫБОР КОГДА Т.recorder_type = "ПоступлениеТоваров" ТОГДА Т.period ИНАЧЕ NULL КОНЕЦ) КАК ПоследнееПоступление,
    СУММА(ВЫБОР КОГДА Т.вид_движения = "Приход" ТОГДА Т.Сумма ИНАЧЕ -Т.Сумма КОНЕЦ) КАК СуммаВПути
  ИЗ РегистрНакопления.ТоварыВПути КАК Т
  ВНУТРЕННЕЕ СОЕДИНЕНИЕ Документ.ЗаказПоставщику КАК З ПО Т.ЗаказПоставщику = З.Ссылка
  ГДЕ (&Организация ЕСТЬ ПУСТО ИЛИ З.Организация = &Организация) И (&Склад ЕСТЬ ПУСТО ИЛИ Т.Склад = &Склад)
    И (&ЗаказПоставщику ЕСТЬ ПУСТО ИЛИ Т.ЗаказПоставщику = &ЗаказПоставщику)
  СГРУППИРОВАТЬ ПО Т.ЗаказПоставщику, Т.ЗаказПокупателя, Т.Номенклатура, Т.Склад,
    З.Организация.Ссылка, З.Организация.Наименование, З.Номер, Т.ЗаказПокупателя.Номер, Т.Номенклатура.Наименование, Т.Склад.Наименование
  УПОРЯДОЧИТЬ ПО З.Номер, Т.Номенклатура.Наименование
