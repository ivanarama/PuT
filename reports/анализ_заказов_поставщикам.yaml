name: АнализЗаказовПоставщикам
title: Анализ выполнения заказов поставщикам
titles:
  en: Purchase orders analysis
  de: Bestellungsanalyse
  sr: Анализа налога добављача
params:
  - name: Склад
    type: reference:Склад
    label: Склад
    labels:
      en: Warehouse
      de: Lager
      sr: Магацин
  - name: ЗаказПоставщику
    type: reference:ЗаказПоставщику
    label: Заказ поставщику
    labels:
      en: Purchase order
      de: Bestellung
      sr: Налог добављачу
query: |
  ВЫБРАТЬ
    Т.ЗаказПоставщику КАК ЗаказПоставщику,
    Т.ЗаказПокупателя КАК ЗаказПокупателя,
    Т.Номенклатура КАК Номенклатура,
    Т.Склад КАК Склад,
    СУММА(ВЫБОР КОГДА Т.вид_движения = "Приход" ТОГДА Т.Количество ИНАЧЕ -Т.Количество КОНЕЦ) КАК КоличествоВПути,
    СУММА(ВЫБОР КОГДА Т.вид_движения = "Приход" ТОГДА Т.Сумма ИНАЧЕ -Т.Сумма КОНЕЦ) КАК СуммаВПути
  ИЗ РегистрНакопления.ТоварыВПути КАК Т
  ГДЕ (&Склад ЕСТЬ ПУСТО ИЛИ Т.Склад = &Склад)
    И (&ЗаказПоставщику ЕСТЬ ПУСТО ИЛИ Т.ЗаказПоставщику = &ЗаказПоставщику)
  СГРУППИРОВАТЬ ПО Т.ЗаказПоставщику, Т.ЗаказПокупателя, Т.Номенклатура, Т.Склад
  ИМЕЯ СУММА(ВЫБОР КОГДА Т.вид_движения = "Приход" ТОГДА Т.Количество ИНАЧЕ -Т.Количество КОНЕЦ) > 0
  УПОРЯДОЧИТЬ ПО Т.ЗаказПоставщику, Т.Номенклатура
