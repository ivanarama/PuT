query: |
  ВЫБРАТЬ
    Касса,
    Касса.Вид КАК Вид,
    Контрагент,
    Основание,
    вид_движения КАК ВидДвижения,
    СУММА(Сумма) КАК Сумма
  ИЗ РегистрНакопления.ДенежныеСредства
  ГДЕ (&НачалоПериода ЕСТЬ ПУСТО ИЛИ period >= &НачалоПериода)
    И (&КонецПериода ЕСТЬ ПУСТО ИЛИ period <= &КонецПериода)
    И (&Касса ЕСТЬ ПУСТО ИЛИ Касса = &Касса)
  СГРУППИРОВАТЬ ПО Касса, Касса.Вид, Контрагент, Основание, вид_движения
  УПОРЯДОЧИТЬ ПО Касса, ВидДвижения
