name: ДвижениеДенежныхСредств
title: Движение денежных средств за период
titles:
  en: Cash flow for period
  de: Geldverkehr für den Zeitraum
  sr: Новчани токови за период
params:
  - name: НачалоПериода
    type: date
    label: С даты
  - name: КонецПериода
    type: date
    label: По дату
  - name: Касса
    type: reference:Касса
    label: Касса/счёт
query: |
  ВЫБРАТЬ
    Касса,
    Касса.Вид КАК Вид,
    Контрагент,
    Основание,
    вид_движения КАК ВидДвижения,
    СУММА(Сумма) КАК Сумма
  ИЗ РегистрНакопления.ДенежныеСредства
  ГДЕ (&НачалоПериода ЕСТЬ ПУСТО ИЛИ period >= &НачалоПериода)
    И (&КонецПериода ЕСТЬ ПУСТО ИЛИ period <= &КонецПериода)
    И (&Касса ЕСТЬ ПУСТО ИЛИ Касса = &Касса)
  СГРУППИРОВАТЬ ПО Касса, Касса.Вид, Контрагент, Основание, вид_движения
  УПОРЯДОЧИТЬ ПО Касса, ВидДвижения
