query: |
  ВЫБРАТЬ
    Р.Номенклатура КАК Номенклатура,
    Р.Склад КАК Склад,
    Р.ЗаказПокупателя КАК ЗаказПокупателя,
    СУММА(ВЫБОР КОГДА Р.вид_движения = "Приход" ТОГДА Р.Количество ИНАЧЕ -Р.Количество КОНЕЦ) КАК Количество
  ИЗ РегистрНакопления.РезервыТоваров КАК Р
  ГДЕ (&НаДату ЕСТЬ ПУСТО ИЛИ Р.period <= &НаДату)
    И (&Склад ЕСТЬ ПУСТО ИЛИ Р.Склад = &Склад)
  СГРУППИРОВАТЬ ПО Р.Номенклатура, Р.Склад, Р.ЗаказПокупателя
  ИМЕЯ СУММА(ВЫБОР КОГДА Р.вид_движения = "Приход" ТОГДА Р.Количество ИНАЧЕ -Р.Количество КОНЕЦ) > 0
  УПОРЯДОЧИТЬ ПО Р.Номенклатура, Р.Склад
