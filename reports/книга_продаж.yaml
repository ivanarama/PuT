name: КнигаПродаж
title: Книга продаж (управленческая)
titles:
  en: Sales ledger (management)
  de: Umsatzjournal (Management)
params:
  - name: НачалоПериода
    type: date
    label: С даты
    labels:
      en: From date
      de: Von Datum
  - name: КонецПериода
    type: date
    label: По дату
    labels:
      en: To date
      de: Bis Datum
query: |
  ВЫБРАТЬ
    period КАК Дата,
    Регистратор КАК Документ,
    СУММА(ВЫБОР КОГДА вид_движения = "Приход" ТОГДА Выручка ИНАЧЕ -Выручка КОНЕЦ) КАК ВыручкаБезНДС,
    СУММА(ВЫБОР КОГДА вид_движения = "Приход" ТОГДА СуммаНДС ИНАЧЕ -СуммаНДС КОНЕЦ) КАК НДС,
    СУММА(ВЫБОР КОГДА вид_движения = "Приход" ТОГДА СуммаСНДС ИНАЧЕ -СуммаСНДС КОНЕЦ) КАК ВсегоСНДС
  ИЗ РегистрНакопления.ВаловаяПрибыль
  ГДЕ (&НачалоПериода ЕСТЬ ПУСТО ИЛИ period >= &НачалоПериода)
    И (&КонецПериода ЕСТЬ ПУСТО ИЛИ period <= &КонецПериода)
  СГРУППИРОВАТЬ ПО period, Регистратор
  УПОРЯДОЧИТЬ ПО period
