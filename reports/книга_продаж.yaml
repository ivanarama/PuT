name: КнигаПродаж
title: Книга продаж (управленческая)
titles:
  en: Sales ledger (management)
  de: Umsatzjournal (Management)
params:
  - name: НачалоПериода
    type: date
    label: С даты
    labels:
      en: From date
      de: Von Datum
  - name: КонецПериода
    type: date
    label: По дату
    labels:
      en: To date
      de: Bis Datum
# Суммы округляются до копеек: SQLite складывает числа, хранимые текстом, с
# «хвостами» вроде 37000.000000000015.
query: |
  ВЫБРАТЬ
    Движение.period КАК Дата,
    ВЫБОР
      КОГДА Движение.recorder_type = "РеализацияТоваров" ТОГДА "Реализация товаров"
      КОГДА Движение.recorder_type = "ВозвратОтПокупателя" ТОГДА "Возврат от покупателя"
      ИНАЧЕ Движение.recorder_type
    КОНЕЦ КАК ВидДокумента,
    ЕстьNULL(Реализация.Номер, Возврат.Номер) КАК Документ,
    ROUND(СУММА(ВЫБОР КОГДА Движение.вид_движения = "Приход" ТОГДА Движение.Выручка ИНАЧЕ -Движение.Выручка КОНЕЦ), 2) КАК ВыручкаБезНДС,
    ROUND(СУММА(ВЫБОР КОГДА Движение.вид_движения = "Приход" ТОГДА Движение.СуммаНДС ИНАЧЕ -Движение.СуммаНДС КОНЕЦ), 2) КАК НДС,
    ROUND(СУММА(ВЫБОР КОГДА Движение.вид_движения = "Приход" ТОГДА Движение.СуммаСНДС ИНАЧЕ -Движение.СуммаСНДС КОНЕЦ), 2) КАК ВсегоСНДС
  ИЗ РегистрНакопления.ВаловаяПрибыль КАК Движение
  ЛЕВОЕ СОЕДИНЕНИЕ Документ.РеализацияТоваров КАК Реализация
    ПО Движение.recorder = Реализация.Ссылка
  ЛЕВОЕ СОЕДИНЕНИЕ Документ.ВозвратОтПокупателя КАК Возврат
    ПО Движение.recorder = Возврат.Ссылка
  ГДЕ (Движение.recorder_type = "РеализацияТоваров"
      ИЛИ Движение.recorder_type = "ВозвратОтПокупателя")
    И (&НачалоПериода ЕСТЬ ПУСТО ИЛИ Движение.period >= &НачалоПериода)
    И (&КонецПериода ЕСТЬ ПУСТО ИЛИ Движение.period <= КонецДня(&КонецПериода))
  СГРУППИРОВАТЬ ПО Движение.period, Движение.recorder_type, Движение.recorder,
    Реализация.Номер, Возврат.Номер
  УПОРЯДОЧИТЬ ПО Движение.period
