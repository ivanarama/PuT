query: |
  ВЫБРАТЬ
    Номенклатура,
    Склад,
    ДатаПоставки,
    КоличествоОстаток КАК Количество,
    СуммаОстаток КАК Сумма
  ИЗ РегистрНакопления.ПартииТоваров.Остатки(&НаДату)
  ГДЕ КоличествоОстаток <> 0
    И (&Номенклатура ЕСТЬ ПУСТО ИЛИ Номенклатура = &Номенклатура)
    И (&Склад ЕСТЬ ПУСТО ИЛИ Склад = &Склад)
  УПОРЯДОЧИТЬ ПО Номенклатура, Склад, ДатаПоставки
