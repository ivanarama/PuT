name: ВедомостьПартий
title: Партии товаров (ФИФО)
titles:
  en: Inventory lots (FIFO)
  de: Warenchargen-Übersicht (FIFO)
  sr: Преглед партија (ФИФО)
params:
  - name: НаДату
    type: date
    label: На дату
  - name: Номенклатура
    type: reference:Номенклатура
    label: Номенклатура
  - name: Склад
    type: reference:Склад
    label: Склад
query: |
  ВЫБРАТЬ
    Номенклатура,
    Склад,
    ДатаПоставки,
    КоличествоОстаток КАК Количество,
    СуммаОстаток КАК Сумма
  ИЗ РегистрНакопления.ПартииТоваров.Остатки(&НаДату)
  ГДЕ КоличествоОстаток <> 0
    И (&Номенклатура ЕСТЬ ПУСТО ИЛИ Номенклатура = &Номенклатура)
    И (&Склад ЕСТЬ ПУСТО ИЛИ Склад = &Склад)
  УПОРЯДОЧИТЬ ПО Номенклатура, Склад, ДатаПоставки
