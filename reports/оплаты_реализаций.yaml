    labels:
      az: Əks-tərəf
      de: Kunde
      en: Customer
      es: Contraparte
      fr: Counterpartie
      hy: Գործընկեր
      ka: კონტრაგენტი
      kk: Контрагент
      pt: Contraparte
      ro: Contraparte
      sr: Купац
      tr: Karşı taraf
      uk: Контрагент
      uz: Kontragent
      zh: 往来单位
    name: Контрагент
    type: reference:Контрагент
  - label: С даты
    labels:
      az: Başlanğıc
      de: Von Datum
      en: From date
      es: Inicio
      fr: Début
      hy: Սկիզբ
      ka: დასაწყისი
      kk: Басы
      pt: Início
      ro: Început
      sr: Од датума
      tr: Başlangıç
      uk: Початок
      uz: Boshlanish
      zh: 开始
    name: НачалоПериода
    type: date
  - label: По дату
    labels:
      az: Son
      de: Bis Datum
      en: To date
      es: Fin
      fr: Fin
      hy: Վերջ
      ka: დასრულება
      kk: Соңы
      pt: Fim
      ro: Sfârșit
      sr: До датума
      tr: Bitiş
      uk: Кінець
      uz: Tugash
      zh: 结束
    name: КонецПериода
    type: date
query: |
  ВЫБРАТЬ
    ДокументРеализации,
    Контрагент,
    МАКСИМУМ(СрокОплаты) КАК ОплатаДо,
    СУММА(ВЫБОР КОГДА вид_движения = "Приход" ТОГДА Сумма ИНАЧЕ 0 КОНЕЦ) КАК Долг,
    СУММА(ВЫБОР КОГДА вид_движения = "Расход" ТОГДА Сумма ИНАЧЕ 0 КОНЕЦ) КАК Оплачено,
    СУММА(ВЫБОР КОГДА вид_движения = "Приход" ТОГДА Сумма ИНАЧЕ -Сумма КОНЕЦ) КАК Остаток,
    ВЫБОР КОГДА СУММА(ВЫБОР КОГДА вид_движения = "Приход" ТОГДА Сумма ИНАЧЕ -Сумма КОНЕЦ) > 0
      И МАКСИМУМ(СрокОплаты) ЕСТЬ НЕ ПУСТО
      И МАКСИМУМ(СрокОплаты) < date('now', 'localtime')
      ТОГДА СУММА(ВЫБОР КОГДА вид_движения = "Приход" ТОГДА Сумма ИНАЧЕ -Сумма КОНЕЦ)
      ИНАЧЕ 0 КОНЕЦ КАК Просрочено
  ИЗ РегистрНакопления.Взаиморасчеты
  ГДЕ ДокументРеализации ЕСТЬ НЕ ПУСТО
    И (&Контрагент ЕСТЬ ПУСТО ИЛИ Контрагент = &Контрагент)
    И (&НачалоПериода ЕСТЬ ПУСТО ИЛИ period >= &НачалоПериода)
    И (&КонецПериода ЕСТЬ ПУСТО ИЛИ period <= &КонецПериода)
  СГРУППИРОВАТЬ ПО ДокументРеализации, Контрагент
  УПОРЯДОЧИТЬ ПО Остаток УБЫВ
