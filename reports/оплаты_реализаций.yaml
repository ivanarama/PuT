name: ОплатыРеализаций
params:
  - label: Покупатель
    labels:
      az: Əks-tərəf
      de: Kunde
      en: Customer
      es: Contraparte
      fr: Counterpartie
      hy: Գործընկեր
      ka: კონტრაგენტი
      kk: Контрагент
      pt: Contraparte
      ro: Contraparte
      sr: Купац
      tr: Karşı taraf
      uk: Контрагент
      uz: Kontragent
      zh: 往来单位
    name: Контрагент
    type: reference:Контрагент
  - label: С даты
    labels:
      az: Başlanğıc
      de: Von Datum
      en: From date
      es: Inicio
      fr: Début
      hy: Սկիզբ
      ka: დასაწყისი
      kk: Басы
      pt: Início
      ro: Început
      sr: Од датума
      tr: Başlangıç
      uk: Початок
      uz: Boshlanish
      zh: 开始
    name: НачалоПериода
    type: date
  - label: По дату
    labels:
      az: Son
      de: Bis Datum
      en: To date
      es: Fin
      fr: Fin
      hy: Վերջ
      ka: დასრულება
      kk: Соңы
      pt: Fim
      ro: Sfârșit
      sr: До датума
      tr: Bitiş
      uk: Кінець
      uz: Tugash
      zh: 结束
    name: КонецПериода
    period_end: true
    type: date
  - default: "{{today}}"
    label: Просрочка на дату
    labels:
      de: Überfällig zum
      en: Overdue as of
      uk: Прострочення на дату
    name: НаДату
    period_end: true
    type: date
query: |
  ВЫБРАТЬ Р.Документ КАК ДокументРеализации, Р.Контрагент, Р.ОплатаДо, Р.НачальныйОстаток, Р.Долг, Р.Оплачено,
    Р.НачальныйОстаток + Р.Долг - Р.Оплачено КАК Остаток,
    ВЫБОР КОГДА Р.ДолгНаДату > 0 И Р.ОплатаДо < &НаДату ТОГДА Р.ДолгНаДату ИНАЧЕ 0 КОНЕЦ КАК Просрочено
  ИЗ (ВЫБРАТЬ Д.Документ, Д.Контрагент, МАКСИМУМ(Д.СрокОплаты) КАК ОплатаДо,
        СУММА(ВЫБОР КОГДА Д.Период < &НачалоПериода И Д.ДоКонца = 1 ТОГДА Д.Начислено - Д.Погашено ИНАЧЕ 0 КОНЕЦ) КАК НачальныйОстаток,
        СУММА(ВЫБОР КОГДА Д.ВПериоде = 1 ТОГДА Д.Начислено ИНАЧЕ 0 КОНЕЦ) КАК Долг,
        СУММА(ВЫБОР КОГДА Д.ВПериоде = 1 ТОГДА Д.Погашено ИНАЧЕ 0 КОНЕЦ) КАК Оплачено,
        СУММА(ВЫБОР КОГДА Д.Период <= &НаДату ТОГДА Д.Начислено - Д.Погашено ИНАЧЕ 0 КОНЕЦ) КАК ДолгНаДату
      ИЗ (ВЫБРАТЬ Вз.ДокументРеализации.Ссылка КАК ДокИД, Вз.ДокументРеализации.Номер КАК Документ,
              Вз.Контрагент.Ссылка КАК КонтрагентИД, Вз.Контрагент.Наименование КАК Контрагент,
              Вз.period КАК Период, Вз.СрокОплаты КАК СрокОплаты,
              ВЫБОР КОГДА Вз.вид_движения = "Приход" ТОГДА Вз.Сумма ИНАЧЕ 0 КОНЕЦ КАК Начислено,
              ВЫБОР КОГДА Вз.вид_движения = "Расход" ТОГДА Вз.Сумма ИНАЧЕ 0 КОНЕЦ КАК Погашено,
              ВЫБОР КОГДА (&КонецПериода ЕСТЬ ПУСТО ИЛИ Вз.period <= &КонецПериода) ТОГДА 1 ИНАЧЕ 0 КОНЕЦ КАК ДоКонца,
              ВЫБОР КОГДА (&НачалоПериода ЕСТЬ ПУСТО ИЛИ Вз.period >= &НачалоПериода)
                И (&КонецПериода ЕСТЬ ПУСТО ИЛИ Вз.period <= &КонецПериода) ТОГДА 1 ИНАЧЕ 0 КОНЕЦ КАК ВПериоде
          ИЗ РегистрНакопления.Взаиморасчеты КАК Вз
          ГДЕ Вз.ДокументРеализации ЕСТЬ НЕ ПУСТО И (&Контрагент ЕСТЬ ПУСТО ИЛИ Вз.Контрагент = &Контрагент)) КАК Д
      СГРУППИРОВАТЬ ПО Д.ДокИД, Д.Документ, Д.КонтрагентИД, Д.Контрагент
      ИМЕЯ МАКСИМУМ(Д.ДоКонца) = 1) КАК Р
  УПОРЯДОЧИТЬ ПО Остаток УБЫВ
