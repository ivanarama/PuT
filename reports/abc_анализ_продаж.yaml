name: ABCАнализПродаж
title: ABC-анализ продаж
titles:
  en: ABC sales analysis
  de: ABC-Verkaufsanalyse
  sr: ABC анализа продаје
params:
  - name: ДатаНачала
    type: date
    label: Дата начала
    labels:
      en: Start date
      de: Anfangsdatum
      sr: Почетни датум
  - name: ДатаОкончания
    type: date
    label: Дата окончания
    labels:
      en: End date
      de: Enddatum
      sr: Крајњи датум
  - name: Организация
    type: reference:Организация
    label: Организация
    labels:
      en: Organization
      de: Organisation
      sr: Организација
  - name: СУчетомНДС
    type: bool
    default: true
    label: С учётом НДС
    labels:
      en: Including VAT
      de: Inkl. MwSt.
      sr: Са ПДВ
query: |
  ВЫБРАТЬ
    ВП.Номенклатура КАК Номенклатура,
    СУММА(ВЫБОР КОГДА &СУчетомНДС = Истина И (ВП.СуммаСНДС ЕСТЬ НЕ NULL И ВП.СуммаСНДС <> 0) ТОГДА ВП.СуммаСНДС ИНАЧЕ ВП.Выручка КОНЕЦ) КАК Выручка,
    СУММА(ВП.Себестоимость) КАК Себестоимость,
    СУММА(ВЫБОР КОГДА &СУчетомНДС = Истина И (ВП.СуммаСНДС ЕСТЬ НЕ NULL И ВП.СуммаСНДС <> 0) ТОГДА ВП.СуммаСНДС ИНАЧЕ ВП.Выручка КОНЕЦ) - СУММА(ВП.Себестоимость) КАК ВаловаяПрибыль
  ИЗ РегистрНакопления.ВаловаяПрибыль КАК ВП
  ГДЕ (&ДатаНачала ЕСТЬ ПУСТО ИЛИ ВП.period >= &ДатаНачала)
    И (&ДатаОкончания ЕСТЬ ПУСТО ИЛИ ВП.period <= &ДатаОкончания)
    И (&Организация ЕСТЬ ПУСТО ИЛИ ВП.Организация = &Организация)
  СГРУППИРОВАТЬ ПО ВП.Номенклатура
  ИМЕЯ СУММА(ВЫБОР КОГДА &СУчетомНДС = Истина И (ВП.СуммаСНДС ЕСТЬ НЕ NULL И ВП.СуммаСНДС <> 0) ТОГДА ВП.СуммаСНДС ИНАЧЕ ВП.Выручка КОНЕЦ) > 0
  УПОРЯДОЧИТЬ ПО ВаловаяПрибыль УБЫВ
