name: ABCАнализПродаж
title: ABC-анализ продаж
titles:
  en: ABC sales analysis
  de: ABC-Verkaufsanalyse
  sr: ABC анализа продаје
params:
  - name: ДатаНачала
    type: date
    label: Дата начала
    labels:
      en: Start date
      de: Anfangsdatum
      sr: Почетни датум
  - name: ДатаОкончания
    type: date
    label: Дата окончания
    labels:
      en: End date
      de: Enddatum
      sr: Крајњи датум
  - name: Организация
    type: reference:Организация
    label: Организация
    labels:
      en: Organization
      de: Organisation
      sr: Организација
query: |
  ВЫБРАТЬ
    ВП.Номенклатура КАК Номенклатура,
    СУММА(ВП.Выручка) КАК Выручка,
    СУММА(ВП.Себестоимость) КАК Себестоимость,
    СУММА(ВП.Выручка - ВП.Себестоимость) КАК ВаловаяПрибыль
  ИЗ РегистрНакопления.ВаловаяПрибыль КАК ВП
  ГДЕ (&ДатаНачала ЕСТЬ ПУСТО ИЛИ ВП.period >= &ДатаНачала)
    И (&ДатаОкончания ЕСТЬ ПУСТО ИЛИ ВП.period <= &ДатаОкончания)
    И (&Организация ЕСТЬ ПУСТО ИЛИ ВП.Организация = &Организация)
  СГРУППИРОВАТЬ ПО ВП.Номенклатура
  ИМЕЯ СУММА(ВП.Выручка) > 0
  УПОРЯДОЧИТЬ ПО ВаловаяПрибыль УБЫВ
