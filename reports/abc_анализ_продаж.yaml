name: ABCАнализПродаж
params:
  - label: Дата начала
    labels:
      de: Anfangsdatum
      en: Start date
      sr: Почетни датум
    name: ДатаНачала
    type: date
  - label: Дата окончания
    labels:
      de: Enddatum
      en: End date
      sr: Крајњи датум
    name: ДатаОкончания
    type: date
  - label: Организация
    labels:
      de: Organisation
      en: Organization
      sr: Организација
    name: Организация
    type: reference:Организация
  - default: true
    label: С учётом НДС
    labels:
      de: Inkl. MwSt.
      en: Including VAT
      sr: Са ПДВ
    name: СУчетомНДС
    type: bool
query: |
  ВЫБРАТЬ
    ВП.Номенклатура КАК Номенклатура,
    СУММА(ВЫБОР КОГДА ВП.вид_движения = "Приход" ТОГДА 1 ИНАЧЕ -1 КОНЕЦ * (ВЫБОР КОГДА &СУчетомНДС = Истина И (ВП.СуммаСНДС ЕСТЬ НЕ NULL И ВП.СуммаСНДС <> 0) ТОГДА ВП.СуммаСНДС ИНАЧЕ ВП.Выручка КОНЕЦ)) КАК Выручка,
    СУММА(ВЫБОР КОГДА ВП.вид_движения = "Приход" ТОГДА 1 ИНАЧЕ -1 КОНЕЦ * (ВЫБОР КОГДА &СУчетомНДС = Истина И (ВП.СебестоимостьСНДС ЕСТЬ НЕ NULL И ВП.СебестоимостьСНДС <> 0) ТОГДА ВП.СебестоимостьСНДС ИНАЧЕ ВП.Себестоимость КОНЕЦ)) КАК Себестоимость,
    СУММА(ВЫБОР КОГДА ВП.вид_движения = "Приход" ТОГДА 1 ИНАЧЕ -1 КОНЕЦ * (ВЫБОР КОГДА &СУчетомНДС = Истина И (ВП.СуммаСНДС ЕСТЬ НЕ NULL И ВП.СуммаСНДС <> 0) ТОГДА ВП.СуммаСНДС ИНАЧЕ ВП.Выручка КОНЕЦ)) - СУММА(ВЫБОР КОГДА ВП.вид_движения = "Приход" ТОГДА 1 ИНАЧЕ -1 КОНЕЦ * (ВЫБОР КОГДА &СУчетомНДС = Истина И (ВП.СебестоимостьСНДС ЕСТЬ НЕ NULL И ВП.СебестоимостьСНДС <> 0) ТОГДА ВП.СебестоимостьСНДС ИНАЧЕ ВП.Себестоимость КОНЕЦ)) КАК ВаловаяПрибыль
  ИЗ РегистрНакопления.ВаловаяПрибыль КАК ВП
  ГДЕ (&ДатаНачала ЕСТЬ ПУСТО ИЛИ ВП.period >= &ДатаНачала)
    И (&ДатаОкончания ЕСТЬ ПУСТО ИЛИ ВП.period <= &ДатаОкончания)
    И (&Организация ЕСТЬ ПУСТО ИЛИ ВП.Организация = &Организация)
  СГРУППИРОВАТЬ ПО ВП.Номенклатура
  ИМЕЯ СУММА(ВЫБОР КОГДА ВП.вид_движения = "Приход" ТОГДА 1 ИНАЧЕ -1 КОНЕЦ * (ВЫБОР КОГДА &СУчетомНДС = Истина И (ВП.СуммаСНДС ЕСТЬ НЕ NULL И ВП.СуммаСНДС <> 0) ТОГДА ВП.СуммаСНДС ИНАЧЕ ВП.Выручка КОНЕЦ)) > 0
  УПОРЯДОЧИТЬ ПО ВаловаяПрибыль УБЫВ
title: ABC-анализ продаж
titles:
  de: ABC-Verkaufsanalyse
  en: ABC sales analysis
  sr: ABC анализа продаје
