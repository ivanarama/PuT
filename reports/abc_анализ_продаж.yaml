name: ABCАнализПродаж
params:
  - label: Дата начала
    labels:
      de: Anfangsdatum
      en: Start date
      sr: Почетни датум
    name: ДатаНачала
    type: date
  - label: Дата окончания
    labels:
      de: Enddatum
      en: End date
      sr: Крајњи датум
    name: ДатаОкончания
    period_end: true
    type: date
  - label: Организация
    labels:
      de: Organisation
      en: Organization
      sr: Организација
    name: Организация
    type: reference:Организация
  - default: true
    label: С учётом НДС
    labels:
      de: Inkl. MwSt.
      en: Including VAT
      sr: Са ПДВ
    name: СУчетомНДС
    type: bool
  - default: 80
    label: Граница класса A, %
    labels:
      en: Class A cutoff, %
    name: ПорогА
    type: number
  - default: 95
    label: Граница классов A и B, %
    labels:
      en: Combined A and B cutoff, %
    name: ПорогБ
    type: number
query: |
  ВЫБРАТЬ Д.Товар КАК Номенклатура, Д.Выручка, Д.Себестоимость, Д.Прибыль КАК ВаловаяПрибыль,
    ВЫБОР КОГДА Д.Всего = 0 ТОГДА 0 ИНАЧЕ ROUND(100.0 * Д.Вклад / NULLIF(Д.Всего, 0), 2) КОНЕЦ КАК ДоляПроцент,
    ВЫБОР КОГДА Д.Всего = 0 ТОГДА 0 ИНАЧЕ ROUND(100.0 * Д.Накоплено / NULLIF(Д.Всего, 0), 2) КОНЕЦ КАК НакопленнаяДоляПроцент,
    ВЫБОР КОГДА Д.Ключ ЕСТЬ NULL ТОГДА "Укажите границы: 0 < A < B <= 100"
      КОГДА Д.Вклад = 0 ТОГДА "C"
      КОГДА (Д.Накоплено - Д.Вклад) * 100 < Г.А * Д.Всего ТОГДА "A"
      КОГДА (Д.Накоплено - Д.Вклад) * 100 < Г.Б * Д.Всего ТОГДА "B"
      ИНАЧЕ "C" КОНЕЦ КАК КлассABC
  ИЗ (ВЫБРАТЬ COALESCE(CAST(&ПорогА AS NUMERIC), 80) КАК А,
              COALESCE(CAST(&ПорогБ AS NUMERIC), 95) КАК Б) КАК Г
  ЛЕВОЕ СОЕДИНЕНИЕ (
    ВЫБРАТЬ П.Ключ, П.Товар, П.Выручка, П.Себестоимость, П.Прибыль, П.Вклад,
      СУММА(П.Вклад) OVER () КАК Всего,
      СУММА(П.Вклад) OVER (УПОРЯДОЧИТЬ ПО П.Прибыль УБЫВ, П.Ключ) КАК Накоплено
    ИЗ (
      ВЫБРАТЬ Итог.Ключ, Итог.Товар, Итог.Выручка, Итог.Себестоимость, Итог.Выручка - Итог.Себестоимость КАК Прибыль,
        ВЫБОР КОГДА Итог.Выручка > Итог.Себестоимость ТОГДА Итог.Выручка - Итог.Себестоимость ИНАЧЕ 0 КОНЕЦ КАК Вклад
      ИЗ (
        ВЫБРАТЬ ВП.Номенклатура.Ссылка КАК Ключ, ВП.Номенклатура.Наименование КАК Товар,
          СУММА(ВЫБОР КОГДА ВП.вид_движения = "Приход" ТОГДА 1 ИНАЧЕ -1 КОНЕЦ *
            ВЫБОР КОГДА &СУчетомНДС = Истина ТОГДА COALESCE(NULLIF(CAST(ВП.СуммаСНДС AS NUMERIC), 0), ВП.Выручка, 0) ИНАЧЕ COALESCE(ВП.Выручка, 0) КОНЕЦ) КАК Выручка,
          СУММА(ВЫБОР КОГДА ВП.вид_движения = "Приход" ТОГДА 1 ИНАЧЕ -1 КОНЕЦ *
            ВЫБОР КОГДА &СУчетомНДС = Истина ТОГДА COALESCE(NULLIF(CAST(ВП.СебестоимостьСНДС AS NUMERIC), 0), ВП.Себестоимость, 0) ИНАЧЕ COALESCE(ВП.Себестоимость, 0) КОНЕЦ) КАК Себестоимость
        ИЗ РегистрНакопления.ВаловаяПрибыль КАК ВП
        ГДЕ (&ДатаНачала ЕСТЬ ПУСТО ИЛИ ВП.period >= &ДатаНачала)
          И (&ДатаОкончания ЕСТЬ ПУСТО ИЛИ ВП.period <= &ДатаОкончания)
          И (&Организация ЕСТЬ ПУСТО ИЛИ ВП.Организация = &Организация)
        СГРУППИРОВАТЬ ПО ВП.Номенклатура.Ссылка, ВП.Номенклатура.Наименование
      ) КАК Итог
    ) КАК П
  ) КАК Д ПО Г.А > 0 И Г.А < Г.Б И Г.Б <= 100
  ГДЕ Д.Ключ ЕСТЬ НЕ NULL ИЛИ Г.А <= 0 ИЛИ Г.А >= Г.Б ИЛИ Г.Б > 100
  УПОРЯДОЧИТЬ ПО Д.Прибыль УБЫВ, Д.Ключ
title: ABC-анализ продаж
titles:
  de: ABC-Verkaufsanalyse
  en: ABC sales analysis
  sr: ABC анализа продаје
