name: АнализЗаказовПокупателей
title: Анализ выполнения заказов покупателей
titles:
  en: Sales orders analysis
  de: Kundenauftragsanalyse
  sr: Анализа налога купаца
params:
  - name: Склад
    type: reference:Склад
    label: Склад
    labels:
      en: Warehouse
      de: Lager
      sr: Магацин
  - name: ЗаказПокупателя
    type: reference:ЗаказПокупателя
    label: Заказ покупателя
    labels:
      en: Sales order
      de: Kundenauftrag
      sr: Налог купца
query: |
  ВЫБРАТЬ
    Р.ЗаказПокупателя КАК ЗаказПокупателя,
    Р.Номенклатура КАК Номенклатура,
    Р.Склад КАК Склад,
    СУММА(ВЫБОР КОГДА Р.вид_движения = "Приход" ТОГДА Р.Количество ИНАЧЕ -Р.Количество КОНЕЦ) КАК РезервОстаток
  ИЗ РегистрНакопления.РезервыТоваров КАК Р
  ГДЕ (&Склад ЕСТЬ ПУСТО ИЛИ Р.Склад = &Склад)
    И (&ЗаказПокупателя ЕСТЬ ПУСТО ИЛИ Р.ЗаказПокупателя = &ЗаказПокупателя)
  СГРУППИРОВАТЬ ПО Р.ЗаказПокупателя, Р.Номенклатура, Р.Склад
  ИМЕЯ СУММА(ВЫБОР КОГДА Р.вид_движения = "Приход" ТОГДА Р.Количество ИНАЧЕ -Р.Количество КОНЕЦ) > 0
  УПОРЯДОЧИТЬ ПО Р.ЗаказПокупателя, Р.Номенклатура
