name: АнализЗаказовПокупателей
title: Анализ выполнения заказов покупателей
titles:
  en: Sales orders analysis
  de: Kundenauftragsanalyse
  sr: Анализа налога купаца
params:
  - name: НаДату
    type: date
    period_end: true
    default: "{{today}}"
    label: Состояние на конец дня
  - name: Организация
    type: reference:Организация
    label: Организация
  - name: Склад
    type: reference:Склад
    label: Склад
    labels:
      en: Warehouse
      de: Lager
      sr: Магацин
  - name: ЗаказПокупателя
    type: reference:ЗаказПокупателя
    label: Заказ покупателя
    labels:
      en: Sales order
      de: Kundenauftrag
      sr: Налог купца
query: |
  ВЫБРАТЬ Итого.Организация, Итого.ЗаказПокупателя, Итого.Номенклатура, Итого.Склад, Итого.РезервОстаток,
    Итого.ВПути, Итого.Поступило, Итого.ПоследнееПоступление, Итого.Отгружено, Итого.ПоследняяОтгрузка,
    ВЫБОР КОГДА Итого.РезервОстаток > 0 И О.Свободно >= 0 ТОГДА &НаДату ИНАЧЕ NULL КОНЕЦ КАК ВозможнаяДатаОтгрузки,
    ВЫБОР КОГДА Итого.РезервОстаток <= 0 ТОГДА "Резерв закрыт"
      КОГДА О.Свободно >= 0 ТОГДА "Можно отгрузить на выбранную дату"
      КОГДА Итого.ВПути > 0 ТОГДА "Ожидается поставка, дата не определена"
      ИНАЧЕ "Недостаточно товара, дата не определена" КОНЕЦ КАК Обеспечение
  ИЗ (ВЫБРАТЬ Д.ЗаказПокупателя, Д.Номенклатура, Д.Склад, Д.Организация, Д.ОргИД, Д.ТоварИД, Д.СкладИД,
    СУММА(Д.Резерв) КАК РезервОстаток,
    СУММА(Д.ВПути) КАК ВПути,
    СУММА(Д.Поступило) КАК Поступило,
    МАКСИМУМ(Д.ДатаПриёмки) КАК ПоследнееПоступление,
    СУММА(Д.Отгружено) КАК Отгружено,
    МАКСИМУМ(Д.ДатаОтгрузки) КАК ПоследняяОтгрузка
  ИЗ (ВЫБРАТЬ Р.ЗаказПокупателя.Ссылка КАК ЗаказИД, Р.Номенклатура.Ссылка КАК ТоварИД, Р.Склад.Ссылка КАК СкладИД,
        З.Организация.Ссылка КАК ОргИД, З.Организация.Наименование КАК Организация,
        Р.ЗаказПокупателя.Номер КАК ЗаказПокупателя, Р.Номенклатура.Наименование КАК Номенклатура, Р.Склад.Наименование КАК Склад,
        ВЫБОР КОГДА Р.вид_движения = "Приход" ТОГДА Р.Количество ИНАЧЕ -Р.Количество КОНЕЦ КАК Резерв,
        0 КАК ВПути, 0 КАК Поступило, NULL КАК ДатаПриёмки,
        ВЫБОР КОГДА Р.recorder_type = "РеализацияТоваров" ТОГДА Р.Количество ИНАЧЕ 0 КОНЕЦ КАК Отгружено,
        ВЫБОР КОГДА Р.recorder_type = "РеализацияТоваров" ТОГДА Р.period ИНАЧЕ NULL КОНЕЦ КАК ДатаОтгрузки
      ИЗ РегистрНакопления.РезервыТоваров КАК Р
      ВНУТРЕННЕЕ СОЕДИНЕНИЕ Документ.ЗаказПокупателя КАК З ПО Р.ЗаказПокупателя = З.Ссылка
      ГДЕ Р.period <= &НаДату И (&Организация ЕСТЬ ПУСТО ИЛИ З.Организация = &Организация) И (&Склад ЕСТЬ ПУСТО ИЛИ Р.Склад = &Склад) И (&ЗаказПокупателя ЕСТЬ ПУСТО ИЛИ Р.ЗаказПокупателя = &ЗаказПокупателя)
      ОБЪЕДИНИТЬ ВСЕ
      ВЫБРАТЬ Т.ЗаказПокупателя.Ссылка, Т.Номенклатура.Ссылка, Т.Склад.Ссылка,
        Кл.Организация.Ссылка, Кл.Организация.Наименование,
        Т.ЗаказПокупателя.Номер, Т.Номенклатура.Наименование, Т.Склад.Наименование, 0,
        ВЫБОР КОГДА Т.вид_движения = "Приход" ТОГДА Т.Количество ИНАЧЕ -Т.Количество КОНЕЦ,
        ВЫБОР КОГДА Т.recorder_type = "ПоступлениеТоваров" ТОГДА Т.Количество ИНАЧЕ 0 КОНЕЦ,
        ВЫБОР КОГДА Т.recorder_type = "ПоступлениеТоваров" ТОГДА Т.period ИНАЧЕ NULL КОНЕЦ, 0, NULL
      ИЗ РегистрНакопления.ТоварыВПути КАК Т
      ВНУТРЕННЕЕ СОЕДИНЕНИЕ Документ.ЗаказПокупателя КАК Кл ПО Т.ЗаказПокупателя = Кл.Ссылка
      ГДЕ Т.period <= &НаДату И (&Организация ЕСТЬ ПУСТО ИЛИ Кл.Организация = &Организация) И (&Склад ЕСТЬ ПУСТО ИЛИ Т.Склад = &Склад)
        И (&ЗаказПокупателя ЕСТЬ ПУСТО ИЛИ Т.ЗаказПокупателя = &ЗаказПокупателя)) КАК Д
  СГРУППИРОВАТЬ ПО Д.ЗаказИД, Д.ТоварИД, Д.СкладИД, Д.ОргИД, Д.Организация, Д.ЗаказПокупателя, Д.Номенклатура, Д.Склад) КАК Итого
  ЛЕВОЕ СОЕДИНЕНИЕ (
    ВЫБРАТЬ Б.ОргИД, Б.ТоварИД, Б.СкладИД, СУММА(Б.Количество) КАК Свободно
    ИЗ (ВЫБРАТЬ П.Организация.Ссылка КАК ОргИД, П.Номенклатура.Ссылка КАК ТоварИД, П.Склад.Ссылка КАК СкладИД,
          П.КоличествоОстаток КАК Количество ИЗ РегистрНакопления.ПартииТоваров.Остатки(&НаДату) КАК П
        ОБЪЕДИНИТЬ ВСЕ
        ВЫБРАТЬ З.Организация.Ссылка, Р.Номенклатура.Ссылка, Р.Склад.Ссылка, -Р.КоличествоОстаток
        ИЗ РегистрНакопления.РезервыТоваров.Остатки(&НаДату) КАК Р
        ВНУТРЕННЕЕ СОЕДИНЕНИЕ Документ.ЗаказПокупателя КАК З ПО Р.ЗаказПокупателя = З.Ссылка
        ГДЕ Р.КоличествоОстаток > 0) КАК Б
    СГРУППИРОВАТЬ ПО Б.ОргИД, Б.ТоварИД, Б.СкладИД) КАК О
    ПО Итого.ОргИД = О.ОргИД И Итого.ТоварИД = О.ТоварИД И Итого.СкладИД = О.СкладИД
  УПОРЯДОЧИТЬ ПО Итого.ЗаказПокупателя, Итого.Номенклатура
