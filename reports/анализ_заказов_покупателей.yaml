name: АнализЗаказовПокупателей
title: Анализ выполнения заказов покупателей
titles:
  en: Sales orders analysis
  de: Kundenauftragsanalyse
  sr: Анализа налога купаца
params:
  - name: НаДату
    type: date
    period_end: true
    default: "{{today}}"
    label: Состояние на конец дня
  - name: Организация
    type: reference:Организация
    label: Организация
  - name: Склад
    type: reference:Склад
    label: Склад
    labels:
      en: Warehouse
      de: Lager
      sr: Магацин
  - name: ЗаказПокупателя
    type: reference:ЗаказПокупателя
    label: Заказ покупателя
    labels:
      en: Sales order
      de: Kundenauftrag
      sr: Налог купца
# Расход без номера строки (закрытие или старое поступление) снижает ближайшие
# подтверждённые количества внутри того же заказа поставщику. Дату обещаем лишь
# когда ожидаемый товар покроет резерв с учётом других заказов на складе.
query: |
  ВЫБРАТЬ Прогноз.ИмяОрганизации КАК Организация, Прогноз.НомерЗаказа КАК ЗаказПокупателя, Прогноз.Товар КАК Номенклатура, Прогноз.ИмяСклада КАК Склад, Прогноз.РезервОстаток,
    Прогноз.ВПути, Прогноз.Поступило, Прогноз.ПоследнееПоступление, Прогноз.Отгружено, Прогноз.ПоследняяОтгрузка,
    Прогноз.ВозможнаяДатаОтгрузки,
    ВЫБОР КОГДА Прогноз.РезервОстаток <= 0 ТОГДА "Резерв закрыт"
      КОГДА Прогноз.Свободно >= 0 ТОГДА "Можно отгрузить на выбранную дату"
      КОГДА Прогноз.ВозможнаяДатаОтгрузки ЕСТЬ НЕ NULL ТОГДА "Ожидается подтверждённая поставка"
      КОГДА Прогноз.ВПути > 0 ТОГДА "Ожидается поставка, дата не определена"
      ИНАЧЕ "Недостаточно товара, дата не определена" КОНЕЦ КАК Обеспечение
  ИЗ (WITH Поставки AS (
    ВЫБРАТЬ Т.ЗаказПокупателя.Ссылка КАК ЗаказИД, Т.Номенклатура.Ссылка КАК ТоварИД, Т.Склад.Ссылка КАК СкладИД,
      Т.ЗаказПоставщику.Ссылка КАК ПоставкаИД, Т.СтрокаЗаказа, Т.ПодтвержденнаяДатаПоставки КАК Срок,
      Кл.Организация.Ссылка КАК ОргИД, Кл.Организация.Наименование КАК ИмяОрганизации,
      Т.ЗаказПокупателя.Номер КАК НомерЗаказа, Т.Номенклатура.Наименование КАК Товар, Т.Склад.Наименование КАК ИмяСклада,
      ВЫБОР КОГДА Т.вид_движения = "Приход" ТОГДА Т.Количество ИНАЧЕ -Т.Количество КОНЕЦ КАК Движение,
      ВЫБОР КОГДА Т.recorder_type = "ПоступлениеТоваров" ТОГДА Т.Количество ИНАЧЕ 0 КОНЕЦ КАК Принято,
      ВЫБОР КОГДА Т.recorder_type = "ПоступлениеТоваров" ТОГДА Т.period ИНАЧЕ NULL КОНЕЦ КАК ДатаПриёмки
    ИЗ РегистрНакопления.ТоварыВПути КАК Т
    ВНУТРЕННЕЕ СОЕДИНЕНИЕ Документ.ЗаказПокупателя КАК Кл ПО Т.ЗаказПокупателя = Кл.Ссылка
    ГДЕ Т.period <= &НаДату И (&Организация ЕСТЬ ПУСТО ИЛИ Кл.Организация = &Организация)
      И (&Склад ЕСТЬ ПУСТО ИЛИ Т.Склад = &Склад) И (&ЗаказПокупателя ЕСТЬ ПУСТО ИЛИ Т.ЗаказПокупателя = &ЗаказПокупателя)
  ), Итоги AS (
    ВЫБРАТЬ Д.ЗаказИД, Д.НомерЗаказа, Д.Товар, Д.ИмяСклада, Д.ИмяОрганизации, Д.ОргИД, Д.ТоварИД, Д.СкладИД,
      СУММА(Д.Резерв) КАК РезервОстаток,
      СУММА(Д.ВПути) КАК ВПути,
      СУММА(Д.Поступило) КАК Поступило,
      МАКСИМУМ(Д.ДатаПриёмки) КАК ПоследнееПоступление,
      СУММА(Д.Отгружено) КАК Отгружено,
      МАКСИМУМ(Д.ДатаОтгрузки) КАК ПоследняяОтгрузка
    ИЗ (ВЫБРАТЬ Р.ЗаказПокупателя.Ссылка КАК ЗаказИД, Р.Номенклатура.Ссылка КАК ТоварИД, Р.Склад.Ссылка КАК СкладИД,
          З.Организация.Ссылка КАК ОргИД, З.Организация.Наименование КАК ИмяОрганизации,
          Р.ЗаказПокупателя.Номер КАК НомерЗаказа, Р.Номенклатура.Наименование КАК Товар, Р.Склад.Наименование КАК ИмяСклада,
          ВЫБОР КОГДА Р.вид_движения = "Приход" ТОГДА Р.Количество ИНАЧЕ -Р.Количество КОНЕЦ КАК Резерв,
          0 КАК ВПути, 0 КАК Поступило, NULL КАК ДатаПриёмки,
          ВЫБОР КОГДА Р.recorder_type = "РеализацияТоваров" ТОГДА Р.Количество ИНАЧЕ 0 КОНЕЦ КАК Отгружено,
          ВЫБОР КОГДА Р.recorder_type = "РеализацияТоваров" ТОГДА Р.period ИНАЧЕ NULL КОНЕЦ КАК ДатаОтгрузки
        ИЗ РегистрНакопления.РезервыТоваров КАК Р
        ВНУТРЕННЕЕ СОЕДИНЕНИЕ Документ.ЗаказПокупателя КАК З ПО Р.ЗаказПокупателя = З.Ссылка
        ГДЕ Р.period <= &НаДату И (&Организация ЕСТЬ ПУСТО ИЛИ З.Организация = &Организация) И (&Склад ЕСТЬ ПУСТО ИЛИ Р.Склад = &Склад) И (&ЗаказПокупателя ЕСТЬ ПУСТО ИЛИ Р.ЗаказПокупателя = &ЗаказПокупателя)
        ОБЪЕДИНИТЬ ВСЕ
        ВЫБРАТЬ Т.ЗаказИД, Т.ТоварИД, Т.СкладИД, Т.ОргИД, Т.ИмяОрганизации, Т.НомерЗаказа, Т.Товар, Т.ИмяСклада, 0,
          Т.Движение, Т.Принято, Т.ДатаПриёмки, 0, NULL
        ИЗ Поставки КАК Т) КАК Д
    СГРУППИРОВАТЬ ПО Д.ЗаказИД, Д.ТоварИД, Д.СкладИД, Д.ОргИД, Д.ИмяОрганизации, Д.НомерЗаказа, Д.Товар, Д.ИмяСклада
  ), ОстаткиСклада AS (
    ВЫБРАТЬ Б.ОргИД, Б.ТоварИД, Б.СкладИД, СУММА(Б.Количество) КАК Свободно
    ИЗ (ВЫБРАТЬ П.Организация.Ссылка КАК ОргИД, П.Номенклатура.Ссылка КАК ТоварИД, П.Склад.Ссылка КАК СкладИД,
          П.КоличествоОстаток КАК Количество ИЗ РегистрНакопления.ПартииТоваров.Остатки(&НаДату) КАК П
        ОБЪЕДИНИТЬ ВСЕ
        ВЫБРАТЬ З.Организация.Ссылка, Р.Номенклатура.Ссылка, Р.Склад.Ссылка, -Р.КоличествоОстаток
        ИЗ РегистрНакопления.РезервыТоваров.Остатки(&НаДату) КАК Р
        ВНУТРЕННЕЕ СОЕДИНЕНИЕ Документ.ЗаказПокупателя КАК З ПО Р.ЗаказПокупателя = З.Ссылка
        ГДЕ Р.КоличествоОстаток > 0) КАК Б
    СГРУППИРОВАТЬ ПО Б.ОргИД, Б.ТоварИД, Б.СкладИД
  ), СтрокиПоставок AS (
    ВЫБРАТЬ ПоставкаИД, ЗаказИД, ТоварИД, СкладИД, СтрокаЗаказа, МАКСИМУМ(Срок) КАК Срок, СУММА(Движение) КАК Осталось
    ИЗ Поставки
    СГРУППИРОВАТЬ ПО ПоставкаИД, ЗаказИД, ТоварИД, СкладИД, СтрокаЗаказа
  ), ОстаткиПоСрокам AS (
    ВЫБРАТЬ ПоставкаИД, ЗаказИД, ТоварИД, СкладИД, Срок, Осталось,
      СУММА(ВЫБОР КОГДА Осталось < 0 ТОГДА -Осталось ИНАЧЕ 0 КОНЕЦ)
        OVER (PARTITION BY ПоставкаИД, ЗаказИД, ТоварИД, СкладИД) КАК РасходБезСтроки,
      СУММА(ВЫБОР КОГДА Осталось > 0 И Срок > &НаДату ТОГДА Осталось ИНАЧЕ 0 КОНЕЦ)
        OVER (PARTITION BY ПоставкаИД, ЗаказИД, ТоварИД, СкладИД ORDER BY Срок, СтрокаЗаказа ROWS UNBOUNDED PRECEDING) КАК ПоДату
    ИЗ СтрокиПоставок
  ), ДатыПоставок AS (
    ВЫБРАТЬ ЗаказИД, ТоварИД, СкладИД, Срок,
      СУММА(ВЫБОР КОГДА ПоДату <= РасходБезСтроки ТОГДА 0
          КОГДА ПоДату - РасходБезСтроки < Осталось ТОГДА ПоДату - РасходБезСтроки
          ИНАЧЕ Осталось КОНЕЦ) КАК Подтверждено
    ИЗ ОстаткиПоСрокам
    ГДЕ Осталось > 0 И Срок > &НаДату
    СГРУППИРОВАТЬ ПО ЗаказИД, ТоварИД, СкладИД, Срок
  ), График AS (
    ВЫБРАТЬ ЗаказИД, ТоварИД, СкладИД, Срок,
      СУММА(Подтверждено) OVER (PARTITION BY ЗаказИД, ТоварИД, СкладИД ORDER BY Срок) КАК КСроку
    ИЗ ДатыПоставок
  )
  ВЫБРАТЬ Итого.*, О.Свободно,
    ВЫБОР КОГДА Итого.РезервОстаток <= 0 ТОГДА NULL
      КОГДА О.Свободно >= 0 ТОГДА &НаДату
      ИНАЧЕ (ВЫБРАТЬ МИНИМУМ(Г.Срок) ИЗ График КАК Г
        ГДЕ Г.ЗаказИД = Итого.ЗаказИД И Г.ТоварИД = Итого.ТоварИД И Г.СкладИД = Итого.СкладИД И Г.КСроку + О.Свободно >= 0)
      КОНЕЦ КАК ВозможнаяДатаОтгрузки
  ИЗ Итоги КАК Итого
  ЛЕВОЕ СОЕДИНЕНИЕ ОстаткиСклада КАК О
    ПО Итого.ОргИД = О.ОргИД И Итого.ТоварИД = О.ТоварИД И Итого.СкладИД = О.СкладИД) КАК Прогноз
  УПОРЯДОЧИТЬ ПО Прогноз.НомерЗаказа, Прогноз.Товар
