name: ПлатежныйКалендарь
title: Платёжный календарь (расчёты и задолженность)
titles:
  en: Payment calendar
  de: Zahlungskalender
  sr: Календар плаћања
params:
  - name: НаДату
    type: date
    period_end: true
    default: "{{today}}"
    label: Состояние расчётов на дату
  - name: Организация
    type: reference:Организация
    label: Организация
    labels:
      en: Organization
      de: Organisation
      sr: Организација
query: |
  ВЫБРАТЬ
    ВЫБОР КОГДА МАКСИМУМ(СрокОплаты) ЕСТЬ ПУСТО ТОГДА "Без срока" ИНАЧЕ "Со сроком" КОНЕЦ КАК ГруппаСрока,
    МАКСИМУМ(СрокОплаты) КАК СрокОплаты, Контрагент, ДокументРеализации, ДокументПоступления,
    ВЫБОР КОГДА ДокументРеализации ЕСТЬ НЕ ПУСТО ТОГДА
      СУММА(ВЫБОР КОГДА вид_движения = "Приход" ТОГДА Сумма ИНАЧЕ -Сумма КОНЕЦ) ИНАЧЕ 0 КОНЕЦ КАК ОжидаемоеПоступление,
    ВЫБОР КОГДА ДокументПоступления ЕСТЬ НЕ ПУСТО ТОГДА
      СУММА(ВЫБОР КОГДА вид_движения = "Расход" ТОГДА Сумма ИНАЧЕ -Сумма КОНЕЦ) ИНАЧЕ 0 КОНЕЦ КАК ПредстоящаяОплата
  ИЗ РегистрНакопления.Взаиморасчеты
  ГДЕ (&НаДату ЕСТЬ ПУСТО ИЛИ period <= &НаДату)
    И (&Организация ЕСТЬ ПУСТО ИЛИ Организация = &Организация)
    И (ДокументРеализации ЕСТЬ НЕ ПУСТО ИЛИ ДокументПоступления ЕСТЬ НЕ ПУСТО)
  СГРУППИРОВАТЬ ПО ДокументРеализации, ДокументПоступления, Контрагент
  ИМЕЯ СУММА(ВЫБОР КОГДА (ДокументРеализации ЕСТЬ НЕ ПУСТО И вид_движения = "Приход")
      ИЛИ (ДокументПоступления ЕСТЬ НЕ ПУСТО И вид_движения = "Расход") ТОГДА Сумма ИНАЧЕ -Сумма КОНЕЦ) > 0
  УПОРЯДОЧИТЬ ПО ГруппаСрока УБЫВ, СрокОплаты, Контрагент
