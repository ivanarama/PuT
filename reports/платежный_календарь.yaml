name: ПлатежныйКалендарь
title: Платёжный календарь (расчёты и задолженность)
titles:
  en: Payment calendar
  de: Zahlungskalender
  sr: Календар плаћања
params:
  - name: Организация
    type: reference:Организация
    label: Организация
    labels:
      en: Organization
      de: Organisation
      sr: Организација
query: |
  ВЫБРАТЬ
    Контрагент,
    ТипКонтрагента,
    СУММА(ВЫБОР КОГДА вид_движения = "Приход" ТОГДА Сумма ИНАЧЕ -Сумма КОНЕЦ) КАК СальдоВзаиморасчетов
  ИЗ РегистрНакопления.Взаиморасчеты
  ГДЕ (&Организация ЕСТЬ ПУСТО ИЛИ Организация = &Организация)
  СГРУППИРОВАТЬ ПО Контрагент, ТипКонтрагента
  УПОРЯДОЧИТЬ ПО ТипКонтрагента, СальдоВзаиморасчетов
