name: ПродажиПоКонтрагентам
title: Продажи по контрагентам
titles:
  en: Sales by counterparty
  de: Verkäufe nach Geschäftspartner
  sr: Продаја по партнерима
params:
  - name: НачалоПериода
    type: date
    label: С даты
  - name: КонецПериода
    type: date
    label: По дату
query: |
  ВЫБРАТЬ
    р.Покупатель КАК Покупатель,
    КОЛИЧЕСТВО(р.Номер) КАК ЧислоДокументов,
    СУММА(р.Сумма) КАК Выручка
  ИЗ Документ.РеализацияТоваров КАК р
  ГДЕ (&НачалоПериода ЕСТЬ ПУСТО ИЛИ р.Дата >= &НачалоПериода)
    И (&КонецПериода ЕСТЬ ПУСТО ИЛИ р.Дата <= &КонецПериода)
  СГРУППИРОВАТЬ ПО р.Покупатель
  УПОРЯДОЧИТЬ ПО Выручка УБЫВ
