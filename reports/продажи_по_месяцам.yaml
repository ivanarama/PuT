# Пример КРОСС-ТАБЛИЦЫ (pivot) системы компоновки данных.
# Запрос отдаёт ПЛОСКИЕ детальные строки (Номенклатура, Месяц, Выручка) —
# группировку по строкам и колонкам, агрегацию и итоги выполняет блок composition.
# Период регистра сворачиваем в «год-месяц» строкой "2026-03": strftime сортируется
# хронологически (как строка ISO) и портируется на оба диалекта (strftime_compat).
query: |
  ВЫБРАТЬ
    Номенклатура              КАК Номенклатура,
    strftime("%Y-%m", period) КАК Месяц,
    Выручка                   КАК Выручка
  ИЗ РегистрНакопления.ВаловаяПрибыль
  ГДЕ (&Начало ЕСТЬ ПУСТО ИЛИ period >= &Начало)
    И (&Конец  ЕСТЬ ПУСТО ИЛИ period <= &Конец)
    И (&Организация ЕСТЬ ПУСТО ИЛИ Организация = &Организация)
  УПОРЯДОЧИТЬ ПО Номенклатура.Наименование
# Кросс-таблица: непустой columns переключает компоновку в режим pivot —
# groupings уходят в строки, columns — в колонки, measures считаются на пересечении.
composition:
  groupings:                       # измерения в строки (слева)
    - Номенклатура
  columns:                         # измерения в колонки (шапка) — ВКЛЮЧАЕТ кросс-режим
    - Месяц
  measures:                        # значение на пересечении строка × колонка
    - { field: Выручка, agg: sum, title: "Выручка", format: "#,##0.00" }
  totals:
    grand: true                    # нижняя строка «ВСЕГО» по колонкам (в pivot рисуется всегда)
  detail: false                    # детализация в кросс-режиме не выводится
  conditional:                     # условное оформление работает поячеечно по агрегату
    # сильный месяц по товару — зелёным фоном (порог иллюстративный, подстройте)
    - when: "Выручка >= 30000"
      field: Выручка
      style: { background: "#e6ffed" }
# chart и sort в кросс-режиме игнорируются движком: график отключён,
# порядок строк задаётся УПОРЯДОЧИТЬ в запросе, колонок — авто-хронологический.
