name: ОстаткиТоваров
title: Остатки товаров по складам
params:
  - name: НаДату
    type: date
    label: На дату
query: |
  ВЫБРАТЬ
    Номенклатура,
    Склад,
    КоличествоОстаток КАК Количество,
    СуммаОстаток КАК Сумма
  ИЗ РегистрНакопления.ОстаткиТоваров.Остатки(&НаДату)
  ГДЕ КоличествоОстаток <> 0
  УПОРЯДОЧИТЬ ПО Номенклатура, Склад
