name: ЦеныНоменклатуры
title: Цены номенклатуры по типам
params:
  - name: НаДату
    type: date
    label: На дату
  - name: ТипЦен
    type: reference:ТипЦен
    label: Тип цен
  - name: Номенклатура
    type: reference:Номенклатура
    label: Номенклатура
query: |
  ВЫБРАТЬ
    Номенклатура,
    ТипЦен,
    Цена
  ИЗ РегистрСведений.ЦеныНоменклатуры.СрезПоследних(&НаДату)
  ГДЕ (&ТипЦен ЕСТЬ ПУСТО ИЛИ ТипЦен = &ТипЦен)
    И (&Номенклатура ЕСТЬ ПУСТО ИЛИ Номенклатура = &Номенклатура)
  УПОРЯДОЧИТЬ ПО Номенклатура, ТипЦен
