      - Касса
      - БанковскийСчёт
query: |
  ВЫБРАТЬ
    Касса,
    Касса.Вид КАК Вид,
    Касса.НомерСчёта КАК НомерСчёта,
    Касса.Банк КАК Банк,
    СУММА(ВЫБОР КОГДА вид_движения = "Приход" ТОГДА Сумма ИНАЧЕ -Сумма КОНЕЦ) КАК Сумма
  ИЗ РегистрНакопления.ДенежныеСредства
  ГДЕ (&НаДату ЕСТЬ ПУСТО ИЛИ period <= &НаДату)
    И (&Вид ЕСТЬ ПУСТО ИЛИ Касса.Вид = &Вид)
  СГРУППИРОВАТЬ ПО Касса, Касса.Вид, Касса.НомерСчёта, Касса.Банк
  УПОРЯДОЧИТЬ ПО Вид, Касса
