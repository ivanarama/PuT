    type: date
    label: На дату
    labels:
      en: On date
      de: Zum Datum
      sr: На датум
      az: Tarixə
      es: A fecha
      fr: À la date
      hy: Ամսաթվով
      ka: თარიღით
      kk: Күніне
      pt: Na data
      ro: La data
      tr: Tarihe
      uk: На дату
      uz: Sanaga
      zh: 截至
  - name: Вид
    type: select
    label: Вид
    labels:
      en: Type
      de: Art
      sr: Врста
      az: Növ
      es: Tipo
      fr: Type
      hy: Տեսակ
      ka: ტიპი
      kk: Түрі
      pt: Tipo
      ro: Tip
      tr: Tür
      uk: Вид
      uz: Tur
