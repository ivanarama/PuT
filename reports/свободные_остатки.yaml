params:
  - name: Организация
    type: reference:Организация
    label: Организация
  - name: НаДату
    period_end: true
    type: date
    label: На дату
    labels:
      en: On date
      de: Zum Datum
      sr: На датум
      az: Tarixə
      es: A fecha
      fr: À la date
      hy: Ամսաթվով
      ka: თარიღით
      kk: Күніне
      pt: Na data
      ro: La data
      tr: Tarihe
      uk: На дату
      uz: Sanaga
      zh: 截至
  - name: Склад
    type: reference:Склад
    label: Склад
    labels:
      en: Warehouse
      de: Lager
      sr: Магацин
      az: Anbar
      es: Almacén
      fr: Entrepôt
      hy: Պահեստ
      ka: საწყობ
      kk: Қойма
      pt: Armazém
      ro: Depozit
      tr: Depo
      uk: Склад
      uz: Ombor
      zh: 仓库
query: |
  ВЫБРАТЬ Д.Организация, Д.Номенклатура, Д.Склад,
    СУММА(Д.ФизическийОстаток) КАК НаСкладе,
    СУММА(Д.Резерв) КАК Резерв,
    СУММА(Д.ФизическийОстаток) - СУММА(Д.Резерв) КАК Количество,
    СУММА(Д.Себестоимость) КАК Себестоимость
  ИЗ (ВЫБРАТЬ П.Организация.Ссылка КАК ОргИД, П.Номенклатура.Ссылка КАК НомИД, П.Склад.Ссылка КАК СкладИД,
        П.Организация.Наименование КАК Организация, П.Номенклатура.Наименование КАК Номенклатура, П.Склад.Наименование КАК Склад,
        П.КоличествоОстаток КАК ФизическийОстаток, 0 КАК Резерв, П.СуммаОстаток КАК Себестоимость
      ИЗ РегистрНакопления.ПартииТоваров.Остатки(&НаДату) КАК П
      ГДЕ (&Склад ЕСТЬ ПУСТО ИЛИ П.Склад = &Склад) И (&Организация ЕСТЬ ПУСТО ИЛИ П.Организация = &Организация)
      ОБЪЕДИНИТЬ ВСЕ
      ВЫБРАТЬ З.Организация.Ссылка, Р.Номенклатура.Ссылка, Р.Склад.Ссылка,
        З.Организация.Наименование, Р.Номенклатура.Наименование, Р.Склад.Наименование, 0, Р.КоличествоОстаток, 0
      ИЗ РегистрНакопления.РезервыТоваров.Остатки(&НаДату) КАК Р
      ВНУТРЕННЕЕ СОЕДИНЕНИЕ Документ.ЗаказПокупателя КАК З ПО Р.ЗаказПокупателя = З.Ссылка
      ГДЕ Р.КоличествоОстаток > 0 И (&Склад ЕСТЬ ПУСТО ИЛИ Р.Склад = &Склад)
        И (&Организация ЕСТЬ ПУСТО ИЛИ З.Организация = &Организация)) КАК Д
  СГРУППИРОВАТЬ ПО Д.ОргИД, Д.НомИД, Д.СкладИД, Д.Организация, Д.Номенклатура, Д.Склад
  УПОРЯДОЧИТЬ ПО Д.Организация, Д.Номенклатура, Д.Склад
