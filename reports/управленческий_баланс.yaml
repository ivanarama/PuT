name: УправленческийБаланс
params:
  - label: "На дату"
    labels:
      az: Tarixə
      de: Zum Datum
      en: On date
      es: A fecha
      fr: À la date
      hy: Ամսաթվով
      ka: თარიღით
      kk: Күніне
      pt: Na data
      ro: La data
      sr: На датум
      tr: Tarihe
      uk: На дату
      uz: Sanaga
      zh: 截至
    name: НаДату
    type: date
# Управленческий баланс в единой базе «с НДС»: деньги и взаиморасчёты
# учитываются в суммах с НДС, запасы — по ресурсу СуммаСНДС, прибыль —
# ВыручкаСНДС − СебестоимостьСНДС. При такой базе актив = пассив по каждой
# проводке, поэтому балансовый разрыв возможен только из-за неполного
# переноса входящих остатков из 1С (уставный капитал/входящие долги).
# Сальдо разворачивается по знаку: дебиторка и авансы выданные — в активе,
# кредиторка и авансы полученные — в пассиве.
query: |
  ВЫБРАТЬ
    "1. АКТИВЫ" КАК Раздел,
    "1.1. Денежные средства (кассы и банк)" КАК Статья,
    ЕстьNULL(СУММА(ВЫБОР КОГДА вид_движения = "Приход" ТОГДА Сумма ИНАЧЕ -Сумма КОНЕЦ), 0) КАК Сумма
  ИЗ РегистрНакопления.ДенежныеСредства
  ГДЕ (&НаДату ЕСТЬ ПУСТО ИЛИ period <= &НаДату)

  ОБЪЕДИНИТЬ ВСЕ

  ВЫБРАТЬ
    "1. АКТИВЫ" КАК Раздел,
    "1.2. Запасы товаров на складах" КАК Статья,
    ЕстьNULL(СУММА(ВЫБОР КОГДА вид_движения = "Приход" ТОГДА СуммаСНДС ИНАЧЕ -СуммаСНДС КОНЕЦ), 0) КАК Сумма
  ИЗ РегистрНакопления.ОстаткиТоваров
  ГДЕ (&НаДату ЕСТЬ ПУСТО ИЛИ period <= &НаДату)

  ОБЪЕДИНИТЬ ВСЕ

  ВЫБРАТЬ
    "1. АКТИВЫ" КАК Раздел,
    "1.3. Товары в пути от поставщиков" КАК Статья,
    ЕстьNULL(СУММА(ВЫБОР КОГДА вид_движения = "Приход" ТОГДА Сумма ИНАЧЕ -Сумма КОНЕЦ), 0) КАК Сумма
  ИЗ РегистрНакопления.ТоварыВПути
  ГДЕ (&НаДату ЕСТЬ ПУСТО ИЛИ period <= &НаДату)

  ОБЪЕДИНИТЬ ВСЕ

  ВЫБРАТЬ
    "1. АКТИВЫ" КАК Раздел,
    "1.4. Дебиторская задолженность (клиенты)" КАК Статья,
    ВЫБОР КОГДА т.Сальдо > 0 ТОГДА т.Сальдо ИНАЧЕ 0 КОНЕЦ КАК Сумма
  ИЗ (ВЫБРАТЬ ЕстьNULL(СУММА(ВЫБОР КОГДА вид_движения = "Приход" ТОГДА Сумма ИНАЧЕ -Сумма КОНЕЦ), 0) КАК Сальдо
      ИЗ РегистрНакопления.Взаиморасчеты
      ГДЕ ТипКонтрагента = "Покупатель"
        И (&НаДату ЕСТЬ ПУСТО ИЛИ period <= &НаДату)) КАК т

  ОБЪЕДИНИТЬ ВСЕ

  ВЫБРАТЬ
    "1. АКТИВЫ" КАК Раздел,
    "1.5. Авансы выданные (поставщикам)" КАК Статья,
    ВЫБОР КОГДА т.Сальдо > 0 ТОГДА т.Сальдо ИНАЧЕ 0 КОНЕЦ КАК Сумма
  ИЗ (ВЫБРАТЬ ЕстьNULL(СУММА(ВЫБОР КОГДА вид_движения = "Приход" ТОГДА Сумма ИНАЧЕ -Сумма КОНЕЦ), 0) КАК Сальдо
      ИЗ РегистрНакопления.Взаиморасчеты
      ГДЕ ТипКонтрагента = "Поставщик"
        И (&НаДату ЕСТЬ ПУСТО ИЛИ period <= &НаДату)) КАК т

  ОБЪЕДИНИТЬ ВСЕ

  ВЫБРАТЬ
    "1. АКТИВЫ" КАК Раздел,
    "1.6. Прочая дебиторская задолженность" КАК Статья,
    ВЫБОР КОГДА т.Сальдо > 0 ТОГДА т.Сальдо ИНАЧЕ 0 КОНЕЦ КАК Сумма
  ИЗ (ВЫБРАТЬ ЕстьNULL(СУММА(ВЫБОР КОГДА вид_движения = "Приход" ТОГДА Сумма ИНАЧЕ -Сумма КОНЕЦ), 0) КАК Сальдо
      ИЗ РегистрНакопления.Взаиморасчеты
      ГДЕ ТипКонтрагента <> "Покупатель" И ТипКонтрагента <> "Поставщик"
        И (&НаДату ЕСТЬ ПУСТО ИЛИ period <= &НаДату)) КАК т

  ОБЪЕДИНИТЬ ВСЕ

  ВЫБРАТЬ
    "2. ПАССИВЫ И КАПИТАЛ" КАК Раздел,
    "2.1. Нераспределенная прибыль от продаж" КАК Статья,
    ЕстьNULL(СУММА(ВЫБОР КОГДА вид_движения = "Приход" ТОГДА (СуммаСНДС - СебестоимостьСНДС) ИНАЧЕ -(СуммаСНДС - СебестоимостьСНДС) КОНЕЦ), 0) КАК Сумма
  ИЗ РегистрНакопления.ВаловаяПрибыль
  ГДЕ (&НаДату ЕСТЬ ПУСТО ИЛИ period <= &НаДату)

  ОБЪЕДИНИТЬ ВСЕ

  ВЫБРАТЬ
    "2. ПАССИВЫ И КАПИТАЛ" КАК Раздел,
    "2.2. Авансы полученные (клиенты)" КАК Статья,
    ВЫБОР КОГДА т.Сальдо < 0 ТОГДА -т.Сальдо ИНАЧЕ 0 КОНЕЦ КАК Сумма
  ИЗ (ВЫБРАТЬ ЕстьNULL(СУММА(ВЫБОР КОГДА вид_движения = "Приход" ТОГДА Сумма ИНАЧЕ -Сумма КОНЕЦ), 0) КАК Сальдо
      ИЗ РегистрНакопления.Взаиморасчеты
      ГДЕ ТипКонтрагента = "Покупатель"
        И (&НаДату ЕСТЬ ПУСТО ИЛИ period <= &НаДату)) КАК т

  ОБЪЕДИНИТЬ ВСЕ

  ВЫБРАТЬ
    "2. ПАССИВЫ И КАПИТАЛ" КАК Раздел,
    "2.3. Кредиторская задолженность (поставщики)" КАК Статья,
    ВЫБОР КОГДА т.Сальдо < 0 ТОГДА -т.Сальдо ИНАЧЕ 0 КОНЕЦ КАК Сумма
  ИЗ (ВЫБРАТЬ ЕстьNULL(СУММА(ВЫБОР КОГДА вид_движения = "Приход" ТОГДА Сумма ИНАЧЕ -Сумма КОНЕЦ), 0) КАК Сальдо
      ИЗ РегистрНакопления.Взаиморасчеты
      ГДЕ ТипКонтрагента = "Поставщик"
        И (&НаДату ЕСТЬ ПУСТО ИЛИ period <= &НаДату)) КАК т

  ОБЪЕДИНИТЬ ВСЕ

  ВЫБРАТЬ
    "2. ПАССИВЫ И КАПИТАЛ" КАК Раздел,
    "2.4. Прочие обязательства" КАК Статья,
    ВЫБОР КОГДА т.Сальдо < 0 ТОГДА -т.Сальдо ИНАЧЕ 0 КОНЕЦ КАК Сумма
  ИЗ (ВЫБРАТЬ ЕстьNULL(СУММА(ВЫБОР КОГДА вид_движения = "Приход" ТОГДА Сумма ИНАЧЕ -Сумма КОНЕЦ), 0) КАК Сальдо
      ИЗ РегистрНакопления.Взаиморасчеты
      ГДЕ ТипКонтрагента <> "Покупатель" И ТипКонтрагента <> "Поставщик"
        И (&НаДату ЕСТЬ ПУСТО ИЛИ period <= &НаДату)) КАК т
