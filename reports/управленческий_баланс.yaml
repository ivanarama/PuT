      de: Zum Datum
      sr: На датум
      az: Tarixə
      es: A fecha
      fr: À la date
      hy: Ամսաթվով
      ka: თარიღით
      kk: Күніне
      pt: Na data
      ro: La data
      tr: Tarihe
      uk: На дату
      uz: Sanaga
      zh: 截至
query: |
  ВЫБРАТЬ
    "1. АКТИВЫ" КАК Раздел,
    "1.1. Денежные средства (кассы и банк)" КАК Статья,
    СУММА(ВЫБОР КОГДА вид_движения = "Приход" ТОГДА Сумма ИНАЧЕ -Сумма КОНЕЦ) КАК Сумма
  ИЗ РегистрНакопления.ДенежныеСредства
  ГДЕ (&НаДату ЕСТЬ ПУСТО ИЛИ period <= &НаДату)

  ОБЪЕДИНИТЬ ВСЕ

  ВЫБРАТЬ
    "1. АКТИВЫ" КАК Раздел,
    "1.2. Запасы товаров на складах" КАК Статья,
    СУММА(ВЫБОР КОГДА вид_движения = "Приход" ТОГДА Сумма ИНАЧЕ -Сумма КОНЕЦ) КАК Сумма
  ИЗ РегистрНакопления.ОстаткиТоваров
  ГДЕ (&НаДату ЕСТЬ ПУСТО ИЛИ period <= &НаДату)

  ОБЪЕДИНИТЬ ВСЕ

  ВЫБРАТЬ
    "1. АКТИВЫ" КАК Раздел,
    "1.3. Товары в пути от поставщиков" КАК Статья,
    СУММА(ВЫБОР КОГДА вид_движения = "Приход" ТОГДА Сумма ИНАЧЕ -Сумма КОНЕЦ) КАК Сумма
  ИЗ РегистрНакопления.ТоварыВПути
  ГДЕ (&НаДату ЕСТЬ ПУСТО ИЛИ period <= &НаДату)

  ОБЪЕДИНИТЬ ВСЕ

  ВЫБРАТЬ
    "1. АКТИВЫ" КАК Раздел,
    "1.4. Дебиторская задолженность (клиенты)" КАК Статья,
    СУММА(ВЫБОР КОГДА вид_движения = "Приход" ТОГДА Сумма ИНАЧЕ -Сумма КОНЕЦ) КАК Сумма
  ИЗ РегистрНакопления.Взаиморасчеты
  ГДЕ ТипКонтрагента = "Покупатель"
    И (&НаДату ЕСТЬ ПУСТО ИЛИ period <= &НаДату)

  ОБЪЕДИНИТЬ ВСЕ

  ВЫБРАТЬ
    "1. АКТИВЫ" КАК Раздел,
    "1.5. Авансы выданные (поставщикам)" КАК Статья,
    -СУММА(ВЫБОР КОГДА вид_движения = "Приход" ТОГДА Сумма ИНАЧЕ -Сумма КОНЕЦ) КАК Сумма
  ИЗ РегистрНакопления.Взаиморасчеты
  ГДЕ ТипКонтрагента = "Поставщик"
    И (&НаДату ЕСТЬ ПУСТО ИЛИ period <= &НаДату)

  ОБЪЕДИНИТЬ ВСЕ

  ВЫБРАТЬ
    "2. ПАССИВЫ И КАПИТАЛ" КАК Раздел,
    "2.1. Нераспределенная прибыль от продаж" КАК Статья,
    СУММА(ВЫБОР КОГДА вид_движения = "Приход" ТОГДА (Выручка - Себестоимость) ИНАЧЕ -(Выручка - Себестоимость) КОНЕЦ) КАК Сумма
  ИЗ РегистрНакопления.ВаловаяПрибыль
  ГДЕ (&НаДату ЕСТЬ ПУСТО ИЛИ period <= &НаДату)

  ОБЪЕДИНИТЬ ВСЕ

  ВЫБРАТЬ
    "2. ПАССИВЫ И КАПИТАЛ" КАК Раздел,
    "2.2. Прочие обязательства и капитал" КАК Статья,
    -СУММА(ВЫБОР КОГДА вид_движения = "Приход" ТОГДА Сумма ИНАЧЕ -Сумма КОНЕЦ) КАК Сумма
  ИЗ РегистрНакопления.Взаиморасчеты
  ГДЕ ТипКонтрагента <> "Покупатель" И ТипКонтрагента <> "Поставщик"
    И (&НаДату ЕСТЬ ПУСТО ИЛИ period <= &НаДату)

composition:
  groupings:
    - Раздел
    - Статья
  columns: []
  measures:
    - field: Сумма
      agg: sum
      title: Сумма
      align: right
      format: '#,##0.00'
  totals:
    grand: false
    subtotals: true
  detail: false
  sort:
    - field: Раздел
      dir: asc
    - field: Статья
      dir: asc
  chart:
    type: bar
    category: Раздел
    series:
      - Сумма
