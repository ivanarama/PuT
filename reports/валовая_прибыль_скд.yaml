# Запрос отдаёт ПЛОСКИЕ детальные строки (без СГРУППИРОВАТЬ/УПОРЯДОЧИТЬ) —
# группировку, итоги и сортировку выполняет блок composition (лайт-СКД) в Go.
query: |
    ВЫБРАТЬ
      Организация   КАК Организация,
      Номенклатура  КАК Номенклатура,
      Количество    КАК Количество,
      СуммаСНДС     КАК СуммаСНДС,
      СуммаНДС      КАК СуммаНДС,
      ВЫБОР КОГДА &СУчетомНДС = Истина ТОГДА СуммаСНДС ИНАЧЕ Выручка КОНЕЦ КАК Выручка,
      Себестоимость КАК Себестоимость,
      CAST(ВЫБОР КОГДА &СУчетомНДС = Истина ТОГДА СуммаСНДС ИНАЧЕ Выручка КОНЕЦ AS NUMERIC) - CAST(Себестоимость AS NUMERIC) КАК ВаловаяПрибыль
    ИЗ РегистрНакопления.ВаловаяПрибыль
    ГДЕ (&Начало ЕСТЬ ПУСТО ИЛИ period >= &Начало)
      И (&Конец  ЕСТЬ ПУСТО ИЛИ period <= &Конец)
      И (&Организация ЕСТЬ ПУСТО ИЛИ Организация = &Организация)
# Система компоновки данных: два уровня группировки, итоги,
# условное оформление по подытогам и декларативный график (ECharts).
composition:
    groupings:
        - Организация
        - Номенклатура
    columns: []
    measures:
        - field: Количество
          agg: sum
          title: Количество
          align: ""
          format: '#,##0.000'
          expr: ""
        - field: СуммаСНДС
          agg: sum
          title: Сумма с НДС
          align: ""
          format: '#,##0.00'
          expr: ""
        - field: СуммаНДС
          agg: sum
          title: Сумма НДС
          align: ""
          format: '#,##0.00'
          expr: ""
        - field: Выручка
          agg: sum
          title: Выручка (без НДС)
          align: ""
          format: '#,##0.00'
          expr: ""
        - field: Себестоимость
          agg: sum
          title: Себестоимость
          align: ""
          format: '#,##0.00'
          expr: ""
        - field: ВаловаяПрибыль
          agg: sum
          title: Валовая прибыль
          align: ""
          format: '#,##0.00'
          expr: ""
    totals:
        grand: true
        subtotals: true
    detail: false
    sort:
        - field: ВаловаяПрибыль
          dir: desc
    conditional:
        - when: ВаловаяПрибыль < 0
          field: ""
          style:
            color: '#c00000'
            background: ""
            bold: true
            italic: false
        - when: ВаловаяПрибыль > 100000
          field: ВаловаяПрибыль
          style:
            color: ""
            background: '#e6ffed'
            bold: false
            italic: false
    appearance:
        lines: ""
        zebra: false
    chart:
        type: bar
        category: Номенклатура
        series:
            - ВаловаяПрибыль
    detail_link: ""
    detail_entity: ""
