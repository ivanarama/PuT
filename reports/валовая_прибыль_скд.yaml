# Запрос отдаёт ПЛОСКИЕ детальные строки (без СГРУППИРОВАТЬ/УПОРЯДОЧИТЬ) —
# группировку, итоги и сортировку выполняет блок composition (лайт-СКД) в Go.
query: |
  ВЫБРАТЬ
    Организация   КАК Организация,
    Номенклатура  КАК Номенклатура,
    Выручка       КАК Выручка,
    Себестоимость КАК Себестоимость,
    CAST(Выручка AS NUMERIC) - CAST(Себестоимость AS NUMERIC) КАК ВаловаяПрибыль
  ИЗ РегистрНакопления.ВаловаяПрибыль
  ГДЕ (&Начало ЕСТЬ ПУСТО ИЛИ period >= &Начало)
    И (&Конец  ЕСТЬ ПУСТО ИЛИ period <= &Конец)
    И (&Организация ЕСТЬ ПУСТО ИЛИ Организация = &Организация)
# Система компоновки данных: два уровня группировки, итоги,
# условное оформление по подытогам и декларативный график (ECharts).
composition:
  groupings:                       # порядок = вложенность уровней
    - Организация
    - Номенклатура
  measures:                        # sum через decimal; format скрывает float-артефакт при выводе
    - { field: Выручка,        agg: sum, title: "Выручка",         format: "#,##0.00" }
    - { field: Себестоимость,  agg: sum, title: "Себестоимость",   format: "#,##0.00" }
    - { field: ВаловаяПрибыль, agg: sum, title: "Валовая прибыль", format: "#,##0.00" }
  totals:                          # подытоги по группам + общий итог
    grand: true
    subtotals: true
  detail: false                    # без строк-движений: группировка до номенклатуры
  sort:
    - { field: ВаловаяПрибыль, dir: desc }
  conditional:                     # оформление по подытогам групп; первое правило — победитель
    # убыточная группа целиком — красным жирным
    - when: "ВаловаяПрибыль < 0"
      field: ""
      style: { color: "#c00000", bold: true }
    # крупная прибыль — зелёный фон ячейки (порог иллюстративный, подстройте)
    - when: "ВаловаяПрибыль > 100000"
      field: ВаловаяПрибыль
      style: { background: "#e6ffed" }
  chart:                           # столбцы прибыли по организациям (верхний уровень)
    type: bar
    category: Организация
    series:
      - ВаловаяПрибыль
