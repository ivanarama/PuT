# Запрос отдаёт ПЛОСКИЕ детальные строки (без СГРУППИРОВАТЬ/УПОРЯДОЧИТЬ) —

# группировку, итоги и сортировку выполняет блок composition (лайт-СКД) в Go.
query: |
  ВЫБРАТЬ
    Организация   КАК Организация,
    Номенклатура  КАК Номенклатура,
    ВЫБОР КОГДА вид_движения = "Приход" ТОГДА 1 ИНАЧЕ -1 КОНЕЦ * Количество    КАК Количество,
    ВЫБОР КОГДА вид_движения = "Приход" ТОГДА 1 ИНАЧЕ -1 КОНЕЦ * СуммаСНДС     КАК СуммаСНДС,
    ВЫБОР КОГДА вид_движения = "Приход" ТОГДА 1 ИНАЧЕ -1 КОНЕЦ * СуммаНДС      КАК СуммаНДС,
    ВЫБОР КОГДА вид_движения = "Приход" ТОГДА 1 ИНАЧЕ -1 КОНЕЦ * (ВЫБОР КОГДА &СУчетомНДС = Истина И (СуммаСНДС ЕСТЬ НЕ NULL И СуммаСНДС <> 0) ТОГДА СуммаСНДС ИНАЧЕ Выручка КОНЕЦ) КАК Выручка,
    ВЫБОР КОГДА вид_движения = "Приход" ТОГДА 1 ИНАЧЕ -1 КОНЕЦ * (ВЫБОР КОГДА &СУчетомНДС = Истина И (СебестоимостьСНДС ЕСТЬ НЕ NULL И СебестоимостьСНДС <> 0) ТОГДА СебестоимостьСНДС ИНАЧЕ Себестоимость КОНЕЦ) КАК Себестоимость,
    CAST(ВЫБОР КОГДА вид_движения = "Приход" ТОГДА 1 ИНАЧЕ -1 КОНЕЦ * (ВЫБОР КОГДА &СУчетомНДС = Истина И (СуммаСНДС ЕСТЬ НЕ NULL И СуммаСНДС <> 0) ТОГДА СуммаСНДС ИНАЧЕ Выручка КОНЕЦ) AS NUMERIC) - CAST(ВЫБОР КОГДА вид_движения = "Приход" ТОГДА 1 ИНАЧЕ -1 КОНЕЦ * (ВЫБОР КОГДА &СУчетомНДС = Истина И (СебестоимостьСНДС ЕСТЬ НЕ NULL И СебестоимостьСНДС <> 0) ТОГДА СебестоимостьСНДС ИНАЧЕ Себестоимость КОНЕЦ) AS NUMERIC) КАК ВаловаяПрибыль
  ИЗ РегистрНакопления.ВаловаяПрибыль
  ГДЕ (&Начало ЕСТЬ ПУСТО ИЛИ period >= &Начало)
    И (&Конец  ЕСТЬ ПУСТО ИЛИ period <= &Конец)
    И (&Организация ЕСТЬ ПУСТО ИЛИ Организация = &Организация)
# Система компоновки данных: два уровня группировки, итоги,

