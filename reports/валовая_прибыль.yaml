  - label: "Номенклатура"
    labels:
      az: Adlandırma
      de: Artikel
      en: Item
      es: Nomenclatura
      fr: Nomenclature
      hy: Անվանակարգ
      ka: ნომენკლატურა
      kk: Номенклатура
      pt: Nomenclatura
      ro: Nomenclatură
      sr: Артикал
      tr: Ürün
      uk: Номенклатура
      uz: Nomеnklatura
    name: Номенклатура
    type: reference:Номенклатура
  - label: "Организация"
    labels:
      az: Təşkilat
      de: Organisation
      en: Organization
      es: Organización
      fr: Organisation
      hy: Կազմակերպություն
      ka: ორგანიზაცია
      kk: Ұйым
      pt: Organização
      ro: Organizație
      sr: Организација
      tr: Kuruluş
      uk: Організація
      uz: Tashkilot
      zh: 组织
    name: Организация
    type: reference:Организация
  - default: true
    label: "С учётом НДС"
    labels:
      az: ƏDV daxil
      de: Inkl. MwSt.
      en: Including VAT
      es: Con IVA
      fr: Avec TVA
      hy: ԱԱՀ-ով
      ka: დღგ-ით
      kk: ҚҚС қоса
      pt: Com IVA
      ro: Cu TVA
      sr: Са ПДВ
      tr: KDV dahil
      uk: З урахуванням ПДВ
      uz: QQS bilan
      zh: 含增值税
    name: СУчетомНДС
    type: bool
query: |
  ВЫБРАТЬ
    Номенклатура,
    СУММА(ВЫБОР КОГДА вид_движения = "Приход" ТОГДА 1 ИНАЧЕ -1 КОНЕЦ * Количество)  КАК Количество,
    СУММА(ВЫБОР КОГДА вид_движения = "Приход" ТОГДА 1 ИНАЧЕ -1 КОНЕЦ * СуммаСНДС)   КАК СуммаСНДС,
    СУММА(ВЫБОР КОГДА вид_движения = "Приход" ТОГДА 1 ИНАЧЕ -1 КОНЕЦ * СуммаНДС)    КАК СуммаНДС,
    СУММА(ВЫБОР КОГДА вид_движения = "Приход" ТОГДА 1 ИНАЧЕ -1 КОНЕЦ * (ВЫБОР КОГДА &СУчетомНДС = Истина И (СуммаСНДС ЕСТЬ НЕ NULL И СуммаСНДС <> 0) ТОГДА СуммаСНДС ИНАЧЕ Выручка КОНЕЦ)) КАК Выручка,
    СУММА(ВЫБОР КОГДА вид_движения = "Приход" ТОГДА 1 ИНАЧЕ -1 КОНЕЦ * (ВЫБОР КОГДА &СУчетомНДС = Истина И (СебестоимостьСНДС ЕСТЬ НЕ NULL И СебестоимостьСНДС <> 0) ТОГДА СебестоимостьСНДС ИНАЧЕ Себестоимость КОНЕЦ)) КАК Себестоимость,
    СУММА(ВЫБОР КОГДА вид_движения = "Приход" ТОГДА 1 ИНАЧЕ -1 КОНЕЦ * (ВЫБОР КОГДА &СУчетомНДС = Истина И (СуммаСНДС ЕСТЬ НЕ NULL И СуммаСНДС <> 0) ТОГДА СуммаСНДС ИНАЧЕ Выручка КОНЕЦ)) - СУММА(ВЫБОР КОГДА вид_движения = "Приход" ТОГДА 1 ИНАЧЕ -1 КОНЕЦ * (ВЫБОР КОГДА &СУчетомНДС = Истина И (СебестоимостьСНДС ЕСТЬ НЕ NULL И СебестоимостьСНДС <> 0) ТОГДА СебестоимостьСНДС ИНАЧЕ Себестоимость КОНЕЦ)) КАК ВаловаяПрибыль
  ИЗ РегистрНакопления.ВаловаяПрибыль
  ГДЕ (&Начало ЕСТЬ ПУСТО ИЛИ period >= &Начало)
    И (&Конец ЕСТЬ ПУСТО ИЛИ period <= &Конец)
    И (&Номенклатура ЕСТЬ ПУСТО ИЛИ Номенклатура = &Номенклатура)
    И (&Организация ЕСТЬ ПУСТО ИЛИ Организация = &Организация)
  СГРУППИРОВАТЬ ПО Номенклатура
  УПОРЯДОЧИТЬ ПО ВаловаяПрибыль УБЫВ
