query: |
  ВЫБРАТЬ
    Номенклатура,
    СУММА(Количество)    КАК Количество,
    СУММА(СуммаСНДС)     КАК СуммаСНДС,
    СУММА(СуммаНДС)      КАК СуммаНДС,
    СУММА(ВЫБОР КОГДА &СУчетомНДС = Истина И (СуммаСНДС ЕСТЬ НЕ NULL И СуммаСНДС <> 0) ТОГДА СуммаСНДС ИНАЧЕ Выручка КОНЕЦ) КАК Выручка,
    СУММА(Себестоимость) КАК Себестоимость,
    СУММА(ВЫБОР КОГДА &СУчетомНДС = Истина И (СуммаСНДС ЕСТЬ НЕ NULL И СуммаСНДС <> 0) ТОГДА СуммаСНДС ИНАЧЕ Выручка КОНЕЦ) - СУММА(Себестоимость) КАК ВаловаяПрибыль
  ИЗ РегистрНакопления.ВаловаяПрибыль
  ГДЕ (&Начало ЕСТЬ ПУСТО ИЛИ period >= &Начало)
    И (&Конец ЕСТЬ ПУСТО ИЛИ period <= &Конец)
    И (&Номенклатура ЕСТЬ ПУСТО ИЛИ Номенклатура = &Номенклатура)
  СГРУППИРОВАТЬ ПО Номенклатура
  УПОРЯДОЧИТЬ ПО ВаловаяПрибыль УБЫВ
