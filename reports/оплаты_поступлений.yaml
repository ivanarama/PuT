query: |
  ВЫБРАТЬ
    ДокументПоступления,
    Контрагент,
    СУММА(ВЫБОР КОГДА вид_движения = "Расход" ТОГДА Сумма ИНАЧЕ 0 КОНЕЦ) КАК Долг,
    СУММА(ВЫБОР КОГДА вид_движения = "Приход" ТОГДА Сумма ИНАЧЕ 0 КОНЕЦ) КАК Оплачено,
    СУММА(ВЫБОР КОГДА вид_движения = "Расход" ТОГДА Сумма ИНАЧЕ -Сумма КОНЕЦ) КАК Остаток
  ИЗ РегистрНакопления.Взаиморасчеты
  ГДЕ ДокументПоступления ЕСТЬ НЕ ПУСТО
    И (&Контрагент ЕСТЬ ПУСТО ИЛИ Контрагент = &Контрагент)
    И (&НачалоПериода ЕСТЬ ПУСТО ИЛИ period >= &НачалоПериода)
    И (&КонецПериода ЕСТЬ ПУСТО ИЛИ period <= &КонецПериода)
  СГРУППИРОВАТЬ ПО ДокументПоступления, Контрагент
  УПОРЯДОЧИТЬ ПО Остаток УБЫВ
