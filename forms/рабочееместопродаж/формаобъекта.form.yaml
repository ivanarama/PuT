attributes:
  - main: true
    name: Объект
elements:
  - children:
      # ── Вкладка 1: Параметры продажи ────────────────────────────────────
      - children:
          - children:
              - data_path: Объект.Дата
                kind: ПолеВвода
                name: ПолеДата
                required: true
                title:
                  de: "Datum"
                  en: "Date"
                  ru: "Дата"
                  sr: "Датум"
              - choice: true
                data_path: Объект.Организация
                hint: "Заполняется автоматически, если не указана"
                kind: ПолеВвода
                name: ПолеОрганизация
                title:
                  de: "Organisation"
                  en: "Organization"
                  ru: "Организация"
                  sr: "Организација"
              - choice: true
                data_path: Объект.Покупатель
                events:
                  ПриИзменении: ПокупательПриИзменении
                kind: ПолеВвода
                name: ПолеПокупатель
                required: true
                title:
                  de: "Kunde"
                  en: "Customer"
                  ru: "Покупатель"
                  sr: "Купац"
              - choice: true
                data_path: Объект.Склад
                hint: "Подбор показывает свободный остаток этого склада"
                kind: ПолеВвода
                name: ПолеСклад
                required: true
                title:
                  de: "Lager"
                  en: "Warehouse"
                  ru: "Склад"
                  sr: "Магацин"
              - choice: true
                data_path: Объект.ТипЦенПродажи
                events:
                  ПриИзменении: ТипЦенПродажиПриИзменении
                hint: "Заполняется из карточки покупателя"
                kind: ПолеВвода
                name: ПолеТипЦенПродажи
                title:
                  de: "Verkaufspreistyp"
                  en: "Sales price type"
                  ru: "Тип цен продажи"
                  sr: "Тип цене продаје"
              - data_path: Объект.Штрихкод
                events:
                  ПриИзменении: ПолеШтрихкодаПриИзменении
                hint: "Сканер: товар добавится в таблицу автоматически"
                kind: ПолеВвода
                name: ПолеШтрихкод
                title:
                  de: "Barcode"
                  en: "Barcode"
                  ru: "Штрихкод"
                  sr: "Баркод"
              - choice: true
                data_path: Объект.Касса
                hint: "Наличная касса для оплаты сразу (ПКО)"
                kind: ПолеВвода
                name: ПолеКасса
                title:
                  de: "Kasse"
                  en: "Cash desk"
                  ru: "Касса"
                  sr: "Каса"
              - data_path: Объект.ОплатитьСразу
                kind: Флажок
                name: ПолеОплатитьСразу
                title:
                  de: "Sofort bezahlen"
                  en: "Pay immediately (cash receipt)"
                  ru: "Оплатить сразу (ПКО)"
                  sr: "Плати одмах"
            kind: ГруппаФормы
            name: ГруппаШапка
            title:
              de: "Verkaufsparameter"
              en: "Sale parameters"
              ru: "Параметры продажи"
              sr: "Параметри продаје"
        kind: Страница
        name: СтраницаОсновное
        title:
          de: "Verkauf"
          en: "Sale"
          ru: "Продажа"
          sr: "Продаја"
      # ── Вкладка 2: Подбор товара ────────────────────────────────────────
      - children:
          - children:
              - children:
                  - events:
                      Выбор: КнопкаПодборВыбор
                      Нажатие: КнопкаПодборНажатие
                    hint: "Подобрать товары со свободным остатком на складе"
                    kind: Кнопка
                    name: КнопкаПодбор
                    title:
                      de: "Auswahl"
                      en: "Pick items"
                      ru: "\U0001F50D Подбор товара"
                      sr: "Избор"
                  - events:
                      Нажатие: КнопкаОчиститьНажатие
                    kind: Кнопка
                    name: КнопкаОчистить
                    title:
                      de: "Leeren"
                      en: "Clear"
                      ru: "Очистить"
                      sr: "Обриши"
                data_path: Товары
                events:
                  ПриИзменении: ТабТоварыПриИзменении
                kind: ТабличнаяЧасть
                name: ТабТовары
                title:
                  de: "Artikel"
                  en: "Items"
                  ru: "Товары"
                  sr: "Артикли"
                use_grid: true
            kind: ГруппаФормы
            name: ГруппаТабЧасть
            title:
              de: "Verkaufsinhalt"
              en: "Sale contents"
              ru: "Состав продажи"
              sr: "Садржај продаје"
          - children:
              - events:
                  Нажатие: КнопкаОформитьНажатие
                hint: "Создать и провести реализацию (и ПКО, если включена оплата)"
                kind: Кнопка
                name: КнопкаОформить
                title:
                  de: "Verkauf abschließen"
                  en: "Process sale"
                  ru: "\U0001F4B0 Оформить продажу"
                  sr: "Изврши продају"
            kind: ГруппаФормы
            name: ГруппаДействия
            title:
              de: "Abschluss"
              en: "Checkout"
              ru: "Оформление"
              sr: "Издавање"
        kind: Страница
        name: СтраницаТовары
        title:
          de: "Artikel"
          en: "Items"
          ru: "Товары"
          sr: "Артикли"
    kind: СтраницыФормы
    name: ОсновныеЗакладки
events:
  ПриОткрытии: ПриОткрытииФормы
form:
  auto_save_settings: true
  entity: РабочееМестоПродаж
  kind: object
  name: ФормаОбъекта
  title:
    de: "Verkaufsarbeitsplatz"
    en: "Sales workplace"
    ru: "АРМ Продавца"
    sr: "Радно место продаје"
  vertical_scroll: auto
schema: onebase.form/v1
