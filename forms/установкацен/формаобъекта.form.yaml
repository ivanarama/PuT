schema: onebase.form/v1

form:
  name: ФормаОбъекта
  kind: object
  entity: УстановкаЦен
  title:
    ru: "Установка цен"
    en: "Price update"
    de: "Preisaktualisierung"
    sr: "Утврђивање цена"
  auto_save_settings: true
  vertical_scroll: auto

attributes:
  - name: Объект
    type: DocumentRef.УстановкаЦен
    save: true
    main: true

elements:
  - kind: СтраницыФормы
    name: ОсновныеЗакладки
    children:

      - kind: Страница
        name: СтраницаОсновное
        title:
          ru: "Основное"
          en: "General"
          de: "Allgemein"
          sr: "Опште"
        children:
          - kind: ГруппаФормы
            name: ГруппаШапка
            title:
              ru: "Шапка документа"
              en: "Document header"
              de: "Belegkopf"
              sr: "Заглавље документа"
            children:
              - kind: ПолеВвода
                name: ПолеНомер
                title:
                  ru: "Номер"
                  en: "Number"
                  de: "Nummer"
                  sr: "Број"
                data_path: Объект.Номер
                readonly: true
                hint: "УЦ-NNNNN"
              - kind: ПолеВвода
                name: ПолеДата
                title:
                  ru: "Дата"
                  en: "Date"
                  de: "Datum"
                  sr: "Датум"
                data_path: Объект.Дата
                required: true
                events:
                  ПриИзменении: ДатаПриИзменении
              - kind: ПолеВвода
                name: ПолеОрганизация
                title:
                  ru: "Организация"
                  en: "Organization"
                  de: "Organisation"
                  sr: "Организација"
                data_path: Объект.Организация
                choice: true
              - kind: ПолеВвода
                name: ПолеТипЦен
                title:
                  ru: "Тип цен"
                  en: "Price type"
                  de: "Preistyp"
                  sr: "Тип цене"
                data_path: Объект.ТипЦен
                required: true
                choice: true
                hint: "Цены какого типа устанавливаются этим документом"

          - kind: ГруппаФормы
            name: ГруппаТабЧасть
            title:
              ru: "Цены номенклатуры"
              en: "Item prices"
              de: "Artikelpreise"
              sr: "Цене артикала"
            children:
              - kind: ТабличнаяЧасть
                name: ТабЦены
                title:
                  ru: "Цены"
                  en: "Prices"
                  de: "Preise"
                  sr: "Цене"
                data_path: Объект.Цены
              - kind: Кнопка
                name: КнопкаОчистить
                title:
                  ru: "Очистить таблицу"
                  en: "Clear table"
                  de: "Leeren"
                  sr: "Обриши табелу"
                events:
                  Нажатие: КнопкаОчиститьНажатие

events:
  ПриОткрытии: ПриОткрытииФормы
  ПередЗаписью: ПередЗаписьюФормы
  ПриЗаписи: ПриЗаписиФормы
