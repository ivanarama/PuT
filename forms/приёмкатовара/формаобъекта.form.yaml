  entity: ПриёмкаТовара
  kind: object
  name: ФормаОбъекта
  title:
    de: "Wareneingang-Arbeitsplatz"
    en: "Goods receipt workplace"
    ru: "АРМ Приёмки"
    sr: "Радно место пријема"
  vertical_scroll: auto
schema: onebase.form/v1
