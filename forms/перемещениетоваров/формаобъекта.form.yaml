schema: onebase.form/v1

form:
  name: ФормаОбъекта
  kind: object
  entity: ПеремещениеТоваров
  title:
    ru: "Перемещение товаров"
    en: "Inventory transfer"
    de: "Lagerumbuchung"
    sr: "Пребацивање робе"
  auto_save_settings: true
  vertical_scroll: auto

attributes:
  - name: Объект
    type: DocumentRef.ПеремещениеТоваров
    save: true
    main: true

elements:
  - kind: СтраницыФормы
    name: ОсновныеЗакладки
    children:

      - kind: Страница
        name: СтраницаОсновное
        title:
          ru: "Основное"
          en: "General"
          de: "Allgemein"
          sr: "Опште"
        children:
          - kind: ГруппаФормы
            name: ГруппаШапка
            title:
              ru: "Шапка документа"
              en: "Document header"
              de: "Belegkopf"
              sr: "Заглавље документа"
            children:
              - kind: ПолеВвода
                name: ПолеНомер
                title:
                  ru: "Номер"
                  en: "Number"
                  de: "Nummer"
                  sr: "Број"
                data_path: Объект.Номер
                readonly: true
                hint: "ПЕР-NNNNN"
              - kind: ПолеВвода
                name: ПолеДата
                title:
                  ru: "Дата"
                  en: "Date"
                  de: "Datum"
                  sr: "Датум"
                data_path: Объект.Дата
                required: true
                events:
                  ПриИзменении: ДатаПриИзменении
              - kind: ПолеВвода
                name: ПолеОрганизация
                title:
                  ru: "Организация"
                  en: "Organization"
                  de: "Organisation"
                  sr: "Организација"
                data_path: Объект.Организация
                choice: true
              - kind: ПолеВвода
                name: ПолеСкладОтправитель
                title:
                  ru: "Склад-отправитель"
                  en: "From warehouse"
                  de: "Quelllager"
                  sr: "Магацин отпремања"
                data_path: Объект.СкладОтправитель
                required: true
                choice: true
                events:
                  ПриИзменении: СкладОтправительПриИзменении
              - kind: ПолеВвода
                name: ПолеСкладПолучатель
                title:
                  ru: "Склад-получатель"
                  en: "To warehouse"
                  de: "Ziellager"
                  sr: "Магацин пријема"
                data_path: Объект.СкладПолучатель
                required: true
                choice: true
                events:
                  ПриИзменении: СкладПолучательПриИзменении
              - kind: ПолеВвода
                name: ПолеСумма
                title:
                  ru: "Сумма перемещения"
                  en: "Transfer amount"
                  de: "Umbuchungssumme"
                  sr: "Износ пребацивања"
                data_path: Объект.Сумма
                readonly: true

          - kind: ГруппаФормы
            name: ГруппаТабЧасть
            title:
              ru: "Перемещаемые товары"
              en: "Items to transfer"
              de: "Umbuchungspositionen"
              sr: "Ставке за пребацивање"
            children:
              - kind: ТабличнаяЧасть
                name: ТабТовары
                title:
                  ru: "Товары"
                  en: "Items"
                  de: "Artikel"
                  sr: "Артикли"
                data_path: Объект.Товары
              - kind: Кнопка
                name: КнопкаПересчитать
                title:
                  ru: "Пересчитать суммы"
                  en: "Recalculate"
                  de: "Neu berechnen"
                  sr: "Прерачунај"
                events:
                  Нажатие: КнопкаПересчитатьНажатие
              - kind: Кнопка
                name: КнопкаОчистить
                title:
                  ru: "Очистить таблицу"
                  en: "Clear table"
                  de: "Leeren"
                  sr: "Обриши табелу"
                events:
                  Нажатие: КнопкаОчиститьНажатие

events:
  ПриОткрытии: ПриОткрытииФормы
  ПередЗаписью: ПередЗаписьюФормы
  ПриЗаписи: ПриЗаписиФормы
