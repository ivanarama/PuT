      - events:
          Нажатие: КнопкаЗаполнитьНажатие
        kind: Кнопка
        name: КнопкаЗаполнить
        title:
          en: Fill from book stock
          ru: Заполнить по учётным остаткам
      - events:
          Нажатие: КнопкаОформитьНажатие
        kind: Кнопка
        name: КнопкаОформить
        title:
          en: Create surplus/shortage docs
          ru: Оформить излишки и недостачи
    kind: ГруппаФормы
    name: ГруппаДействия
