attributes:
  - main: true
    name: Объект
    save: true
    type: DocumentRef.ПоступлениеТоваров
elements:
  - children:
      - children:
          - children:
              - data_path: Объект.Номер
                hint: "ПОС-NNNNN"
                kind: ПолеВвода
                name: ПолеНомер
                readonly: true
                title:
                  de: "Nummer"
                  en: "Number"
                  ru: "Номер"
                  sr: "Број"
              - data_path: Объект.Дата
                events:
                  ПриИзменении: ДатаПриИзменении
                kind: ПолеВвода
                name: ПолеДата
                required: true
                title:
                  de: "Datum"
                  en: "Date"
                  ru: "Дата"
                  sr: "Датум"
              - choice: true
                data_path: Объект.Организация
                kind: ПолеВвода
                name: ПолеОрганизация
                title:
                  de: "Organisation"
                  en: "Organization"
                  ru: "Организация"
                  sr: "Организација"
            kind: ГруппаФормы
            name: ГруппаШапка
            title:
              de: "Belegkopf"
              en: "Document header"
              ru: "Шапка документа"
              sr: "Заглавље документа"
          - children:
              - data_path: Объект.СуммаБезНДС
                kind: ПолеВвода
                name: ПолеСуммаБезНДС
                readonly: true
                title:
                  de: "Betrag o. USt."
                  en: "Amount excl. VAT"
                  ru: "Сумма без НДС"
                  sr: "Износ без ПДВ"
              - data_path: Объект.СуммаНДС
                kind: ПолеВвода
                name: ПолеСуммаНДС
                readonly: true
                title:
                  de: "USt.-Betrag"
                  en: "VAT amount"
                  ru: "Сумма НДС"
                  sr: "Износ ПДВ"
              - data_path: Объект.Сумма
                kind: ПолеВвода
                name: ПолеСумма
                readonly: true
                title:
                  de: "Gesamt"
                  en: "Total"
                  ru: "Всего"
                  sr: "Укупно"
              - data_path: Объект.СрокОплаты
                kind: ПолеВвода
                name: ПолеСрокОплаты
                title:
                  de: "Zahlungsziel"
                  en: "Payment due"
                  ru: "Срок оплаты"
                  sr: "Rok plaćanja"
            kind: ГруппаФормы
            name: ГруппаИтоги
            title:
              de: "Summen"
              en: "Totals"
              ru: "Итоги"
              sr: "Укупно"
        kind: Страница
        name: СтраницаОсновное
        title:
          de: "Allgemein"
          en: "General"
          ru: "Основное"
          sr: "Опште"
      - children:
          - children:
              - choice: true
                data_path: Объект.Поставщик
                kind: ПолеВвода
                name: ПолеПоставщик
                required: true
                title:
                  de: "Lieferant"
                  en: "Supplier"
                  ru: "Поставщик"
                  sr: "Добављач"
              - choice: true
                data_path: Объект.Склад
                kind: ПолеВвода
                name: ПолеСклад
                required: true
                title:
                  de: "Lager"
                  en: "Warehouse"
                  ru: "Склад"
                  sr: "Магацин"
              - choice: true
                data_path: Объект.ЗаказПоставщику
                hint: "Заказ, по которому поступает товар (снимает ожидание)"
                kind: ПолеВвода
                name: ПолеЗаказПоставщику
                title:
                  de: "Lieferantenbestellung"
                  en: "Purchase order"
                  ru: "Заказ поставщику"
                  sr: "Налог добављачу"
              - choice: true
                data_path: Объект.СпособУчетаНДС
                events:
                  ПриИзменении: СпособУчетаНДСПриИзменении
                hint: "ВТомЧисле — НДС включён в сумму, Сверху — НДС сверху"
                kind: ПолеВвода
                name: ПолеСпособУчетаНДС
                title:
                  de: "USt."
                  en: "VAT"
                  ru: "НДС"
                  sr: "ПДВ"
            kind: ГруппаФормы
            name: ГруппаРеквизиты
            title:
              de: "Lieferantendaten"
              en: "Supplier details"
              ru: "Реквизиты поставщика"
              sr: "Подаци о добављачу"
        kind: Страница
        name: СтраницаКонтрагент
        title:
          de: "Lieferant & Lager"
          en: "Supplier & warehouse"
          ru: "Поставщик и склад"
          sr: "Добављач и магацин"
      - children:
          - children:
              - data_path: Объект.Товары
                events:
                  ПриИзменении: ТабТоварыПриИзменении
                kind: ТабличнаяЧасть
                name: ТабТовары
                title:
                  de: "Artikel"
                  en: "Items"
                  ru: "Товары"
                  sr: "Артикли"
                use_grid: true
              - events:
                  Нажатие: КнопкаПересчитатьНажатие
                kind: Кнопка
                name: КнопкаПересчитать
                title:
                  de: "Neu berechnen"
                  en: "Recalculate"
                  ru: "Пересчитать суммы"
                  sr: "Прерачунај"
              - events:
                  Нажатие: КнопкаОчиститьНажатие
                kind: Кнопка
                name: КнопкаОчистить
                title:
                  de: "Leeren"
                  en: "Clear table"
                  ru: "Очистить таблицу"
                  sr: "Обриши табелу"
            kind: ГруппаФормы
            name: ГруппаТабЧасть
            title:
              de: "Zugangsinhalt"
              en: "Receipt contents"
              ru: "Состав поступления"
              sr: "Садржај пријема"
        kind: Страница
        name: СтраницаТовары
        title:
          de: "Artikel"
          en: "Items"
          ru: "Товары"
          sr: "Артикли"
    kind: СтраницыФормы
    name: ОсновныеЗакладки
events:
  ПередЗаписью: ПередЗаписьюФормы
  ПриЗаписи: ПриЗаписиФормы
  ПриОткрытии: ПриОткрытииФормы
form:
  auto_save_settings: true
  entity: ПоступлениеТоваров
  kind: object
  name: ФормаОбъекта
  title:
    de: "Warenzugang"
    en: "Goods receipt"
    ru: "Поступление товаров"
    sr: "Пријем робе"
  vertical_scroll: auto
schema: onebase.form/v1
