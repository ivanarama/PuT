attributes:
  - main: true
    name: Объект
    save: false
  - name: ИдЗадачи
    save: false
    type: string
  - name: СостояниеЗадачи
    save: false
    type: string
  - name: РезультатЗадачи
    save: false
    type: string
elements:
  - background: '#eff6ff'
    children:
      - data_path: Объект.Организация
        kind: ПолеВвода
        name: ПолеОрганизация
        title:
          ru: Организация
      - data_path: Объект.ДатаНачала
        kind: ПолеДаты
        name: ПолеДатаНачала
        title:
          ru: Дата начала
      - data_path: Объект.ДатаОкончания
        kind: ПолеДаты
        name: ПолеДатаОкончания
        title:
          ru: Дата окончания
      - data_path: Объект.УстановитьДатуЗапрета
        kind: ПолеВвода
        name: ПолеУстановитьДатуЗапрета
        title:
          ru: Закрыть период (установить дату запрета по дату окончания)
    kind: ГруппаФормы
    name: Параметры
    title:
      ru: Параметры операции
  - background: '#f0fdf4'
    children:
      - events:
          Нажатие: ЗапуститьВФоне
        kind: Кнопка
        name: ЗапуститьВФоне
        title:
          ru: Поставить в очередь
      - events:
          Нажатие: ОбновитьСтатус
        kind: Кнопка
        name: ОбновитьСтатус
        title:
          ru: Обновить результат
      - data_path: Объект.СостояниеЗадачи
        kind: ПолеВвода
        name: Статус
        readonly: true
        title:
          ru: Состояние
      - data_path: Объект.РезультатЗадачи
        kind: ПолеВвода
        multiline: true
        name: Результат
        readonly: true
        title:
          ru: Результат и сообщения
      - data_path: Объект.ИдЗадачи
        hint: Номер текущего задания. Можно вставить сохранённый номер для просмотра результата.
        kind: ПолеВвода
        name: ИдЗадачи
        readonly: false
        title:
          ru: Номер задания
    kind: ГруппаФормы
    name: Очередь
    title:
      ru: Фоновое выполнение
form:
  entity: ЗакрытиеМесяца
  kind: processor
  name: ФормаОбъекта
  title:
    ru: Закрытие месяца и расчёт себестоимости
schema: onebase.form/v1
