attributes:
  - main: true
    name: Объект
    save: true
    type: DocumentRef.ОприходованиеТоваров
elements:
  - children:
      - children:
          - children:
              - data_path: Объект.Номер
                hint: "ОПР-NNNNN"
                kind: ПолеВвода
                name: ПолеНомер
                readonly: true
                title:
                  de: "Nummer"
                  en: "Number"
                  ru: "Номер"
                  sr: "Број"
              - data_path: Объект.Дата
                kind: ПолеВвода
                name: ПолеДата
                required: true
                title:
                  de: "Datum"
                  en: "Date"
                  ru: "Дата"
                  sr: "Датум"
              - choice: true
                data_path: Объект.Организация
                kind: ПолеВвода
                name: ПолеОрганизация
                title:
                  de: "Organisation"
                  en: "Organization"
                  ru: "Организация"
                  sr: "Организација"
              - choice: true
                data_path: Объект.Склад
                kind: ПолеВвода
                name: ПолеСклад
                required: true
                title:
                  de: "Lager"
                  en: "Warehouse"
                  ru: "Склад"
                  sr: "Магацин"
              - data_path: Объект.Причина
                kind: ПолеВвода
                name: ПолеПричина
                title:
                  de: "Grund"
                  en: "Reason"
                  ru: "Причина"
                  sr: "Разлог"
              - data_path: Объект.Сумма
                kind: ПолеВвода
                name: ПолеСумма
                readonly: true
                title:
                  de: "Aufnahmesumme"
                  en: "Receipt amount"
                  ru: "Сумма оприходования"
                  sr: "Износ пријема"
            kind: ГруппаФормы
            name: ГруппаШапка
            title:
              de: "Belegkopf"
              en: "Document header"
              ru: "Шапка документа"
              sr: "Заглавље документа"
          - children:
              - data_path: Объект.Товары
                events:
                  ПриИзменении: ТабТоварыПриИзменении
                kind: ТабличнаяЧасть
                name: ТабТовары
                title:
                  de: "Artikel"
                  en: "Items"
                  ru: "Товары"
                  sr: "Артикли"
                use_grid: true
              - events:
                  Нажатие: КнопкаПересчитатьНажатие
                kind: Кнопка
                name: КнопкаПересчитать
                title:
                  de: "Neu berechnen"
                  en: "Recalculate"
                  ru: "Пересчитать суммы"
                  sr: "Прерачунај"
              - events:
                  Нажатие: КнопкаОчиститьНажатие
                kind: Кнопка
                name: КнопкаОчистить
                title:
                  de: "Leeren"
                  en: "Clear table"
                  ru: "Очистить таблицу"
                  sr: "Обриши табелу"
            kind: ГруппаФормы
            name: ГруппаТабЧасть
            title:
              de: "Aufnahmepositionen"
              en: "Items to receive"
              ru: "Оприходуемые товары"
              sr: "Ставке за пријем"
        kind: Страница
        name: СтраницаОсновное
        title:
          de: "Allgemein"
          en: "General"
          ru: "Основное"
          sr: "Опште"
    kind: СтраницыФормы
    name: ОсновныеЗакладки
events:
  ПередЗаписью: ПередЗаписьюФормы
  ПриЗаписи: ПриЗаписиФормы
  ПриОткрытии: ПриОткрытииФормы
form:
  auto_save_settings: true
  entity: ОприходованиеТоваров
  kind: object
  name: ФормаОбъекта
  title:
    de: "Inventaraufnahme"
    en: "Inventory receipt"
    ru: "Оприходование товаров"
    sr: "Пријем робе у магацин"
  vertical_scroll: auto
schema: onebase.form/v1
