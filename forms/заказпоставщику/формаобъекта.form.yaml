attributes:
  - main: true
    name: Объект
    save: true
    type: DocumentRef.ЗаказПоставщику
  - name: СледующийЭтап
    save: false
    type: string
elements:
  - background: '#eef2ff'
    children:
      - data_path: СледующийЭтап
        kind: Переключатель
        name: ВыборЭтапа
        options:
          - label:
              ru: Принят
            value: Принят
          - label:
              ru: НаОбеспечении
            value: НаОбеспечении
          - label:
              ru: ВРаботе
            value: ВРаботе
          - label:
              ru: Готов
            value: Готов
          - label:
              ru: Завершён
            value: Завершён
          - label:
              ru: Отменён
            value: Отменён
        title:
          ru: Перевести на этап
        view: select
      - events:
          Нажатие: ПрименитьЭтап
        kind: Кнопка
        name: ПрименитьЭтап
        title:
          ru: Перевести заказ
    kind: ГруппаФормы
    name: ГруппаМаршрут
    title:
      ru: Обработка заказа
  - children:
      - children:
          - background: '#eff6ff'
            children:
              - data_path: Объект.Номер
                hint: ЗПС-NNNNN
                kind: ПолеВвода
                name: ПолеНомер
                readonly: true
                title:
                  de: Nummer
                  en: Number
                  ru: Номер
                  sr: Број
              - data_path: Объект.Дата
                kind: ПолеВвода
                name: ПолеДата
                required: true
                title:
                  de: Datum
                  en: Date
                  ru: Дата
                  sr: Датум
              - choice: true
                data_path: Объект.Организация
                kind: ПолеВвода
                name: ПолеОрганизация
                title:
                  de: Organisation
                  en: Organization
                  ru: Организация
                  sr: Организација
            kind: ГруппаФормы
            name: ГруппаШапка
            title:
              de: Belegkopf
              en: Document header
              ru: Шапка документа
              sr: Заглавље документа
          - background: '#f0fdf4'
            children:
              - data_path: Объект.СуммаБезНДС
                kind: ПолеВвода
                name: ПолеСуммаБезНДС
                readonly: true
                title:
                  de: Betrag o. USt.
                  en: Amount excl. VAT
                  ru: Сумма без НДС
                  sr: Износ без ПДВ
              - data_path: Объект.СуммаНДС
                kind: ПолеВвода
                name: ПолеСуммаНДС
                readonly: true
                title:
                  de: USt.-Betrag
                  en: VAT amount
                  ru: Сумма НДС
                  sr: Износ ПДВ
              - data_path: Объект.Сумма
                hint: Рассчитывается автоматически из строк табличной части
                kind: ПолеВвода
                name: ПолеСумма
                readonly: true
                title:
                  de: Gesamt
                  en: Total
                  ru: Всего
                  sr: Укупно
            kind: ГруппаФормы
            name: ГруппаИтоги
            title:
              de: Summen
              en: Totals
              ru: Итоги
              sr: Укупно
        kind: Страница
        name: СтраницаОсновное
        title:
          de: Allgemein
          en: General
          ru: Основное
          sr: Опште
      - children:
          - background: '#eff6ff'
            children:
              - choice: true
                data_path: Объект.Поставщик
                kind: ПолеВвода
                name: ПолеПоставщик
                required: true
                title:
                  de: Lieferant
                  en: Supplier
                  ru: Поставщик
                  sr: Добављач
              - choice: true
                data_path: Объект.Склад
                kind: ПолеВвода
                name: ПолеСклад
                required: true
                title:
                  de: Lager
                  en: Warehouse
                  ru: Склад
                  sr: Магацин
              - choice: true
                data_path: Объект.СпособУчетаНДС
                events:
                  ПриИзменении: СпособУчетаНДСПриИзменении
                hint: ВТомЧисле — НДС включён в сумму, Сверху — НДС сверху
                kind: ПолеВвода
                name: ПолеСпособУчетаНДС
                title:
                  de: USt.
                  en: VAT
                  ru: НДС
                  sr: ПДВ
              - data_path: Объект.Комментарий
                kind: ПолеВвода
                name: ПолеКомментарий
                title:
                  de: Kommentar
                  en: Comment
                  ru: Комментарий
                  sr: Коментар
            kind: ГруппаФормы
            name: ГруппаРеквизиты
            title:
              de: Lieferantendaten
              en: Supplier details
              ru: Реквизиты поставщика
              sr: Подаци о добављачу
        kind: Страница
        name: СтраницаКонтрагент
        title:
          de: Lieferant & Lager
          en: Supplier & warehouse
          ru: Поставщик и склад
          sr: Добављач и магацин
      - children:
          - background: '#f8fafc'
            children:
              - data_path: Объект.Товары
                events:
                  ПриИзменении: ТабТоварыПриИзменении
                kind: ТабличнаяЧасть
                name: ТабТовары
                title:
                  de: Artikel
                  en: Items
                  ru: Товары
                  sr: Артикли
                use_grid: true
              - events:
                  Нажатие: КнопкаПересчитатьНажатие
                kind: Кнопка
                name: КнопкаПересчитать
                title:
                  de: Neu berechnen
                  en: Recalculate
                  ru: Пересчитать суммы
                  sr: Прерачунај
              - events:
                  Нажатие: КнопкаОчиститьНажатие
                kind: Кнопка
                name: КнопкаОчистить
                title:
                  de: Leeren
                  en: Clear table
                  ru: Очистить таблицу
                  sr: Обриши табелу
            kind: ГруппаФормы
            name: ГруппаТабЧасть
            title:
              de: Bestellungsinhalt
              en: Order contents
              ru: Состав заказа
              sr: Садржај налога
        kind: Страница
        name: СтраницаТовары
        title:
          de: Artikel
          en: Items
          ru: Товары
          sr: Артикли
    kind: СтраницыФормы
    name: ОсновныеЗакладки
events:
  ПередЗаписью: ПередЗаписьюФормы
  ПриЗаписи: ПриЗаписиФормы
  ПриОткрытии: ПриОткрытииФормы
form:
  auto_save_settings: true
  entity: ЗаказПоставщику
  kind: object
  name: ФормаОбъекта
  title:
    de: Lieferantenbestellung
    en: Purchase order
    ru: Заказ поставщику
    sr: Налог добављачу
  vertical_scroll: auto
schema: onebase.form/v1
