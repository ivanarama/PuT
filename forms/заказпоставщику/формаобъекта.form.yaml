schema: onebase.form/v1

form:
  name: ФормаОбъекта
  kind: object
  entity: ЗаказПоставщику
  title:
    ru: "Заказ поставщику"
    en: "Purchase order"
    de: "Lieferantenbestellung"
    sr: "Налог добављачу"
  auto_save_settings: true
  vertical_scroll: auto

attributes:
  - name: Объект
    type: DocumentRef.ЗаказПоставщику
    save: true
    main: true

elements:
  - kind: СтраницыФормы
    name: ОсновныеЗакладки
    children:

      - kind: Страница
        name: СтраницаОсновное
        title:
          ru: "Основное"
          en: "General"
          de: "Allgemein"
          sr: "Опште"
        children:
          - kind: ГруппаФормы
            name: ГруппаШапка
            title:
              ru: "Шапка документа"
              en: "Document header"
              de: "Belegkopf"
              sr: "Заглавље документа"
            children:
              - kind: ПолеВвода
                name: ПолеНомер
                title:
                  ru: "Номер"
                  en: "Number"
                  de: "Nummer"
                  sr: "Број"
                data_path: Объект.Номер
                readonly: true
                hint: "ЗПС-NNNNN"
              - kind: ПолеВвода
                name: ПолеДата
                title:
                  ru: "Дата"
                  en: "Date"
                  de: "Datum"
                  sr: "Датум"
                data_path: Объект.Дата
                required: true
                events:
                  ПриИзменении: ДатаПриИзменении
              - kind: ПолеВвода
                name: ПолеОрганизация
                title:
                  ru: "Организация"
                  en: "Organization"
                  de: "Organisation"
                  sr: "Организација"
                data_path: Объект.Организация
                choice: true

          - kind: ГруппаФормы
            name: ГруппаИтоги
            title:
              ru: "Итоги"
              en: "Totals"
              de: "Summen"
              sr: "Укупно"
            children:
              - kind: ПолеВвода
                name: ПолеСуммаБезНДС
                title:
                  ru: "Сумма без НДС"
                  en: "Amount excl. VAT"
                  de: "Betrag o. USt."
                  sr: "Износ без ПДВ"
                data_path: Объект.СуммаБезНДС
                readonly: true
              - kind: ПолеВвода
                name: ПолеСуммаНДС
                title:
                  ru: "Сумма НДС"
                  en: "VAT amount"
                  de: "USt.-Betrag"
                  sr: "Износ ПДВ"
                data_path: Объект.СуммаНДС
                readonly: true
              - kind: ПолеВвода
                name: ПолеСумма
                title:
                  ru: "Всего"
                  en: "Total"
                  de: "Gesamt"
                  sr: "Укупно"
                data_path: Объект.Сумма
                readonly: true
                hint: "Рассчитывается автоматически из строк табличной части"

      - kind: Страница
        name: СтраницаКонтрагент
        title:
          ru: "Поставщик и склад"
          en: "Supplier & warehouse"
          de: "Lieferant & Lager"
          sr: "Добављач и магацин"
        children:
          - kind: ГруппаФормы
            name: ГруппаРеквизиты
            title:
              ru: "Реквизиты поставщика"
              en: "Supplier details"
              de: "Lieferantendaten"
              sr: "Подаци о добављачу"
            children:
              - kind: ПолеВвода
                name: ПолеПоставщик
                title:
                  ru: "Поставщик"
                  en: "Supplier"
                  de: "Lieferant"
                  sr: "Добављач"
                data_path: Объект.Поставщик
                required: true
                choice: true
                events:
                  ПриИзменении: ПоставщикПриИзменении
              - kind: ПолеВвода
                name: ПолеСклад
                title:
                  ru: "Склад"
                  en: "Warehouse"
                  de: "Lager"
                  sr: "Магацин"
                data_path: Объект.Склад
                required: true
                choice: true
                events:
                  ПриИзменении: СкладПриИзменении
              - kind: ПолеВвода
                name: ПолеСпособУчетаНДС
                title:
                  ru: "НДС"
                  en: "VAT"
                  de: "USt."
                  sr: "ПДВ"
                data_path: Объект.СпособУчетаНДС
                choice: true
                hint: "ВТомЧисле — НДС включён в сумму, Сверху — НДС сверху"
                events:
                  ПриИзменении: СпособУчетаНДСПриИзменении
              - kind: ПолеВвода
                name: ПолеКомментарий
                title:
                  ru: "Комментарий"
                  en: "Comment"
                  de: "Kommentar"
                  sr: "Коментар"
                data_path: Объект.Комментарий

      - kind: Страница
        name: СтраницаТовары
        title:
          ru: "Товары"
          en: "Items"
          de: "Artikel"
          sr: "Артикли"
        children:
          - kind: ГруппаФормы
            name: ГруппаТабЧасть
            title:
              ru: "Состав заказа"
              en: "Order contents"
              de: "Bestellungsinhalt"
              sr: "Садржај налога"
            children:
              - kind: ТабличнаяЧасть
                name: ТабТовары
                title:
                  ru: "Товары"
                  en: "Items"
                  de: "Artikel"
                  sr: "Артикли"
                data_path: Объект.Товары
              - kind: Кнопка
                name: КнопкаПересчитать
                title:
                  ru: "Пересчитать суммы"
                  en: "Recalculate"
                  de: "Neu berechnen"
                  sr: "Прерачунај"
                events:
                  Нажатие: КнопкаПересчитатьНажатие
              - kind: Кнопка
                name: КнопкаОчистить
                title:
                  ru: "Очистить таблицу"
                  en: "Clear table"
                  de: "Leeren"
                  sr: "Обриши табелу"
                events:
                  Нажатие: КнопкаОчиститьНажатие

events:
  ПриОткрытии: ПриОткрытииФормы
  ПередЗаписью: ПередЗаписьюФормы
  ПриЗаписи: ПриЗаписиФормы
