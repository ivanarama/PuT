attributes:
  - main: true
    name: Объект
elements:
  - children:
      - children:
          - background: '#eff6ff'
            children:
              - data_path: Объект.Дата
                kind: ПолеВвода
                name: ПолеДата
                required: true
                title:
                  de: Datum
                  en: Date
                  ru: Дата
                  sr: Датум
              - choice: true
                data_path: Объект.Организация
                kind: ПолеВвода
                name: ПолеОрганизация
                title:
                  de: Organisation
                  en: Organization
                  ru: Организация
                  sr: Организација
              - choice: true
                data_path: Объект.Склад
                hint: Дефицит считается по остаткам этого склада
                kind: ПолеВвода
                name: ПолеСклад
                required: true
                title:
                  de: Lager
                  en: Warehouse
                  ru: Склад
                  sr: Магацин
              - choice: true
                data_path: Объект.Поставщик
                hint: Кому создавать заказы на дефицит
                kind: ПолеВвода
                name: ПолеПоставщик
                required: true
                title:
                  de: Lieferant
                  en: Supplier
                  ru: Поставщик
                  sr: Добављач
            kind: ГруппаФормы
            name: ГруппаШапка
            title:
              de: Berechnungsparameter
              en: Calculation parameters
              ru: Параметры расчёта
              sr: Параметри обрачуна
        kind: Страница
        name: СтраницаОсновное
        title:
          de: Parameter
          en: Parameters
          ru: Параметры
          sr: Параметри
      - children:
          - background: '#f8fafc'
            children:
              - children:
                  - events:
                      Нажатие: КнопкаРассчитатьНажатие
                    hint: Резервы покупателей минус остаток и товары в пути
                    kind: Кнопка
                    name: КнопкаРассчитать
                    title:
                      de: Bedarf berechnen
                      en: Calculate demand
                      ru: 1️⃣ Рассчитать потребность
                      sr: Израчунај потребу
                  - events:
                      Нажатие: КнопкаОчиститьНажатие
                    kind: Кнопка
                    name: КнопкаОчистить
                    title:
                      de: Leeren
                      en: Clear
                      ru: Очистить
                      sr: Обриши
                data_path: Потребность
                events:
                  ПриИзменении: ТабПотребностьПриИзменении
                kind: ТабличнаяЧасть
                name: ТабПотребность
                title:
                  de: Bedarf
                  en: Demand
                  ru: Потребность
                  sr: Потреба
                use_grid: true
            kind: ГруппаФормы
            name: ГруппаТабЧасть
            title:
              de: Fehlmenge = Reserve − Bestand − unterwegs
              en: Shortage = reserve − stock − in transit
              ru: Дефицит = резерв − остаток − в пути
              sr: Мањак = резерва − стање − у путу
          - background: '#eef2ff'
            children:
              - events:
                  Нажатие: КнопкаСоздатьЗаказНажатие
                hint: По строкам с «К заказу» > 0 создаётся и проводится ЗаказПоставщику
                kind: Кнопка
                name: КнопкаСоздатьЗаказ
                title:
                  de: Bestellung erstellen
                  en: Create purchase order
                  ru: 2️⃣ Создать заказ поставщику
                  sr: Креирај налог
            kind: ГруппаФормы
            name: ГруппаДействия
            title:
              de: Bestellung
              en: Purchase order
              ru: Заказ поставщику
              sr: Налог добављачу
        kind: Страница
        name: СтраницаПотребность
        title:
          de: Bedarf
          en: Demand
          ru: Потребность
          sr: Потреба
    kind: СтраницыФормы
    name: ОсновныеЗакладки
events:
  ПриОткрытии: ПриОткрытииФормы
form:
  auto_save_settings: true
  entity: ПланЗакупок
  kind: object
  name: ФормаОбъекта
  title:
    de: Einkaufsplanung
    en: Purchase planning
    ru: АРМ Закупок
    sr: Планирање набавке
  vertical_scroll: auto
schema: onebase.form/v1
