attributes:
  - main: true
    name: Объект
    save: true
    type: DocumentRef.РеализацияТоваров
  - name: КешИтога
    save: false
    type: "decimal(15,2)"
commands:
  - action: КнопкаПересчитатьНажатие
    name: ПересчитатьКоманда
    picture: stdpic:Refresh
    title:
      de: "Summen neu berechnen"
      en: "Recalculate totals"
      ru: "Пересчитать итоги"
      sr: "Прерачунај укупно"
elements:
  - children:
      - children:
          - children:
              - data_path: Объект.Номер
                hint: "РЕА-NNNNN"
                kind: ПолеВвода
                name: ПолеНомер
                readonly: true
                title:
                  de: "Nummer"
                  en: "Number"
                  ru: "Номер"
                  sr: "Број"
                width: 220
              - data_path: Объект.Дата
                events:
                  ПриИзменении: ДатаПриИзменении
                hint: "Дата совершения отгрузки покупателю"
                kind: ПолеВвода
                name: ПолеДата
                required: true
                title:
                  de: "Datum"
                  en: "Date"
                  ru: "Дата"
                  sr: "Датум"
                width: 220
              - data_path: Объект.СрокОплаты
                kind: ПолеВвода
                name: ПолеСрокОплаты
                title:
                  de: "Zahlungsziel"
                  en: "Payment due"
                  ru: "Срок оплаты"
                  sr: "Rok plaćanja"
                width: 220
            kind: ГруппаФормы
            name: ГруппаШапка
            title:
              de: "Belegkopf"
              en: "Document header"
              ru: "Шапка документа"
              sr: "Заглавље документа"
            orientation: horizontal
          - children:
              - choice: true
                data_path: Объект.Покупатель
                events:
                  ПриИзменении: ПокупательПриИзменении
                hint: "Контрагент-получатель отгрузки"
                kind: ПолеВвода
                name: ПолеПокупатель
                required: true
                title:
                  de: "Kunde"
                  en: "Customer"
                  ru: "Покупатель"
                  sr: "Купац"
                width: 320
              - choice: true
                data_path: Объект.Склад
                hint: "Со склада списываются остатки при проведении (ФИФО)"
                kind: ПолеВвода
                name: ПолеСклад
                required: true
                title:
                  de: "Lager"
                  en: "Warehouse"
                  ru: "Склад"
                  sr: "Магацин"
                width: 320
              - choice: true
                data_path: Объект.ТипЦенПродажи
                events:
                  ПриИзменении: ТипЦенПродажиПриИзменении
                hint: "Заполняется автоматически из карточки покупателя"
                kind: ПолеВвода
                name: ПолеТипЦенПродажи
                title:
                  de: "Verkaufspreistyp"
                  en: "Sales price type"
                  ru: "Тип цен продажи"
                  sr: "Тип цене продаје"
                width: 320
              - choice: true
                data_path: Объект.СпособУчетаНДС
                events:
                  ПриИзменении: СпособУчетаНДСПриИзменении
                hint: "ВТомЧисле — НДС включён в сумму, Сверху — НДС сверху"
                kind: ПолеВвода
                name: ПолеСпособУчетаНДС
                title:
                  de: "USt."
                  en: "VAT"
                  ru: "НДС"
                  sr: "ПДВ"
                width: 320
            kind: ГруппаФормы
            name: ГруппаКонтрагент
            title:
              de: "Kundendaten"
              en: "Customer details"
              ru: "Реквизиты покупателя"
              sr: "Подаци о купцу"
            orientation: horizontal
          - children:
              - data_path: Объект.СуммаБезНДС
                kind: ПолеВвода
                name: ПолеСуммаБезНДС
                readonly: true
                title:
                  de: "Betrag o. USt."
                  en: "Amount excl. VAT"
                  ru: "Сумма без НДС"
                  sr: "Износ без ПДВ"
                width: 220
              - data_path: Объект.СуммаНДС
                kind: ПолеВвода
                name: ПолеСуммаНДС
                readonly: true
                title:
                  de: "USt.-Betrag"
                  en: "VAT amount"
                  ru: "Сумма НДС"
                  sr: "Износ ПДВ"
                width: 220
              - data_path: Объект.Сумма
                hint: "Рассчитывается автоматически из строк табличной части"
                kind: ПолеВвода
                name: ПолеСумма
                readonly: true
                title:
                  de: "Gesamtbetrag"
                  en: "Total payable"
                  ru: "Всего к оплате"
                  sr: "Укупно за плаћање"
                width: 220
            kind: ГруппаФормы
            name: ГруппаИтоги
            title:
              de: "Summen"
              en: "Totals"
              ru: "Итоги"
              sr: "Укупно"
            orientation: horizontal
            background: '#eff6ff'
        kind: Страница
        name: СтраницаОсновное
        title:
          de: "Allgemein"
          en: "General"
          ru: "Основное"
          sr: "Опште"
      - children:
          - children:
              - children:
                  - events:
                      Выбор: КнопкаПодборВыбор
                      Нажатие: КнопкаПодборНажатие
                    hint: "Подобрать товары со свободным остатком на складе"
                    kind: Кнопка
                    name: КнопкаПодбор
                    title:
                      de: "Auswahl"
                      en: "Pick items"
                      ru: "Подбор"
                      sr: "Избор"
                  - events:
                      Нажатие: КнопкаПересчитатьНажатие
                    hint: "Пересчитать сумму и НДС по каждой строке"
                    kind: Кнопка
                    name: КнопкаПересчитать
                    title:
                      de: "Summen neu berechnen"
                      en: "Recalculate amounts"
                      ru: "Пересчитать суммы"
                      sr: "Прерачунај износе"
                  - events:
                      Нажатие: КнопкаОчиститьНажатие
                    kind: Кнопка
                    name: КнопкаОчистить
                    title:
                      de: "Tabelle leeren"
                      en: "Clear table"
                      ru: "Очистить таблицу"
                      sr: "Обриши табелу"
                data_path: Объект.Товары
                events:
                  ПриИзменении: ТабТоварыПриИзменении
                kind: ТабличнаяЧасть
                name: ТабТовары
                title:
                  de: "Artikel"
                  en: "Items"
                  ru: "Товары"
                  sr: "Артикли"
                use_grid: true
            kind: ГруппаФормы
            name: ГруппаТабЧасть
            title:
              de: "Lieferumfang"
              en: "Shipment contents"
              ru: "Состав отгрузки"
              sr: "Садржај испоруке"
        kind: Страница
        name: СтраницаТовары
        title:
          de: "Artikel"
          en: "Items"
          ru: "Товары"
          sr: "Артикли"
      - children:
          - kind: ГруппаФормы
            name: ГруппаДополнительно
            title:
              ru: Дополнительные реквизиты
              en: Additional details
              de: Weitere Angaben
              sr: Додатни подаци
            children:
              - choice: true
                data_path: Объект.Организация
                hint: "Заполняется автоматически, если не указана"
                kind: ПолеВвода
                name: ПолеОрганизация
                title:
                  de: "Organisation"
                  en: "Organization"
                  ru: "Организация"
                  sr: "Организација"
                width: 320
              - choice: true
                data_path: Объект.ЗаказПокупателя
                hint: "Заказ, по которому отгружается товар (снимает резерв)"
                kind: ПолеВвода
                name: ПолеЗаказПокупателя
                title:
                  de: "Kundenauftrag"
                  en: "Sales order"
                  ru: "Заказ покупателя"
                  sr: "Налог купца"
                width: 320
              - choice: true
                data_path: Объект.Основание
                hint: "Счёт, на основании которого создана реализация"
                kind: ПолеВвода
                name: ПолеОснование
                title:
                  de: "Beleggrundlage"
                  en: "Base document"
                  ru: "Основание"
                  sr: "Основни документ"
                width: 320
            orientation: horizontal
        kind: Страница
        name: СтраницаКонтрагент
        title:
          ru: Дополнительно
          en: Details
          de: Weitere Angaben
          sr: Додатно
    kind: СтраницыФормы
    name: ОсновныеЗакладки
events:
  ПередЗаписью: ПередЗаписьюФормы
  ПриЗаписи: ПриЗаписиФормы
  ПриОткрытии: ПриОткрытииФормы
form:
  auto_save_settings: true
  entity: РеализацияТоваров
  kind: object
  name: ФормаОбъекта
  title:
    de: "Warenverkauf"
    en: "Sales of goods"
    ru: "Реализация товаров"
    sr: "Продаја робе"
  vertical_scroll: auto
schema: onebase.form/v1
