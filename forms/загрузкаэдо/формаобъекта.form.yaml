            kind: ГруппаФормы
            name: ГруппаФайл
            title:
              en: EDO File (UPD XML)
              ru: Файл электронного документа (УПД XML)
          - background: '#eff6ff'
            children:
              - choice: true
                data_path: Объект.Организация
                kind: ПолеВвода
                name: ПолеОрганизация
