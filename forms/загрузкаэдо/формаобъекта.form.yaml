                  ru: "\U0001F4C4 Создать Поступление товаров"
              - events:
                  Нажатие: КнопкаСоздатьИПровестиНажатие
                kind: Кнопка
                name: КнопкаСоздатьИПровести
                title:
                  en: Create & Post Receipt
                  ru: "\U0001F680 Создать и провести Поступление"
            kind: ГруппаФормы
            name: ГруппаДействия
            title:
              en: Create receipt
              ru: Оформление поступления
        kind: Страница
        name: СтраницаСопоставление
        title:
          en: 2. Matching table & Creation
          ru: 2. Таблица сопоставления и создание документа
    kind: СтраницыФормы
    name: ОсновныеЗакладки
