                  en: Organization
                  ru: Организация (Покупатель)
              - choice: true
                data_path: Объект.Поставщик
                kind: ПолеВвода
                name: ПолеПоставщик
                title:
                  en: Supplier
                  ru: Поставщик (Продавец)
              - choice: true
                data_path: Объект.Склад
                kind: ПолеВвода
                name: ПолеСклад
                title:
                  en: Warehouse
                  ru: Склад поступления
              - data_path: Объект.Договор
                id: ПолеДоговор
                kind: ПолеВвода
                name: ПолеДоговор
                title:
