attributes:
  - main: true
    name: Объект
elements:
  - children:
      - children:
          - background: '#eff6ff'
            children:
              - data_path: Объект.Дата
                kind: ПолеВвода
                name: ПолеДата
                required: true
                title:
                  de: Datum
                  en: Date
                  ru: Дата
                  sr: Датум
              - choice: true
                data_path: Объект.Организация
                kind: ПолеВвода
                name: ПолеОрганизация
                title:
                  de: Organisation
                  en: Organization
                  ru: Организация
                  sr: Организација
              - choice: true
                data_path: Объект.Касса
                hint: Наличная касса для приёма/выдачи (ПКО/РКО)
                kind: ПолеВвода
                name: ПолеКасса
                required: true
                title:
                  de: Kasse
                  en: Cash desk
                  ru: Касса
                  sr: Каса
            kind: ГруппаФормы
            name: ГруппаШапка
            title:
              de: Parameter
              en: Parameters
              ru: Параметры
              sr: Параметри
        kind: Страница
        name: СтраницаОсновное
        title:
          de: Kasse
          en: Cash desk
          ru: Касса
          sr: Каса
      - children:
          - background: '#f8fafc'
            children:
              - children:
                  - events:
                      Нажатие: КнопкаРассчитатьНажатие
                    hint: Сальдо взаиморасчётов по контрагентам организации
                    kind: Кнопка
                    name: КнопкаРассчитать
                    title:
                      de: Schulden berechnen
                      en: Calculate debts
                      ru: 1️⃣ Рассчитать долги
                      sr: Израчунај дугове
                  - events:
                      Нажатие: КнопкаОчиститьНажатие
                    kind: Кнопка
                    name: КнопкаОчистить
                    title:
                      de: Leeren
                      en: Clear
                      ru: Очистить
                      sr: Обриши
                data_path: Долги
                kind: ТабличнаяЧасть
                name: ТабДолги
                title:
                  de: Schulden
                  en: Debts
                  ru: Долги
                  sr: Дугови
                use_grid: true
            kind: ГруппаФормы
            name: ГруппаТабЧасть
            title:
              de: 'Saldo: + uns geschuldet, − von uns geschuldet'
              en: 'Balance: + owed to us, − owed by us'
              ru: 'Сальдо: + должны нам (покупатели), − должны мы (поставщики)'
              sr: 'Салдо: + нама дугују, − ми дугујемо'
          - background: '#eef2ff'
            children:
              - events:
                  Нажатие: КнопкаПринятьОплатуНажатие
                hint: По покупателям с долгом нам создаются приходные кассовые ордера
                kind: Кнопка
                name: КнопкаПринятьОплату
                title:
                  de: Zahlung annehmen
                  en: Receive payment
                  ru: 2️⃣ Принять оплату (ПКО)
                  sr: Прими уплату
              - events:
                  Нажатие: КнопкаОплатитьПоставщикуНажатие
                hint: По поставщикам, которым должны мы, создаются расходные кассовые ордера
                kind: Кнопка
                name: КнопкаОплатитьПоставщику
                title:
                  de: Lieferant bezahlen
                  en: Pay supplier
                  ru: 3️⃣ Оплатить поставщику (РКО)
                  sr: Плати добављачу
            kind: ГруппаФормы
            name: ГруппаДействия
            title:
              de: Zahlungen
              en: Payments
              ru: Оплаты
              sr: Плаћања
        kind: Страница
        name: СтраницаДолги
        title:
          de: Schulden
          en: Debts
          ru: Долги
          sr: Дугови
    kind: СтраницыФормы
    name: ОсновныеЗакладки
events:
  ПриОткрытии: ПриОткрытииФормы
form:
  auto_save_settings: true
  entity: РабочееМестоКассира
  kind: object
  name: ФормаОбъекта
  title:
    de: Kassierer-Arbeitsplatz
    en: Cashier workplace
    ru: АРМ Кассира
    sr: Радно место касира
  vertical_scroll: auto
schema: onebase.form/v1
