attributes:
  - main: true
    name: Объект
    save: true
    type: DocumentRef.ЗаказПокупателя
elements:
  - children:
      - children:
          - children:
              - data_path: Объект.Номер
                hint: "ЗПК-NNNNN"
                kind: ПолеВвода
                name: ПолеНомер
                readonly: true
                title:
                  de: "Nummer"
                  en: "Number"
                  ru: "Номер"
                  sr: "Број"
                width: 220
              - data_path: Объект.Дата
                kind: ПолеВвода
                name: ПолеДата
                required: true
                title:
                  de: "Datum"
                  en: "Date"
                  ru: "Дата"
                  sr: "Датум"
                width: 220
            kind: ГруппаФормы
            name: ГруппаШапка
            title:
              de: "Belegkopf"
              en: "Document header"
              ru: "Шапка документа"
              sr: "Заглавље документа"
            orientation: horizontal
          - children:
              - choice: true
                data_path: Объект.Покупатель
                events:
                  ПриИзменении: ПокупательПриИзменении
                kind: ПолеВвода
                name: ПолеПокупатель
                required: true
                title:
                  de: "Kunde"
                  en: "Customer"
                  ru: "Покупатель"
                  sr: "Купац"
                width: 320
              - choice: true
                data_path: Объект.Склад
                kind: ПолеВвода
                name: ПолеСклад
                required: true
                title:
                  de: "Lager"
                  en: "Warehouse"
                  ru: "Склад"
                  sr: "Магацин"
                width: 320
              - choice: true
                data_path: Объект.ТипЦенПродажи
                events:
                  ПриИзменении: ТипЦенПродажиПриИзменении
                hint: "Заполняется автоматически из карточки покупателя"
                kind: ПолеВвода
                name: ПолеТипЦенПродажи
                title:
                  de: "Verkaufspreistyp"
                  en: "Sales price type"
                  ru: "Тип цен продажи"
                  sr: "Тип цене продаје"
                width: 320
              - choice: true
                data_path: Объект.СпособУчетаНДС
                events:
                  ПриИзменении: СпособУчетаНДСПриИзменении
                hint: "ВТомЧисле — НДС включён в сумму, Сверху — НДС сверху"
                kind: ПолеВвода
                name: ПолеСпособУчетаНДС
                title:
                  de: "USt."
                  en: "VAT"
                  ru: "НДС"
                  sr: "ПДВ"
                width: 320
            kind: ГруппаФормы
            name: ГруппаКонтрагент
            title:
              de: "Kundendaten"
              en: "Customer details"
              ru: "Реквизиты покупателя"
              sr: "Подаци о купцу"
            orientation: horizontal
          - children:
              - data_path: Объект.СуммаБезНДС
                kind: ПолеВвода
                name: ПолеСуммаБезНДС
                readonly: true
                title:
                  de: "Betrag o. USt."
                  en: "Amount excl. VAT"
                  ru: "Сумма без НДС"
                  sr: "Износ без ПДВ"
                width: 220
              - data_path: Объект.СуммаНДС
                kind: ПолеВвода
                name: ПолеСуммаНДС
                readonly: true
                title:
                  de: "USt.-Betrag"
                  en: "VAT amount"
                  ru: "Сумма НДС"
                  sr: "Износ ПДВ"
                width: 220
              - data_path: Объект.Сумма
                hint: "Рассчитывается автоматически из строк табличной части"
                kind: ПолеВвода
                name: ПолеСумма
                readonly: true
                title:
                  de: "Gesamt"
                  en: "Total"
                  ru: "Всего"
                  sr: "Укупно"
                width: 220
            kind: ГруппаФормы
            name: ГруппаИтоги
            title:
              de: "Summen"
              en: "Totals"
              ru: "Итоги"
              sr: "Укупно"
            orientation: horizontal
            background: '#eff6ff'
        kind: Страница
        name: СтраницаОсновное
        title:
          de: "Allgemein"
          en: "General"
          ru: "Основное"
          sr: "Опште"
      - children:
          - children:
              - data_path: Объект.Товары
                events:
                  ПриИзменении: ТабТоварыПриИзменении
                kind: ТабличнаяЧасть
                name: ТабТовары
                title:
                  de: "Artikel"
                  en: "Items"
                  ru: "Товары"
                  sr: "Артикли"
                use_grid: true
              - events:
                  Выбор: КнопкаПодборВыбор
                  Нажатие: КнопкаПодборНажатие
                hint: "Подобрать товары со свободным остатком на складе"
                kind: Кнопка
                name: КнопкаПодбор
                title:
                  de: "Auswahl"
                  en: "Pick items"
                  ru: "Подбор"
                  sr: "Избор"
              - events:
                  Нажатие: КнопкаПересчитатьНажатие
                kind: Кнопка
                name: КнопкаПересчитать
                title:
                  de: "Neu berechnen"
                  en: "Recalculate"
                  ru: "Пересчитать суммы"
                  sr: "Прерачунај"
              - events:
                  Нажатие: КнопкаОчиститьНажатие
                kind: Кнопка
                name: КнопкаОчистить
                title:
                  de: "Leeren"
                  en: "Clear table"
                  ru: "Очистить таблицу"
                  sr: "Обриши табелу"
            kind: ГруппаФормы
            name: ГруппаТабЧасть
            title:
              de: "Auftragsinhalt"
              en: "Order contents"
              ru: "Состав заказа"
              sr: "Садржај налога"
        kind: Страница
        name: СтраницаТовары
        title:
          de: "Artikel"
          en: "Items"
          ru: "Товары"
          sr: "Артикли"
      - children:
          - kind: ГруппаФормы
            name: ГруппаДополнительно
            title:
              ru: Дополнительные реквизиты
              en: Additional details
              de: Weitere Angaben
              sr: Додатни подаци
            children:
              - choice: true
                data_path: Объект.Организация
                kind: ПолеВвода
                name: ПолеОрганизация
                title:
                  de: "Organisation"
                  en: "Organization"
                  ru: "Организация"
                  sr: "Организација"
                width: 320
              - choice: true
                data_path: Объект.Основание
                hint: "Счёт, на основании которого создан заказ"
                kind: ПолеВвода
                name: ПолеОснование
                title:
                  de: "Beleggrundlage"
                  en: "Base document"
                  ru: "Основание"
                  sr: "Основни документ"
                width: 320
              - data_path: Объект.Комментарий
                kind: ПолеВвода
                name: ПолеКомментарий
                title:
                  de: "Kommentar"
                  en: "Comment"
                  ru: "Комментарий"
                  sr: "Коментар"
                multiline: true
                halign: stretch
            orientation: horizontal
        kind: Страница
        name: СтраницаКонтрагент
        title:
          ru: Дополнительно
          en: Details
          de: Weitere Angaben
          sr: Додатно
    kind: СтраницыФормы
    name: ОсновныеЗакладки
events:
  ПередЗаписью: ПередЗаписьюФормы
  ПриЗаписи: ПриЗаписиФормы
  ПриОткрытии: ПриОткрытииФормы
form:
  auto_save_settings: true
  entity: ЗаказПокупателя
  kind: object
  name: ФормаОбъекта
  title:
    de: "Kundenauftrag"
    en: "Sales order"
    ru: "Заказ покупателя"
    sr: "Налог купца"
  vertical_scroll: auto
schema: onebase.form/v1
